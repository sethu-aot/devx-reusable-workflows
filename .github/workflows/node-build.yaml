name: "Module: Node Build"
# ------------------------------------------------------------------------------
# Node.js build with caching, unit tests, artifact upload.
# Uploads directly to Nexus
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      working_directory:
        type: string
        default: "."
      node_version:
        type: string
        default: "20"
      # --- TEST INPUTS ---
      run_tests:
        description: "Run unit tests?"
        type: boolean
        default: true
      test_script:
        description: "Script to run tests"
        type: string
        default: "test"
      # --- INSTALL INPUTS ---
      install_command:
        description: "Override the default 'npm ci' install command (e.g., 'npm install' when lock file is out of sync)"
        type: string
        default: "npm ci --prefer-offline --no-audit"

      # --- BUILD INPUTS ---
      run_build:
        description: "Enable build step?"
        type: boolean
        default: false
      build_script:
        description: "Script name (e.g., 'build') or full command (e.g., 'npm run build && tar ...')"
        type: string
        default: "build"
      artifact_path:
        type: string
        default: ""
      artifact_name:
        description: "Name of the artifact to upload. If blank, a default name will be used."
        type: string
        default: ""
      
      # --- NEXUS INPUTS ---
      nexus_url:
        description: "Nexus base URL (e.g., https://nexus.company.com)"
        type: string
        required: true
      nexus_repository:
        description: "Target repository (e.g., raw-releases or npm-hosted)"
        type: string
        default: "raw-releases"
      nexus_repo_type:
        description: "Type of Nexus repository: 'raw' or 'npm'"
        type: string
        default: "raw"
      nexus_path:
        description: "Custom upload path in Nexus (Required for 'raw' mode)"
        type: string
        default: ""
      skip_upload:
        description: "Skip uploading the artifact to Nexus (for CI-only verification)"
        type: boolean
        default: false

    secrets:
      NEXUS_USERNAME:
        description: "Nexus username"
        required: false
      NEXUS_PASSWORD:
        description: "Nexus password/token"
        required: false

    outputs:
      # --- NEXUS OUTPUTS ---
      nexus_path:
        description: "Path to artifact in Nexus"
        value: ${{ jobs.build.outputs.nexus_path }}
      artifact_file:
        description: "Artifact filename"
        value: ${{ jobs.build.outputs.artifact_file }}

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      working_directory:
        description: "Working directory"
        type: string
        default: "."
      node_version:
        description: "Node version"
        type: string
        default: "20"
      run_tests:
        description: "Run tests"
        type: boolean
        default: true
      test_script:
        description: "Test script"
        type: string
        default: "test"
      run_build:
        description: "Run build"
        type: boolean
        default: false
      build_script:
        description: "Build script"
        type: string
        default: "build"
      artifact_path:
        description: "Artifact path"
        type: string
        default: ""
      nexus_url:
        description: "Nexus URL"
        type: string
        default: ""
      nexus_repository:
        description: "Nexus Repository"
        type: string
        default: "raw-releases"
      nexus_repo_type:
        description: "Nexus Repo Type (raw/npm)"
        type: string
        default: "raw"
      upload_to_nexus:
        description: "Upload to Nexus"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read           # artifact + SARIF metadata

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    outputs:
      nexus_path: ${{ steps.upload_nexus.outputs.path }}
      artifact_file: ${{ steps.detect_artifact.outputs.filename || steps.upload_nexus.outputs.filename }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: Install Dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install_command }}
        run: |
          set -euo pipefail
          # This input is executed as a shell command by design: it comes from
          # the consuming repository's own devx-ci.yaml, which is already trusted
          # to the same degree as its build scripts.
          eval "$INSTALL_COMMAND"

      - name: Run Unit Tests
        if: inputs.run_tests == true
        env:
          TEST_SCRIPT: ${{ inputs.test_script }}
        run: |
          # Check if test script exists in package.json (robust check)
          if npm run --json 2>/dev/null | jq -e ".\"$TEST_SCRIPT\"" > /dev/null 2>&1; then
            npm run "$TEST_SCRIPT"
          elif npm run 2>/dev/null | grep -q "^  $TEST_SCRIPT$"; then
            # Fallback for npm versions without --json support
            npm run "$TEST_SCRIPT"
          else
            echo "::warning::Test script '$TEST_SCRIPT' not found in package.json. Skipping tests."
          fi

      - name: Upload Test Results
        if: always() && inputs.run_tests == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-test-results-${{ github.run_id }}
          path: |
            ${{ inputs.working_directory }}/coverage/
            ${{ inputs.working_directory }}/test-results/
            ${{ inputs.working_directory }}/junit.xml
          retention-days: 30
          if-no-files-found: ignore

      - name: Build Application
        if: inputs.run_build == true
        env:
          BUILD_SCRIPT: ${{ inputs.build_script }}
        run: |
          # Security: Validate build_script doesn't contain dangerous characters
          if [[ "$BUILD_SCRIPT" =~ [\$\`] ]]; then
            echo "::error::Invalid characters detected in build_script (potential injection)"
            exit 1
          fi
          
          # If build_script is a script name in package.json, use npm run
          # Otherwise, execute it as a validated shell command
          if npm run | grep -q "^  $BUILD_SCRIPT$"; then
            echo "🚀 Running npm script: $BUILD_SCRIPT"
            npm run "$BUILD_SCRIPT"
          else
            echo "🚀 Running custom build command: $BUILD_SCRIPT"
            eval "$BUILD_SCRIPT"
          fi

      # --- DETECT ARTIFACT FILE ---
      - name: Detect Artifact File
        if: inputs.artifact_path != ''
        id: detect_artifact
        env:
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
        run: |
          # Enable recursive globbing (**)
          shopt -s globstar
          shopt -s nullglob
          # Find the actual file from artifact_path pattern
          # Intentionally unquoted: artifact_path is a glob pattern and must
          # be expanded. Parameter expansion cannot inject commands here.
          # shellcheck disable=SC2206
          ARTIFACT_FILES=($ARTIFACT_PATH)
          
          if [[ ${#ARTIFACT_FILES[@]} -eq 0 ]]; then
            echo "::error::No files found matching pattern: ${ARTIFACT_PATH}"
            exit 1
          fi
          
          # Use first file if multiple match
          ARTIFACT_FILE="${ARTIFACT_FILES[0]}"
          FILENAME=$(basename "$ARTIFACT_FILE")
          
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "fullpath=$ARTIFACT_FILE" >> $GITHUB_OUTPUT
          echo "📦 Detected artifact: $FILENAME"

      # --- STAGING ARTIFACT ---
      - name: Upload Artifact to GitHub (Staging)
        if: inputs.artifact_path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name || format('node-artifact-{0}', github.run_id) }}
          path: ${{ inputs.working_directory }}/${{ steps.detect_artifact.outputs.fullpath }}
          retention-days: 1

      # --- UPLOAD TO NEXUS ---
      - name: Upload to Nexus
        if: inputs.nexus_url != '' && inputs.skip_upload != true
        id: upload_nexus
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_REPO_TYPE: ${{ inputs.nexus_repo_type }}
          NEXUS_URL: ${{ inputs.nexus_url }}
          NEXUS_REPOSITORY: ${{ inputs.nexus_repository }}
          STEP_DETECT_ARTIFACT_FULLPATH: ${{ steps.detect_artifact.outputs.fullpath }}
          NEXUS_PATH: ${{ inputs.nexus_path }}
          STEP_DETECT_ARTIFACT_FILENAME: ${{ steps.detect_artifact.outputs.filename }}
        run: |
          if [[ "${NEXUS_REPO_TYPE}" == "npm" ]]; then
            echo "📤 Publishing to native NPM repository..."
            
            # Remove trailing slash from URL if present
            CLEAN_URL=$(echo "${NEXUS_URL}" | sed 's|/*$||')
            REGISTRY_URL="${CLEAN_URL}/repository/${NEXUS_REPOSITORY}/"
            
            # Remove protocol for the auth key
            AUTH_KEY=$(echo "$REGISTRY_URL" | sed 's|^https:||' | sed 's|^http:||')
            
            # Create base64 auth (using environment variables prevents shell expansion)
            AUTH=$(printf "%s:%s" "$NEXUS_USER" "$NEXUS_PASS" | base64 -w 0)
            
            # Verify credentials with curl first
            echo "🔍 Verifying credentials with curl..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "$NEXUS_USER:$NEXUS_PASS" "$REGISTRY_URL")
            if [[ "$HTTP_STATUS" -eq 200 || "$HTTP_STATUS" -eq 404 ]]; then
              echo "✅ Credentials verified (HTTP $HTTP_STATUS)"
            else
              echo "::error::Credential verification failed with HTTP $HTTP_STATUS. Please check NEXUS_USERNAME and NEXUS_PASSWORD secrets."
              exit 1
            fi
            
            # Generate .npmrc
            echo "registry=$REGISTRY_URL" > .npmrc
            echo "${AUTH_KEY}:_auth=$AUTH" >> .npmrc
            echo "${AUTH_KEY}:always-auth=true" >> .npmrc
            echo "email=ci@example.com" >> .npmrc
            
            echo "--- .npmrc structure (masked) ---"
            sed 's/:_auth=.*/:_auth=****/' .npmrc
            
            # Publish
            npm publish
            
            # Construct the download path for docker-build.yaml@v1
            PKG_NAME=$(node -p "require('./package.json').name")
            # Robust way to get the filename npm pack will produce:
            # @scope/name@version -> scope-name-version.tgz
            # name@version -> name-version.tgz
            FILENAME=$(node -p "const p=require('./package.json'); p.name.replace('@','').replace('/','-') + '-' + p.version + '.tgz'")
            
            echo "path=${PKG_NAME}/-/${FILENAME}" >> $GITHUB_OUTPUT
            echo "filename=${FILENAME}" >> $GITHUB_OUTPUT
            echo "✅ Published successfully to NPM registry"
            echo "📦 Artifact Path: ${PKG_NAME}/-/${FILENAME}"
            echo "📦 Filename: ${FILENAME}"
            
          else
            echo "📤 Uploading to RAW repository..."
            ARTIFACT_FILE="${STEP_DETECT_ARTIFACT_FULLPATH}"
            
            # Determine upload path
            if [[ -n "${NEXUS_PATH}" ]]; then
              UPLOAD_PATH="${NEXUS_PATH}"
            else
              # Default: use filename in generic path
              UPLOAD_PATH="generic/${STEP_DETECT_ARTIFACT_FILENAME}"
            fi
            
            FULL_URL="${NEXUS_URL}/repository/${NEXUS_REPOSITORY}/${UPLOAD_PATH}"
            
            echo "File: $ARTIFACT_FILE"
            echo "URL: $FULL_URL" # URL logged may contain potential credential path | Mask or remove the echo if needed

            # run: |
            #   MASKED_URL=$(echo "$FULL_URL" | sed 's|://[^@]*@|://***:***@|g')
            #   echo "URL: $MASKED_URL"
            
            # Verify file exists
            if [[ ! -f "$ARTIFACT_FILE" ]]; then
              echo "::error::Build artifact not found: $ARTIFACT_FILE"
              exit 1
            fi
            
            # Upload to Nexus
            HTTP_STATUS=$(curl -s \
              -u "$NEXUS_USER:$NEXUS_PASS" \
              -X PUT \
              -T "$ARTIFACT_FILE" \
              -w "%{http_code}" \
              -o response.txt \
              "$FULL_URL")
            
            if [[ "$HTTP_STATUS" -eq 200 || "$HTTP_STATUS" -eq 201 ]]; then
              echo "✅ Upload successful!"
              echo "path=$UPLOAD_PATH" >> $GITHUB_OUTPUT
              echo "url=$FULL_URL" >> $GITHUB_OUTPUT
              
              # Verify upload
              VERIFY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -u "$NEXUS_USER:$NEXUS_PASS" \
                "$FULL_URL")
              
              if [[ "$VERIFY_STATUS" -eq 200 ]]; then
                echo "✅ Artifact verified in Nexus"
              else
                echo "::warning::Could not verify artifact (HTTP $VERIFY_STATUS)"
              fi
            else
              echo "::error::Upload failed with status $HTTP_STATUS"
              cat response.txt
              exit 1
            fi
          fi
