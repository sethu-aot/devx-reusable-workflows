name: "Module: Rollback"

# ------------------------------------------------------------------------------
# Rollback deployment to previous stable version.
# Supports: Helm rollback, Kubernetes rollback, manual trigger.
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        type: string
        required: true
      deployment_target:
        description: "Deployment target: eks, ec2, ecs"
        type: string
        required: true
      
      # Kubernetes settings
      cluster_name:
        description: "EKS cluster name"
        type: string
        default: ""
      namespace:
        description: "Kubernetes namespace"
        type: string
        default: "default"
      helm_release_name:
        description: "Helm release name"
        type: string
        default: ""
      deployment_method:
        description: |
          How the deploy was performed: 'helm' or 'patch'. A patch deploy is
          made with kubectl outside Helm, so Helm has no revision recording it
          and 'helm rollback' would revert to the wrong state -- even when a
          release name is configured.
        type: string
        default: "helm"
      workload_kind:
        description: "Workload kind for a patch rollback: deployment, statefulset or daemonset"
        type: string
        default: "deployment"
      deployment_name:
        description: "Primary workload to roll back (patch deploys)"
        type: string
        default: ""
      additional_workloads:
        description: "Extra workloads that were deployed together, as a compact JSON array"
        type: string
        default: "[]"
      previous_images:
        description: |
          What each workload ran before the deploy, as a JSON object keyed by
          "kind/name" with {container, image} values -- normally the deploy
          module's previous_images output. When given, rollback restores these
          exact images. That is not the same as `rollout undo`: undo steps back
          one revision regardless, so after a deploy that changed nothing it
          reverts a change this run never made. Falls back to undo when empty.
        type: string
        default: "{}"
      revision:
        description: "Specific revision to rollback to (0 = previous)"
        type: string
        default: "0"
      
      # ECS settings
      service_name:
        description: "ECS service name"
        type: string
        default: ""
      task_definition_family:
        description: "ECS task definition family"
        type: string
        default: ""
      
      # AWS
      aws_region:
        description: "AWS region"
        type: string
        default: "us-east-1"
      role_to_assume:
        description: "AWS IAM role for OIDC"
        type: string
        default: ""

    outputs:
      status:
        description: "Rollback status"
        value: ${{ jobs.rollback.outputs.status }}
      rolled_back_to:
        description: "Revision rolled back to"
        value: ${{ jobs.rollback.outputs.revision }}
      rollback_image_uri:
        description: "Image URI to rollback to (for EC2)"
        value: ${{ jobs.rollback.outputs.rollback_image_uri }}

  # Manual rollback trigger
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        type: choice
        options:
          - dev
          - qa
          - staging
          - production
        required: true
      deployment_target:
        description: "Deployment target"
        type: choice
        options:
          - eks
          - ec2
          - ecs
        required: true
      cluster_name:
        description: "EKS cluster name"
        type: string
        required: true
      namespace:
        description: "Namespace"
        type: string
        default: "default"
      helm_release_name:
        description: "Helm release name"
        type: string
        required: true
      revision:
        description: "Revision to rollback to (0 = previous)"
        type: number
        default: 0

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    # Require approval for production rollbacks
    environment:
      name: ${{ inputs.environment }}
    
    outputs:
      status: ${{ steps.result.outputs.status }}
      revision: ${{ steps.rollback.outputs.revision }}
      rollback_image_uri: ${{ steps.ec2_rollback.outputs.rollback_image_uri }}

    steps:
      - name: Configure AWS Credentials
        if: inputs.role_to_assume != ''
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup kubectl
        if: inputs.deployment_target == 'eks' && inputs.cluster_name != ''
        env:
          NAMESPACE: ${{ inputs.namespace }}
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          aws eks update-kubeconfig --name "${CLUSTER_NAME}" --region "${AWS_REGION}"
          # 'kubectl cluster-info' lists services in kube-system, which a deploy
          # role scoped to a single namespace -- the recommended setup -- cannot
          # read, so it fails with Forbidden on a perfectly good connection.
          # Discovery and SelfSubjectAccessReview are available to any
          # authenticated principal, so check reachability and access that way.
          kubectl version --request-timeout=20s >/dev/null || {
            echo "::error::Cannot reach the Kubernetes API"
            exit 1
          }
          if [[ -n "${NAMESPACE:-}" ]]; then
            kubectl auth can-i get deployments -n "${NAMESPACE}" >/dev/null || {
              echo "::error::Reached the cluster but have no access in namespace '${NAMESPACE}'"
              echo "::error::Check the EKS access entry / RBAC binding for this role."
              exit 1
            }
          fi

      # -------------------------------------------------------------------------
      # EKS/HELM ROLLBACK
      # -------------------------------------------------------------------------
      - name: Helm Rollback
        id: rollback
        if: inputs.deployment_target == 'eks' && inputs.deployment_method != 'patch' && inputs.helm_release_name != ''
        env:
          HELM_RELEASE_NAME: ${{ inputs.helm_release_name }}
          NAMESPACE: ${{ inputs.namespace }}
          REVISION: ${{ inputs.revision }}
        run: |
          echo "Rolling back Helm release: ${HELM_RELEASE_NAME}"
          
          RELEASE="${HELM_RELEASE_NAME}"
          
          # Get current revision
          CURRENT=$(helm history "$RELEASE" -n "$NAMESPACE" -o json | jq -r '.[-1].revision')
          echo "Current revision: $CURRENT"
          
          # Determine target revision
          if [[ "$REVISION" == "0" ]]; then
            if [[ -z "$CURRENT" || "$CURRENT" == "null" || "$CURRENT" -le 1 ]]; then
              echo "::warning::No previous successful revision found for rollback"
              echo "status=skipped" >> $GITHUB_OUTPUT
              exit 0
            fi
            TARGET=$((CURRENT - 1))
          else
            TARGET="$REVISION"
          fi
          
          echo "Rolling back to revision: $TARGET"
          
          # Perform rollback
          helm rollback "$RELEASE" "$TARGET" -n "$NAMESPACE" --wait --timeout 5m || {
            echo "::error::Helm rollback failed"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          }
          
          echo "Rollback completed successfully"
          echo "revision=$TARGET" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT

      # -------------------------------------------------------------------------
      # KUBERNETES NATIVE ROLLBACK (if no Helm)
      # -------------------------------------------------------------------------
      - name: Kubernetes Rollback
        if: inputs.deployment_target == 'eks' && (inputs.deployment_method == 'patch' || inputs.helm_release_name == '')
        env:
          NAMESPACE: ${{ inputs.namespace }}
          WORKLOAD_KIND: ${{ inputs.workload_kind }}
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
          ADDITIONAL_WORKLOADS: ${{ inputs.additional_workloads }}
          PREVIOUS_IMAGES: ${{ inputs.previous_images }}
        run: |
          set -euo pipefail

          # Roll back only what this deployment touched. Enumerating the
          # namespace would revert unrelated workloads -- a shared namespace
          # commonly holds databases, brokers and other teams' services.
          if [[ -z "${DEPLOYMENT_NAME}" ]]; then
            echo "::error::deployment_name is required to roll back a patch deploy."
            echo "::error::Refusing to guess which workloads to revert."
            exit 1
          fi

          EXTRA="${ADDITIONAL_WORKLOADS:-[]}"
          if ! printf '%s' "$EXTRA" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "::error::additional_workloads must be a JSON array; got: ${EXTRA}"
            exit 1
          fi

          SPECS=("${WORKLOAD_KIND}|${DEPLOYMENT_NAME}")
          while IFS= read -r spec; do
            [[ -n "$spec" ]] && SPECS+=("$spec")
          done < <(printf '%s' "$EXTRA" | jq -r --arg k "${WORKLOAD_KIND}" '
            .[] | "\(.kind // $k)|\(.name // "")"')

          PREV_IMAGES="${PREVIOUS_IMAGES:-}"
          if [[ -z "$PREV_IMAGES" ]]; then
            PREV_IMAGES='{}'
          fi
          if ! printf '%s' "$PREV_IMAGES" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "::warning::previous_images is not a JSON object; falling back to rollout undo."
            PREV_IMAGES='{}'
          fi

          FAILED=0
          for spec in "${SPECS[@]}"; do
            IFS='|' read -r KIND NAME <<< "$spec"
            case "$KIND" in
              deployment|statefulset|daemonset) ;;
              *) echo "::error::Unsupported kind '${KIND}'."; exit 1 ;;
            esac
            [[ -z "$NAME" ]] && { echo "::error::Workload name missing in '${spec}'."; exit 1; }

            # Prefer restoring the recorded pre-deploy image over `rollout undo`.
            PREV_ENTRY=$(printf '%s' "$PREV_IMAGES" | jq -r --arg k "${KIND}/${NAME}" '.[$k] // empty' 2>/dev/null || true)
            REVERTED=0
            if [[ -n "$PREV_ENTRY" ]]; then
              PC=$(printf '%s' "$PREV_ENTRY" | jq -r '.container')
              PI=$(printf '%s' "$PREV_ENTRY" | jq -r '.image')
              echo "::group::restore ${KIND}/${NAME} -> ${PI}"
              if kubectl set image "${KIND}/${NAME}" "${PC}=${PI}" -n "${NAMESPACE}"; then
                REVERTED=1
              else
                echo "::warning::Could not restore ${KIND}/${NAME} to ${PI}"
              fi
            else
              echo "::group::rollout undo ${KIND}/${NAME}"
              echo "No recorded pre-deploy image; stepping back one revision instead."
              if kubectl rollout undo "${KIND}/${NAME}" -n "${NAMESPACE}"; then
                REVERTED=1
              fi
            fi

            if [[ "$REVERTED" -eq 1 ]]; then
              # A StatefulSet or DaemonSet updates pods one at a time and will
              # not move past a pod that never became Ready, so reverting the
              # spec leaves the broken pod -- and the rollout -- stuck. The pod
              # has to be deleted for the reverted spec to take effect. A
              # Deployment recovers on its own via a new ReplicaSet, but the
              # same sweep is harmless there.
              SEL=$(kubectl get "${KIND}" "${NAME}" -n "${NAMESPACE}" -o go-template='{{range $k,$v := .spec.selector.matchLabels}}{{$k}}={{$v}},{{end}}' 2>/dev/null | sed 's/,$//')
              if [[ -n "$SEL" ]]; then
                STUCK=$(kubectl get pods -n "${NAMESPACE}" -l "$SEL" -o json 2>/dev/null | jq -r '.items[] | select(any(.status.containerStatuses[]?; .state.waiting.reason == "ImagePullBackOff" or .state.waiting.reason == "ErrImagePull" or .state.waiting.reason == "CrashLoopBackOff" or .state.waiting.reason == "InvalidImageName")) | .metadata.name' 2>/dev/null)
                for POD in $STUCK; do
                  echo "Deleting stuck pod ${POD} so the reverted spec can take effect"
                  kubectl delete pod "${POD}" -n "${NAMESPACE}" --wait=false || true
                done
              fi
              kubectl rollout status "${KIND}/${NAME}" -n "${NAMESPACE}" --timeout=5m || FAILED=1
            else
              echo "::warning::Could not roll back ${KIND}/${NAME}"
              FAILED=1
            fi
            echo "::endgroup::"
          done

          if [[ "$FAILED" -ne 0 ]]; then
            echo "::error::At least one workload did not roll back cleanly; check it by hand."
            exit 1
          fi
          echo "Rolled back ${#SPECS[@]} workload(s) in ${NAMESPACE}"

      # -------------------------------------------------------------------------
      # EC2 ROLLBACK
      # -------------------------------------------------------------------------
      - name: EC2 Rollback
        id: ec2_rollback
        if: inputs.deployment_target == 'ec2'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "Preparing EC2 rollback..."
          
          PARAM_NAME="/deployments/${ENVIRONMENT}/ec2/previous_image"
          
          echo "Retrieving previous image from: $PARAM_NAME"
          
          PREVIOUS_IMAGE=$(aws ssm get-parameter \
            --name "$PARAM_NAME" \
            --query 'Parameter.Value' \
            --output text 2>/dev/null || echo "")
          
          if [[ -z "$PREVIOUS_IMAGE" ]]; then
            echo "::error::No previous image found in SSM Parameter Store"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "Found previous image: $PREVIOUS_IMAGE"
          
          # Output for orchestrator to use
          echo "rollback_image_uri=$PREVIOUS_IMAGE" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
          
          echo "Rollback preparation complete. Orchestrator will trigger redeployment."

      # -------------------------------------------------------------------------
      # ECS ROLLBACK
      # -------------------------------------------------------------------------
      - name: ECS Rollback
        id: ecs_rollback
        if: inputs.deployment_target == 'ecs'
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          SERVICE_NAME: ${{ inputs.service_name }}
          TASK_DEFINITION_FAMILY: ${{ inputs.task_definition_family }}
        run: |
          echo "Rolling back ECS service..."
          
          CLUSTER="${CLUSTER_NAME}"
          SERVICE="${SERVICE_NAME}"
          TASK_FAMILY="${TASK_DEFINITION_FAMILY}"
          
          if [[ -z "$CLUSTER" || -z "$SERVICE" || -z "$TASK_FAMILY" ]]; then
            echo "::error::ECS rollback requires cluster_name, service_name, and task_definition_family"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "Cluster: $CLUSTER"
          echo "Service: $SERVICE"
          echo "Task Family: $TASK_FAMILY"
          
          # Get current and previous task definitions
          TASK_ARNS=$(aws ecs list-task-definitions \
            --family-prefix "$TASK_FAMILY" \
            --sort DESC \
            --max-items 5 \
            --query 'taskDefinitionArns' \
            --output json)
          
          CURRENT_TASK=$(echo "$TASK_ARNS" | jq -r '.[0]')
          PREVIOUS_TASK=$(echo "$TASK_ARNS" | jq -r '.[1]')
          
          echo "Current task definition: $CURRENT_TASK"
          echo "Rolling back to: $PREVIOUS_TASK"
          
          if [[ -z "$PREVIOUS_TASK" || "$PREVIOUS_TASK" == "null" ]]; then
            echo "::error::No previous task definition found for rollback"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Update service to use previous task definition
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$PREVIOUS_TASK" \
            --force-new-deployment || {
            echo "::error::Failed to update ECS service"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          }
          
          echo "Waiting for service stability..."
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE" || {
            echo "::warning::Service did not stabilize within timeout"
          }
          
          # Extract revision from ARN
          REVISION=$(echo "$PREVIOUS_TASK" | grep -oP ':\K[0-9]+$')
          echo "revision=$REVISION" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
          echo "ECS rollback completed"

      - name: Set Result
        id: result
        if: always()
        env:
          STEP_ROLLBACK_STATUS: ${{ steps.rollback.outputs.status }}
          STEP_ECS_ROLLBACK_STATUS: ${{ steps.ecs_rollback.outputs.status }}
          STEP_EC2_ROLLBACK_STATUS: ${{ steps.ec2_rollback.outputs.status }}
        run: |
          # Check all rollback step outputs
          if [[ "${STEP_ROLLBACK_STATUS}" == "success" ]] || \
             [[ "${STEP_ECS_ROLLBACK_STATUS}" == "success" ]] || \
             [[ "${STEP_EC2_ROLLBACK_STATUS}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Generate Summary
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
          NAMESPACE: ${{ inputs.namespace }}
          HELM_RELEASE_NAME: ${{ inputs.helm_release_name }}
          STEP_ROLLBACK_REVISION: ${{ steps.rollback.outputs.revision }}
          STEP_RESULT_STATUS: ${{ steps.result.outputs.status }}
        run: |
          echo "## Rollback Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${ENVIRONMENT} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | ${DEPLOYMENT_TARGET} |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | ${NAMESPACE} |" >> $GITHUB_STEP_SUMMARY
          echo "| Helm Release | ${HELM_RELEASE_NAME} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rolled Back To | ${STEP_ROLLBACK_REVISION} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${STEP_RESULT_STATUS}" == "success" ]]; then
            echo "### Rollback: **SUCCESS**" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Rollback: **FAILED**" >> $GITHUB_STEP_SUMMARY
          fi
