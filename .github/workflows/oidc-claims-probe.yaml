name: "Probe: OIDC claims (temporary)"
on:
  workflow_call:
permissions:
  contents: read
  id-token: write
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Show OIDC claims (not the token)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tok = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(tok.split('.')[1], 'base64').toString('utf8'));
            for (const k of ['sub','aud','repository','repository_owner',
                             'job_workflow_ref','workflow_ref','ref','environment']) {
              core.info(`${k} = ${claims[k]}`);
            }
