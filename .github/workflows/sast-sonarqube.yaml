name: "Module: SonarQube SAST Scan"
# ------------------------------------------------------------------------------
# SonarQube static analysis with quality gates
# Supports: SonarCloud (SaaS) and SonarQube Server (Self-hosted)
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      # --- SCAN CONFIGURATION ---
      scan_path:
        description: "Path to scan (source code directory)"
        type: string
        default: "."
      
      sonar_host_url:
        description: "SonarQube server URL (for self-hosted)"
        type: string
        default: "https://sonarcloud.io"
      
      sonar_organization:
        description: "SonarCloud organization key (SaaS only)"
        type: string
        default: ""
      
      sonar_project_key:
        description: "SonarQube project key"
        type: string
        required: true
      
      # --- QUALITY GATES ---
      fail_on_quality_gate:
        description: "Fail pipeline if quality gate fails"
        type: boolean
        default: true
      
      wait_for_quality_gate:
        description: "Wait for quality gate result"
        type: boolean
        default: true
      
      # --- COVERAGE ---
      coverage_report_path:
        description: "Path to coverage report (optional)"
        type: string
        default: ""
      
      # --- ADVANCED ---
      sonar_scanner_version:
        description: "SonarScanner version"
        type: string
        default: "5.0.1.3006"
      
      additional_args:
        description: "Additional SonarScanner arguments"
        type: string
        default: ""

    secrets:
      sonar_token:
        description: "SonarQube authentication token"
        required: true

  workflow_dispatch:
    inputs:
      scan_path:
        type: string
        default: "."
      sonar_host_url:
        type: string
        default: "https://sonarcloud.io"
      sonar_organization:
        type: string
        default: ""
      sonar_project_key:
        type: string
        required: true
      fail_on_quality_gate:
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write  # For PR decoration

jobs:
  sonarqube-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # ------------------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for better analysis

      # ------------------------------------------------------------------------
      # 2. SETUP LANGUAGE-SPECIFIC ENVIRONMENTS
      # ------------------------------------------------------------------------
      - name: Setup Java (for SonarScanner)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      # Auto-detect language by checking both scan_path and root
      - name: Detect Project Language
        id: detect_lang
        env:
          SCAN_PATH: ${{ inputs.scan_path }}
        run: |
          SCAN_DIR="${SCAN_PATH}"
          ROOT_DIR="$PWD"
          
          # Normalize SCAN_DIR
          if [[ "$SCAN_DIR" == "." ]]; then
            SCAN_DIR="$ROOT_DIR"
          elif [[ ! "$SCAN_DIR" == /* ]]; then
            SCAN_DIR="$ROOT_DIR/$SCAN_DIR"
          fi
          
          echo "🔍 Checking for project files..."
          
          # Detection logic: Check SCAN_DIR first, then ROOT_DIR
          if [[ -f "$SCAN_DIR/pom.xml" ]]; then
            echo "language=maven" >> $GITHUB_OUTPUT
            echo "project_root=$SCAN_DIR" >> $GITHUB_OUTPUT
            echo "✅ Detected: Maven project in $SCAN_DIR"
          elif [[ -f "$ROOT_DIR/pom.xml" ]]; then
            echo "language=maven" >> $GITHUB_OUTPUT
            echo "project_root=$ROOT_DIR" >> $GITHUB_OUTPUT
            echo "✅ Detected: Maven project in $ROOT_DIR"
          elif [[ -f "$SCAN_DIR/package.json" ]]; then
            echo "language=node" >> $GITHUB_OUTPUT
            echo "project_root=$SCAN_DIR" >> $GITHUB_OUTPUT
            echo "✅ Detected: Node.js project in $SCAN_DIR"
          elif [[ -f "$ROOT_DIR/package.json" ]]; then
            echo "language=node" >> $GITHUB_OUTPUT
            echo "project_root=$ROOT_DIR" >> $GITHUB_OUTPUT
            echo "✅ Detected: Node.js project in $ROOT_DIR"
          elif [[ -f "$SCAN_DIR/requirements.txt" ]] || [[ -f "$SCAN_DIR/setup.py" ]] || [[ -f "$SCAN_DIR/pyproject.toml" ]] || [[ -f "$SCAN_DIR/Pipfile" ]]; then
            echo "language=python" >> $GITHUB_OUTPUT
            echo "project_root=$SCAN_DIR" >> $GITHUB_OUTPUT
            echo "✅ Detected: Python project in $SCAN_DIR"
          elif [[ -f "$ROOT_DIR/requirements.txt" ]] || [[ -f "$ROOT_DIR/setup.py" ]] || [[ -f "$ROOT_DIR/pyproject.toml" ]] || [[ -f "$ROOT_DIR/Pipfile" ]]; then
            echo "language=python" >> $GITHUB_OUTPUT
            echo "project_root=$ROOT_DIR" >> $GITHUB_OUTPUT
            echo "✅ Detected: Python project in $ROOT_DIR"
          else
            echo "language=generic" >> $GITHUB_OUTPUT
            echo "project_root=$SCAN_DIR" >> $GITHUB_OUTPUT
            echo "⚠️  Detected: Generic project"
          fi

      - name: Setup Node.js (if Node project)
        if: steps.detect_lang.outputs.language == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ steps.detect_lang.outputs.project_root }}/package-lock.json

      - name: Install Node Dependencies
        if: steps.detect_lang.outputs.language == 'node'
        working-directory: ${{ steps.detect_lang.outputs.project_root }}
        run: npm ci --prefer-offline --no-audit

      - name: Setup Python (if Python project)
        if: steps.detect_lang.outputs.language == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ${{ steps.detect_lang.outputs.project_root }}/requirements.txt

      - name: Install Python Dependencies
        if: steps.detect_lang.outputs.language == 'python'
        working-directory: ${{ steps.detect_lang.outputs.project_root }}
        run: |
          python -m pip install --upgrade pip
          if [[ -f "requirements.txt" ]]; then
            pip install -r requirements.txt
          fi

      # ------------------------------------------------------------------------
      # 3. RUN TESTS & GENERATE COVERAGE (if available)
      # ------------------------------------------------------------------------
      - name: Run Tests with Coverage (Node.js)
        if: steps.detect_lang.outputs.language == 'node'
        working-directory: ${{ steps.detect_lang.outputs.project_root }}
        continue-on-error: true
        run: |
          if npm run | grep -q "test"; then
            npm test -- --coverage --coverageReporters=lcov || true
          fi

      - name: Run Tests with Coverage (Python)
        if: steps.detect_lang.outputs.language == 'python'
        working-directory: ${{ steps.detect_lang.outputs.project_root }}
        continue-on-error: true
        run: |
          if command -v pytest &> /dev/null; then
            pytest --cov --cov-report=xml || true
          fi

      - name: Run Tests with Coverage (Maven)
        if: steps.detect_lang.outputs.language == 'maven'
        working-directory: ${{ steps.detect_lang.outputs.project_root }}
        continue-on-error: true
        run: |
          mvn clean verify -B || true

      # ------------------------------------------------------------------------
      # 4. SONARQUBE SCAN - MAVEN-SPECIFIC
      # ------------------------------------------------------------------------
      - name: Run SonarQube Analysis (Maven)
        if: steps.detect_lang.outputs.language == 'maven'
        working-directory: ${{ steps.detect_lang.outputs.project_root }}
        env:
          SONAR_TOKEN: ${{ secrets.sonar_token }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
          SONAR_ORGANIZATION: ${{ inputs.sonar_organization }}
          SONAR_PROJECT_KEY: ${{ inputs.sonar_project_key }}
          ADDITIONAL_ARGS: ${{ inputs.additional_args }}
        run: |
          echo "🔍 Running SonarQube analysis via Maven plugin..."
          echo "Working directory: $(pwd)"
          echo "POM file: $(ls -la pom.xml)"
          
          # additional_args is a list of Maven flags, so it is split into
          # separate words -- but into an array, so no value is re-parsed as shell.
          EXTRA=()
          [[ -n "$ADDITIONAL_ARGS" ]] && read -ra EXTRA <<< "$ADDITIONAL_ARGS"

          ARGS=(clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
                "-Dsonar.host.url=$SONAR_HOST_URL"
                "-Dsonar.projectKey=$SONAR_PROJECT_KEY")

          if [[ "$SONAR_HOST_URL" == "https://sonarcloud.io" ]]; then
            echo "Using SonarCloud..."
            ARGS+=("-Dsonar.organization=$SONAR_ORGANIZATION")
          else
            echo "Using self-hosted SonarQube..."
          fi

          mvn "${ARGS[@]}" ${EXTRA[@]+"${EXTRA[@]}"} -B

          echo "✅ SonarQube Maven analysis completed"

      # ------------------------------------------------------------------------
      # 4B. SONARQUBE SCAN - NON-MAVEN (Node.js, Python, Generic)
      # ------------------------------------------------------------------------
      - name: SonarQube Scan (SonarCloud)
        if: |
          inputs.sonar_host_url == 'https://sonarcloud.io' &&
          steps.detect_lang.outputs.language != 'maven'
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.sonar_token }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
        with:
          projectBaseDir: ${{ inputs.scan_path }}
          args: >
            -Dsonar.organization=${{ inputs.sonar_organization }}
            -Dsonar.projectKey=${{ inputs.sonar_project_key }}
            -Dsonar.sources=.
            -Dsonar.verbose=false
            ${{ inputs.coverage_report_path != '' && format('-Dsonar.coverageReportPaths={0}', inputs.coverage_report_path) || '' }}
            ${{ inputs.additional_args }}

      - name: SonarQube Scan (Self-Hosted)
        if: |
          inputs.sonar_host_url != 'https://sonarcloud.io' &&
          steps.detect_lang.outputs.language != 'maven'
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.sonar_token }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
        with:
          projectBaseDir: ${{ inputs.scan_path }}
          args: >
            -Dsonar.projectKey=${{ inputs.sonar_project_key }}
            -Dsonar.sources=.
            ${{ inputs.coverage_report_path != '' && format('-Dsonar.coverageReportPaths={0}', inputs.coverage_report_path) || '' }}
            ${{ inputs.additional_args }}

      # ------------------------------------------------------------------------
      # 5. QUALITY GATE CHECK
      # ------------------------------------------------------------------------
      - name: Determine Quality Gate Report Path
        id: qg_report
        env:
          STEP_DETECT_LANG_LANGUAGE: ${{ steps.detect_lang.outputs.language }}
          STEP_DETECT_LANG_PROJECT_ROOT: ${{ steps.detect_lang.outputs.project_root }}
          SCAN_PATH: ${{ inputs.scan_path }}
        run: |
          if [[ "${STEP_DETECT_LANG_LANGUAGE}" == "maven" ]]; then
            echo "report_path=${STEP_DETECT_LANG_PROJECT_ROOT}/target/sonar/report-task.txt" >> $GITHUB_OUTPUT
          else
            # The .scannerwork directory is created in the projectBaseDir (scan_path)
            SCAN_DIR="${SCAN_PATH}"
            if [[ "$SCAN_DIR" == "." ]]; then
              echo "report_path=.scannerwork/report-task.txt" >> $GITHUB_OUTPUT
            else
              echo "report_path=$SCAN_DIR/.scannerwork/report-task.txt" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Wait for Quality Gate
        if: inputs.wait_for_quality_gate == true
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        with:
          scanMetadataReportFile: ${{ steps.qg_report.outputs.report_path }}
        env:
          SONAR_TOKEN: ${{ secrets.sonar_token }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
        continue-on-error: ${{ !inputs.fail_on_quality_gate }}

      # ------------------------------------------------------------------------
      # 6. SUMMARY & REPORTING
      # ------------------------------------------------------------------------
      - name: Generate Scan Summary
        if: always()
        env:
          SONAR_PROJECT_KEY: ${{ inputs.sonar_project_key }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
          STEP_DETECT_LANG_LANGUAGE: ${{ steps.detect_lang.outputs.language }}
          SCAN_PATH: ${{ inputs.scan_path }}
          EXPR: ${{ job.status }}
        run: |
          echo "## 🔍 SonarQube SAST Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Project Key:** ${SONAR_PROJECT_KEY}" >> $GITHUB_STEP_SUMMARY
          echo "- **Server:** ${SONAR_HOST_URL}" >> $GITHUB_STEP_SUMMARY
          echo "- **Language Detected:** ${STEP_DETECT_LANG_LANGUAGE}" >> $GITHUB_STEP_SUMMARY
          echo "- **Scan Path:** ${SCAN_PATH}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Generate dashboard link
          if [[ "${SONAR_HOST_URL}" == "https://sonarcloud.io" ]]; then
            DASHBOARD_URL="https://sonarcloud.io/dashboard?id=${SONAR_PROJECT_KEY}"
          else
            DASHBOARD_URL="${SONAR_HOST_URL}/dashboard?id=${SONAR_PROJECT_KEY}"
          fi
          
          echo "📊 **[View Full Report]($DASHBOARD_URL)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${EXPR}" == "success" ]]; then
            echo "### ✅ Quality Gate: **PASSED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Quality Gate: **FAILED**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment PR (if pull request)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        # Values reach the script through env, never through ${{ }}. A GitHub
        # expression is spliced into the script text before Node parses it, so a
        # project key containing a quote would execute arbitrary JavaScript here
        # -- with a token that holds pull-requests: write.
        env:
          SONAR_PROJECT_KEY: ${{ inputs.sonar_project_key }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
        with:
          script: |
            const projectKey = process.env.SONAR_PROJECT_KEY ?? '';
            const hostUrl = (process.env.SONAR_HOST_URL ?? '').replace(/\/+$/, '');

            const base = hostUrl || 'https://sonarcloud.io';
            // encodeURIComponent leaves ( and ) alone, and an unescaped paren
            // terminates a markdown link early.
            const enc = (s) => encodeURIComponent(s)
              .replace(/[()]/g, (c) => '%' + c.charCodeAt(0).toString(16).toUpperCase());
            const dashboardUrl = `${base}/dashboard?id=${enc(projectKey)}`;

            // Neutralise backticks so the key cannot break out of the code span.
            const safeKey = projectKey.replace(/`/g, "'");

            const comment = `## 🔍 SonarQube Analysis

            **Project:** \`${safeKey}\`

            📊 [View Detailed Report](${dashboardUrl})

            > Analysis completed for commit ${context.sha.substring(0, 7)}`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
