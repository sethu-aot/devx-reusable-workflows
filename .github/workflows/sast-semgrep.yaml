name: "Module: SAST Scan (Semgrep)"
# ------------------------------------------------------------------------------
# Static Application Security Testing (SAST) using Semgrep.
#
# GUARANTEES:
# - Deterministic execution
# - No cloud dependency
# - Policy-driven fail-fast
# - SARIF reporting
#
# Conditions:
# - Code Security must be enabled for this repository to use code scanning (Code Security features are free for public repositories and billed for per 90-day active committer for private and internal repositories)
#
# POLICY GATE:
# - fail_on (critical,high,medium,low) → fails on those severities; "none"
#   reports only. Semgrep levels map ERROR → high, WARNING → medium, INFO → low.
# - fail_on empty → the old switch: fail_on_findings at severity_threshold.
# Every severity is always reported, so medium and low show up as warnings.
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      scan_path:
        description: "Path to source code"
        type: string
        default: "."
      exclude_paths:
        description: "Paths to exclude (e.g., tests/,vendor/,node_modules/)"
        type: string
        default: ""
      ruleset:
        description: "Semgrep ruleset (p/ci, p/default, p/owasp-top-ten)"
        type: string
        default: "p/ci"
      severity_threshold:
        description: "Minimum severity to report (INFO | WARNING | ERROR)"
        type: string
        default: "ERROR"
      fail_on_findings:
        description: "Fail pipeline if violations are found"
        type: boolean
        default: true
      upload_sarif:
        description: "Upload SARIF to GitHub Security tab"
        type: boolean
        default: true
      component:
        description: "Component being scanned; keeps its code-scanning category and report separate"
        type: string
        default: ""
      fail_on:
        description: 'Severities that fail the gate (critical,high,medium,low); "none" reports only; empty keeps fail_on_findings'
        type: string
        default: ""

    outputs:
      critical:
        description: "Critical findings"
        value: ${{ jobs.sast-scan.outputs.critical }}
      high:
        description: "High findings"
        value: ${{ jobs.sast-scan.outputs.high }}
      medium:
        description: "Medium findings"
        value: ${{ jobs.sast-scan.outputs.medium }}
      low:
        description: "Low findings"
        value: ${{ jobs.sast-scan.outputs.low }}
      gate:
        description: "clean, warn or fail"
        value: ${{ jobs.sast-scan.outputs.gate }}

  workflow_dispatch:
    inputs:
      scan_path:
        description: "Path to source code"
        type: string
        default: "."
      exclude_paths:
        description: "Paths to exclude"
        type: string
        default: ""
      ruleset:
        description: "Semgrep ruleset"
        type: string
        default: "p/ci"
      severity_threshold:
        description: "Minimum severity"
        type: choice
        options:
          - INFO
          - WARNING
          - ERROR
        default: "ERROR"
      fail_on_findings:
        description: "Fail on findings"
        type: boolean
        default: true
      upload_sarif:
        description: "Upload SARIF"
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sast-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      critical: ${{ steps.findings.outputs.critical }}
      high: ${{ steps.findings.outputs.high }}
      medium: ${{ steps.findings.outputs.medium }}
      low: ${{ steps.findings.outputs.low }}
      gate: ${{ steps.findings.outputs.status }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep || {
            echo "::error::Failed to install semgrep"
            exit 1
          }

      - name: Resolve Gate
        id: gate
        env:
          FAIL_ON: ${{ inputs.fail_on }}
          FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
          SEVERITY_THRESHOLD: ${{ inputs.severity_threshold }}
          COMPONENT: ${{ inputs.component }}
        run: |
          if [[ "${FAIL_ON}" == "none" ]]; then
            GATE=""
          elif [[ -n "${FAIL_ON}" ]]; then
            GATE="${FAIL_ON}"
          elif [[ "${FAIL_ON_FINDINGS}" == "true" ]]; then
            case "${SEVERITY_THRESHOLD}" in
              INFO) GATE="critical,high,medium,low" ;;
              WARNING) GATE="critical,high,medium" ;;
              *) GATE="critical,high" ;;
            esac
          else
            GATE=""
          fi
          echo "fail_on=${GATE}" >> "$GITHUB_OUTPUT"
          SUFFIX=$(echo "${COMPONENT}" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')
          echo "suffix=${SUFFIX:+-${SUFFIX}}" >> "$GITHUB_OUTPUT"

      - name: Run Semgrep SAST
        id: semgrep
        timeout-minutes: 15
        env:
          RULESET: ${{ inputs.ruleset }}
          SCAN_PATH: ${{ inputs.scan_path }}
          EXCLUDE_PATHS: ${{ inputs.exclude_paths }}
        run: |
          echo "Running Semgrep (${RULESET}) on ${SCAN_PATH}, all severities"
          EXCLUDE_FLAGS=""
          if [ -n "${EXCLUDE_PATHS}" ]; then
            IFS=',' read -ra EXCLUDES <<< "${EXCLUDE_PATHS}"
            for exclude in "${EXCLUDES[@]}"; do
              exclude=$(echo "$exclude" | xargs)
              [ -n "$exclude" ] && EXCLUDE_FLAGS="$EXCLUDE_FLAGS --exclude $exclude"
            done
          fi
          # Semgrep's own exit code is not the gate (the Findings step is), so
          # only a missing report counts as a failed scan.
          semgrep scan \
            --config="${RULESET}" \
            $EXCLUDE_FLAGS \
            --sarif \
            --output=semgrep.sarif \
            "${SCAN_PATH}" || true
          if [ ! -s semgrep.sarif ]; then
            echo "::error::Semgrep produced no report; the scan did not complete."
            exit 1
          fi

      - name: Upload SARIF to Security Tab
        if: inputs.upload_sarif == true && always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: semgrep.sarif
          category: sast-semgrep${{ steps.gate.outputs.suffix }}

      - name: Upload Report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep${{ steps.gate.outputs.suffix }}-${{ github.sha }}
          path: semgrep.sarif
          retention-days: 30
          if-no-files-found: ignore

      - name: Findings
        id: findings
        if: always() && steps.semgrep.outcome == 'success'
        uses: sethu-aot/devx-reusable-workflows/.github/actions/scan-findings@test/m8flow-nextgen # TEMPORARY: fork DevX
        with:
          sarif_file: semgrep.sarif
          tool: Semgrep
          component: ${{ inputs.component || inputs.scan_path }}
          fail_on: ${{ steps.gate.outputs.fail_on }}
