name: "Module: SBOM Generation (Syft)"
# ------------------------------------------------------------------------------
# Software Bill of Materials (SBOM) generation using Syft.
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      # --- MODE ---
      sbom_type:
        description: "Target type: 'fs' (source code) or 'image' (container)"
        type: string
        default: "image"

      # --- TARGETS ---
      scan_path:
        description: "Path to scan (for fs mode)"
        type: string
        default: "."
      image_uri:
        description: "Full container image URI (for image mode)"
        type: string
        default: ""

      # --- REGISTRY AUTHENTICATION ---
      registry_type:
        description: "Registry type: 'ecr', 'generic', or 'nexus'"
        type: string
        default: "ecr"
      registry_url:
        description: "Registry URL (for generic/nexus)"
        type: string
        default: ""

      # --- AWS AUTHENTICATION (for ECR images) ---
      aws_region:
        description: "AWS region for ECR authentication"
        type: string
        default: "ca-central-1"
      role_to_assume:
        description: "AWS IAM role ARN for OIDC authentication"
        type: string
        default: ""

      # --- FORMAT ---
      format:
        description: "Output format (cyclonedx-json, cyclonedx-xml, spdx-json, spdx-tag-value)"
        type: string
        default: "cyclonedx-json"

      # --- REPORTING ---
      upload_artifact:
        description: "Upload SBOM as pipeline artifact?"
        type: boolean
        default: true

    secrets:
      registry_username:
        description: "Username for registry"
        required: false
      registry_password:
        description: "Password for registry"
        required: false

    outputs:
      sbom_artifact_name:
        description: "Name of the uploaded SBOM artifact"
        value: ${{ jobs.sbom-generate.outputs.artifact_name }}

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      sbom_type:
        description: "SBOM type"
        type: choice
        options:
          - fs
          - image
        default: "image"
      scan_path:
        description: "Path to scan (fs mode)"
        type: string
        default: "."
      image_uri:
        description: "Image URI (image mode)"
        type: string
        default: ""
      registry_type:
        description: "Registry type"
        type: choice
        options:
          - ecr
          - generic
          - nexus
        default: "ecr"
      registry_url:
        description: "Registry URL"
        type: string
        default: ""
      aws_region:
        description: "AWS region"
        type: string
        default: "ca-central-1"
      role_to_assume:
        description: "AWS IAM role ARN"
        type: string
        default: ""
      format:
        description: "Output format"
        type: choice
        options:
          - cyclonedx-json
          - cyclonedx-xml
          - spdx-json
          - spdx-tag-value
        default: "cyclonedx-json"
      upload_artifact:
        description: "Upload artifact"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read           # artifact + SARIF metadata
  id-token: write    # Required for AWS OIDC

jobs:
  sbom-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    outputs:
      artifact_name: ${{ steps.set_output.outputs.artifact_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ------------------------------------------------------------------------
      # VALIDATION (Defensive Governance)
      # ------------------------------------------------------------------------
      - name: Validate Inputs
        env:
          SBOM_TYPE: ${{ inputs.sbom_type }}
          IMAGE_URI: ${{ inputs.image_uri }}
          FORMAT: ${{ inputs.format }}
        run: |
          # Validate sbom_type
          if [[ "${SBOM_TYPE}" != "fs" ]] && [[ "${SBOM_TYPE}" != "image" ]]; then
            echo "::error::Validation Failed: sbom_type must be 'fs' or 'image', got '${SBOM_TYPE}'"
            exit 1
          fi
          
          # Validate image_uri for image mode
          if [[ "${SBOM_TYPE}" == "image" && -z "${IMAGE_URI}" ]]; then
            echo "::error::Validation Failed: 'image_uri' is required when sbom_type is 'image'"
            exit 1
          fi
          
          # Validate format
          VALID_FORMATS="cyclonedx-json|cyclonedx-xml|spdx-json|spdx-tag-value"
          if [[ ! "${FORMAT}" =~ ^($VALID_FORMATS)$ ]]; then
            echo "::error::Validation Failed: Invalid format '${FORMAT}'"
            echo "::error::Supported formats: cyclonedx-json, cyclonedx-xml, spdx-json, spdx-tag-value"
            exit 1
          fi

      # ------------------------------------------------------------------------
      # REGISTRY AUTHENTICATION
      # ------------------------------------------------------------------------
      # Option A: AWS ECR (OIDC)
      - name: Configure AWS Credentials (ECR)
        if: inputs.registry_type == 'ecr' && inputs.role_to_assume != ''
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: sbom-generation-session

      - name: Login to Amazon ECR
        if: inputs.registry_type == 'ecr' && inputs.role_to_assume != ''
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        with:
          mask-password: true

      # Option B: Generic / Nexus
      - name: Login to Registry (Generic/Nexus)
        if: (inputs.registry_type == 'generic' || inputs.registry_type == 'nexus') && inputs.registry_url != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry_url }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      # ------------------------------------------------------------------------
      # SETUP SYFT
      # ------------------------------------------------------------------------
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Verify Syft Installation
        run: |
          syft version
          echo "✅ Syft installed successfully"

      # ------------------------------------------------------------------------
      # MODE 1: FILESYSTEM SBOM
      # ------------------------------------------------------------------------
      - name: Generate SBOM (Filesystem)
        timeout-minutes: 10
        if: inputs.sbom_type == 'fs'
        env:
          SCAN_PATH: ${{ inputs.scan_path }}
          FORMAT: ${{ inputs.format }}
          GH_SHA: ${{ github.sha }}
        run: |
          echo "📋 Generating filesystem SBOM for: ${SCAN_PATH}"
          syft dir:"${SCAN_PATH}" \
            -o "${FORMAT}" \
            > sbom-"${GH_SHA}".json
          echo "✅ SBOM generated successfully"

      # ------------------------------------------------------------------------
      # MODE 2: IMAGE SBOM (with authentication support)
      # ------------------------------------------------------------------------
      - name: Pull Image for SBOM
        if: inputs.sbom_type == 'image'
        env:
          IMAGE_URI: ${{ inputs.image_uri }}
        run: |
          echo "📦 Pulling image for SBOM generation: ${IMAGE_URI}"
          docker pull "${IMAGE_URI}"
          echo "✅ Image pulled successfully"

      - name: Generate SBOM (Image)
        timeout-minutes: 10
        if: inputs.sbom_type == 'image'
        env:
          IMAGE_URI: ${{ inputs.image_uri }}
          FORMAT: ${{ inputs.format }}
          GH_SHA: ${{ github.sha }}
        run: |
          echo "📋 Generating image SBOM for: ${IMAGE_URI}"
          syft "${IMAGE_URI}" \
            -o "${FORMAT}" \
            > sbom-"${GH_SHA}".json
          echo "✅ SBOM generated successfully"

      # ------------------------------------------------------------------------
      # SBOM VALIDATION
      # ------------------------------------------------------------------------
      - name: Validate SBOM
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          if [[ ! -f "sbom-${GH_SHA}.json" ]]; then
            echo "::error::SBOM file not generated"
            exit 1
          fi
          
          # Check file size
          SBOM_SIZE=$(stat -f%z "sbom-${GH_SHA}.json" 2>/dev/null || stat -c%s "sbom-${GH_SHA}.json")
          echo "📊 SBOM size: $SBOM_SIZE bytes"
          
          if [[ $SBOM_SIZE -lt 100 ]]; then
            echo "::error::SBOM file is suspiciously small ($SBOM_SIZE bytes)"
            cat "sbom-${GH_SHA}.json"
            exit 1
          fi
          
          # Count components
          if command -v jq &> /dev/null; then
            COMPONENT_COUNT=$(jq '[.components[]?, .packages[]?] | length' sbom-"${GH_SHA}".json 2>/dev/null || echo "unknown")
            echo "📦 Components found: $COMPONENT_COUNT"
          fi

      # ------------------------------------------------------------------------
      # ARTIFACT OUTPUT
      # ------------------------------------------------------------------------
      - name: Upload SBOM Artifact
        if: inputs.upload_artifact == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom-${{ github.sha }}.json
          retention-days: 90

      - name: Set Output
        id: set_output
        env:
          UPLOAD_ARTIFACT: ${{ inputs.upload_artifact }}
          GH_SHA: ${{ github.sha }}
        run: |
          if [[ "${UPLOAD_ARTIFACT}" == "true" ]]; then
            echo "artifact_name=sbom-${GH_SHA}" >> $GITHUB_OUTPUT
          else
            echo "artifact_name=" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------------------
      # SUMMARY
      # ------------------------------------------------------------------------
      - name: Generate SBOM Summary
        if: always()
        env:
          SBOM_TYPE: ${{ inputs.sbom_type }}
          IMAGE_URI: ${{ inputs.image_uri }}
          SCAN_PATH: ${{ inputs.scan_path }}
          FORMAT: ${{ inputs.format }}
          GH_SHA: ${{ github.sha }}
        run: |
          echo "## 📋 SBOM Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Type:** ${SBOM_TYPE}" >> $GITHUB_STEP_SUMMARY
          if [[ "${SBOM_TYPE}" == "image" ]]; then
            echo "- **Image:** \`${IMAGE_URI}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Path:** ${SCAN_PATH}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Format:** ${FORMAT}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ -f "sbom-${GH_SHA}.json" ]]; then
            SBOM_SIZE=$(stat -f%z "sbom-${GH_SHA}.json" 2>/dev/null || stat -c%s "sbom-${GH_SHA}.json")
            echo "✅ SBOM generated successfully ($SBOM_SIZE bytes)" >> $GITHUB_STEP_SUMMARY
            
            if command -v jq &> /dev/null; then
              COMPONENT_COUNT=$(jq '[.components[]?, .packages[]?] | length' sbom-"${GH_SHA}".json 2>/dev/null || echo "unknown")
              echo "- **Components:** $COMPONENT_COUNT" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ SBOM generation failed" >> $GITHUB_STEP_SUMMARY
          fi
