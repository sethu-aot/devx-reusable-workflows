name: "Repo CI: Validate Reusable Workflows"

# ------------------------------------------------------------------------------
# Self-validation for this repository.
#
# Every workflow here is consumed by other repositories, so a mistake merged to
# `main` reaches every project at once. This job is the gate that catches the
# classes of defect that GitHub itself only surfaces at run time:
#
#   * actionlint  - workflow schema, expression syntax, `needs:` graph errors,
#                   unknown contexts, and (with shellcheck) `run:` script bugs
#   * contract    - inputs/secrets/outputs actually match between the
#                   orchestrators and the modules they call
#   * pinning     - no third-party action referenced by a mutable tag or branch
#   * examples    - every devx-ci.yaml / devx-config.yaml under examples/ parses
# ------------------------------------------------------------------------------

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned release + checksum rather than a third-party action, so this
      # gate has no supply-chain dependency of its own. shellcheck ships on the
      # runner image, and actionlint picks it up automatically to lint `run:`.
      - name: Install actionlint
        env:
          VERSION: "1.7.12"
          SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          TARBALL="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$TARBALL" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${TARBALL}"
          echo "${SHA256}  ${TARBALL}" | sha256sum --check --strict
          tar -xzf "$TARBALL" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Run actionlint
        env:
          # actionlint feeds every `run:` block to shellcheck and reports each
          # finding as an error. Gate on `warning` and above -- correctness and
          # quoting bugs -- rather than on `note`, which is dominated by
          # SC2129 ("combine these >> redirects") across the summary steps.
          SHELLCHECK_OPTS: "--severity=warning"
        run: actionlint -color

  contracts:
    name: Validate workflow contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Check reusable-workflow contracts
        run: python .github/scripts/validate_workflows.py

  examples:
    name: Validate example configs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Parse every example config
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if python -c "import sys,yaml; yaml.safe_load(open(sys.argv[1],encoding='utf-8'))" "$f"; then
              echo "ok   $f"
            else
              echo "::error file=$f::Invalid YAML"
              fail=1
            fi
          done < <(find examples -name 'devx-*.yaml' -print0)
          exit "$fail"

      - name: Reject real AWS accounts and tunnel hosts in examples
        run: |
          set -uo pipefail
          # examples/ is public reference material that people copy verbatim.
          # It must carry placeholders, never a real account, role or internal host.
          PLACEHOLDER="123456789012"
          status=0

          ACCOUNTS=$(grep -rnoE '(arn:aws:iam::|[^0-9])[0-9]{12}(:role/|\.dkr\.ecr)' examples/ \
                     | grep -v "$PLACEHOLDER" || true)
          if [[ -n "$ACCOUNTS" ]]; then
            echo "::error::examples/ contains a real AWS account ID. Use $PLACEHOLDER."
            echo "$ACCOUNTS"
            status=1
          fi

          HOSTS=$(grep -rnE '\.trycloudflare\.com|\.ngrok(-free)?\.(io|dev|app)' examples/ || true)
          if [[ -n "$HOSTS" ]]; then
            echo "::error::examples/ references an ephemeral tunnel host. Use example.com."
            echo "$HOSTS"
            status=1
          fi

          [[ $status -eq 0 ]] && echo "No real accounts or tunnel hosts in examples/."
          exit $status
