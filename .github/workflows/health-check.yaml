name: "Module: Health Check"

# ------------------------------------------------------------------------------
# Post-deployment health verification.
# Supports HTTP, TCP, and Kubernetes-native checks.
# Triggers rollback on failure (via orchestrator).
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        type: string
        required: true
      health_endpoint:
        description: "Health check endpoint path (e.g., /health)"
        type: string
        default: "/health"
      health_url:
        description: "Full health check URL (overrides endpoint)"
        type: string
        default: ""
      check_type:
        description: "Check type: http, tcp, k8s"
        type: string
        default: "k8s"
      ingress_domain:
        description: "Root domain for health check fallbacks"
        type: string
        default: ""
      
      # Kubernetes settings
      namespace:
        description: "Kubernetes namespace"
        type: string
        default: "default"
      cluster_name:
        description: "EKS cluster name"
        type: string
        default: ""
      deployment_name:
        description: "Kubernetes deployment name (auto-detected if not provided)"
        type: string
        default: ""
      workload_kind:
        description: "Workload kind to check: deployment, statefulset or daemonset"
        type: string
        default: "deployment"
      additional_workloads:
        description: |
          Other workloads the deploy updated, as a compact JSON array of
          {"name","container","kind"}. All of them are checked: declaring one
          release healthy on the strength of a single workload hides a partly
          failed rollout.
        type: string
        default: "[]"
      
      # SSL Verification
      verify_ssl:
        description: "Verify SSL certificates (disable for dev with self-signed certs)"
        type: boolean
        default: true
      
      # Timing
      initial_delay:
        description: "Seconds to wait before first check"
        type: string
        default: "30"
      timeout:
        description: "Timeout per check in seconds"
        type: string
        default: "10"
      retries:
        description: "Number of retry attempts"
        type: string
        default: "5"
      retry_interval:
        description: "Seconds between retries"
        type: string
        default: "15"
      
      # AWS
      aws_region:
        description: "AWS region"
        type: string
        default: "us-east-1"
      role_to_assume:
        description: "AWS IAM role for OIDC"
        type: string
        default: ""
      kubernetes_api_url:
        description: "Kubernetes API URL (overrides EKS/local kubeconfig)"
        type: string
        default: ""

    secrets:
      KUBECONFIG_DATA:
        description: "Base64-encoded kubeconfig for Kubernetes authentication"
        required: false

    outputs:
      status:
        description: "Health check result: healthy, unhealthy"
        value: ${{ jobs.health-check.outputs.status }}
      details:
        description: "Health check details"
        value: ${{ jobs.health-check.outputs.details }}

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        type: string
        required: true
      health_endpoint:
        description: "Health endpoint"
        type: string
        default: "/health"
      check_type:
        description: "Check type"
        type: choice
        options:
          - http
          - tcp
          - k8s
        default: "k8s"
      namespace:
        description: "Namespace"
        type: string
        default: "default"
      cluster_name:
        description: "Cluster name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    outputs:
      status: ${{ steps.result.outputs.status }}
      details: ${{ steps.result.outputs.details }}

    steps:
      - name: Setup kubeconfig from secret
        if: inputs.check_type == 'k8s' && inputs.cluster_name == ''
        env:
          NAMESPACE: ${{ inputs.namespace }}
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          if [[ -z "$KUBECONFIG_DATA" ]]; then
            echo "KUBECONFIG_DATA secret not provided, skipping kubeconfig setup"
            exit 0
          fi
          echo "Setting up kubeconfig from secret..."
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          echo "Kubeconfig loaded successfully"
          echo "Current kubeconfig context:"
          kubectl config current-context
          echo "Cluster info:"
          # 'kubectl cluster-info' lists services in kube-system, which a deploy
          # role scoped to a single namespace -- the recommended setup -- cannot
          # read, so it fails with Forbidden on a perfectly good connection.
          # Discovery and SelfSubjectAccessReview are available to any
          # authenticated principal, so check reachability and access that way.
          kubectl version --request-timeout=20s >/dev/null || {
            echo "::error::Cannot reach the Kubernetes API"
            exit 1
          }
          if [[ -n "${NAMESPACE:-}" ]]; then
            kubectl auth can-i get deployments -n "${NAMESPACE}" >/dev/null || {
              echo "::error::Reached the cluster but have no access in namespace '${NAMESPACE}'"
              echo "::error::Check the EKS access entry / RBAC binding for this role."
              exit 1
            }
          fi
          echo "Nodes:"
          kubectl get nodes

      - name: Configure AWS Credentials
        if: inputs.role_to_assume != ''
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup EKS kubectl
        if: inputs.check_type == 'k8s' && inputs.cluster_name != ''
        env:
          NAMESPACE: ${{ inputs.namespace }}
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          aws eks update-kubeconfig --name "${CLUSTER_NAME}" --region "${AWS_REGION}"
          # 'kubectl cluster-info' lists services in kube-system, which a deploy
          # role scoped to a single namespace -- the recommended setup -- cannot
          # read, so it fails with Forbidden on a perfectly good connection.
          # Discovery and SelfSubjectAccessReview are available to any
          # authenticated principal, so check reachability and access that way.
          kubectl version --request-timeout=20s >/dev/null || {
            echo "::error::Cannot reach the Kubernetes API"
            exit 1
          }
          if [[ -n "${NAMESPACE:-}" ]]; then
            kubectl auth can-i get deployments -n "${NAMESPACE}" >/dev/null || {
              echo "::error::Reached the cluster but have no access in namespace '${NAMESPACE}'"
              echo "::error::Check the EKS access entry / RBAC binding for this role."
              exit 1
            }
          fi

      - name: Initial Delay
        env:
          INITIAL_DELAY: ${{ inputs.initial_delay }}
        run: |
          echo "Waiting ${INITIAL_DELAY} seconds before health check..."
          sleep "${INITIAL_DELAY}"

      # -------------------------------------------------------------------------
      # KUBERNETES HEALTH CHECK
      # -------------------------------------------------------------------------
      - name: Kubernetes Health Check
        id: k8s_check
        if: inputs.check_type == 'k8s'
        env:
          NAMESPACE: ${{ inputs.namespace }}
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
          WORKLOAD_KIND: ${{ inputs.workload_kind }}
          ADDITIONAL_WORKLOADS: ${{ inputs.additional_workloads }}
          RETRIES: ${{ inputs.retries }}
          RETRY_INTERVAL: ${{ inputs.retry_interval }}
          TIMEOUT: ${{ inputs.timeout }}
        run: |
          set -uo pipefail

          # Never guess the target. The previous version listed the namespace and
          # took the first deployment, so a check for one component could pass on
          # the strength of a completely different one.
          if [[ -z "${DEPLOYMENT_NAME}" ]]; then
            echo "::error::deployment_name is required for a k8s health check."
            echo "::error::Refusing to pick an arbitrary workload from the namespace."
            echo "status=unhealthy" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          EXTRA="${ADDITIONAL_WORKLOADS:-[]}"
          if ! printf '%s' "$EXTRA" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "::error::additional_workloads must be a JSON array; got: ${EXTRA}"
            echo "status=unhealthy" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          SPECS=("${WORKLOAD_KIND}|${DEPLOYMENT_NAME}")
          while IFS= read -r spec; do
            [[ -n "$spec" ]] && SPECS+=("$spec")
          done < <(printf '%s' "$EXTRA" | jq -r --arg k "${WORKLOAD_KIND}" '
            .[] | "\(.kind // $k)|\(.name // "")"')

          check_one() {
            local KIND="$1" NAME="$2" i
            for ((i=1; i<=RETRIES; i++)); do
              echo "  attempt $i/${RETRIES} for ${KIND}/${NAME}"
              local OUT
              if OUT=$(kubectl rollout status "${KIND}/${NAME}" -n "${NAMESPACE}" --timeout="${TIMEOUT}s" 2>&1); then
                local READY DESIRED
                READY=$(kubectl get "${KIND}" "${NAME}" -n "${NAMESPACE}" -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo 0)
                DESIRED=$(kubectl get "${KIND}" "${NAME}" -n "${NAMESPACE}" -o jsonpath='{.spec.replicas}' 2>/dev/null || echo 0)
                READY=${READY:-0}; DESIRED=${DESIRED:-0}
                if [[ "$READY" == "$DESIRED" && "$READY" -gt 0 ]]; then
                  # A ready count alone misses a container that is restarting.
                  local PODS CRASH
                  PODS=$(kubectl get pods -n "${NAMESPACE}" -l "app.kubernetes.io/instance=${NAME}" -o json 2>/dev/null)
                  if [[ -z "$PODS" || "$(printf '%s' "$PODS" | jq '.items | length')" == "0" ]]; then
                    PODS=$(kubectl get pods -n "${NAMESPACE}" -l "app=${NAME}" -o json 2>/dev/null || echo '{}')
                  fi
                  CRASH=$(printf '%s' "$PODS" | jq -r '
                    .items[]?.status.containerStatuses[]?
                    | select(.state.waiting.reason == "CrashLoopBackOff") | .name' 2>/dev/null)
                  if [[ -n "$CRASH" ]]; then
                    echo "::error::CrashLoopBackOff in ${KIND}/${NAME}: ${CRASH}"
                    return 1
                  fi
                  echo "  ${KIND}/${NAME} healthy (${READY}/${DESIRED} ready)"
                  return 0
                fi
              fi
              echo "  not ready: ${OUT:-no output from kubectl}"
              sleep "${RETRY_INTERVAL}"
            done
            echo "::error::${KIND}/${NAME} did not become healthy after ${RETRIES} attempts"
            kubectl get pods -n "${NAMESPACE}" -l "app.kubernetes.io/instance=${NAME}" 2>/dev/null || true
            return 1
          }

          FAILED=()
          for spec in "${SPECS[@]}"; do
            IFS='|' read -r KIND NAME <<< "$spec"
            case "$KIND" in
              deployment|statefulset|daemonset) ;;
              *) echo "::error::Unsupported workload kind '${KIND}'."
                 echo "status=unhealthy" >> "$GITHUB_OUTPUT"; exit 1 ;;
            esac
            echo "::group::health ${KIND}/${NAME}"
            check_one "$KIND" "$NAME" || FAILED+=("${KIND}/${NAME}")
            echo "::endgroup::"
          done

          if [[ ${#FAILED[@]} -gt 0 ]]; then
            echo "--- RECENT EVENTS ---"
            kubectl get events -n "${NAMESPACE}" --sort-by='.lastTimestamp' 2>/dev/null | tail -20 || true
            echo "status=unhealthy" >> "$GITHUB_OUTPUT"
            echo "details=unhealthy: ${FAILED[*]}" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "status=healthy" >> "$GITHUB_OUTPUT"
          echo "details=${#SPECS[@]} workload(s) healthy in ${NAMESPACE}" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------------------
      # HTTP HEALTH CHECK
      # -------------------------------------------------------------------------

      - name: HTTP Health Check
        id: http_check
        if: inputs.check_type == 'http' || inputs.check_type == 'url'
        env:
          HEALTH_URL: ${{ inputs.health_url }}
          INGRESS_DOMAIN: ${{ inputs.ingress_domain }}
          ENVIRONMENT: ${{ inputs.environment }}
          HEALTH_ENDPOINT: ${{ inputs.health_endpoint }}
          RETRIES: ${{ inputs.retries }}
          RETRY_INTERVAL: ${{ inputs.retry_interval }}
          TIMEOUT: ${{ inputs.timeout }}
          VERIFY_SSL: ${{ inputs.verify_ssl }}
        run: |
          echo "Running HTTP health check..."
          
          # Determine URL
          if [[ -n "${HEALTH_URL}" && "${HEALTH_URL}" != "N/A" ]]; then
            URL="${HEALTH_URL}"
          else
            # Construct URL from environment
            if [[ -n "${INGRESS_DOMAIN}" ]]; then
              URL="https://${ENVIRONMENT}.${INGRESS_DOMAIN}${HEALTH_ENDPOINT}"
            else
              URL="N/A"
            fi
          fi
          
          echo "Target: $URL"
          
          MAX_RETRIES="${RETRIES}"
          
          # SSL verification flag (disable for dev with self-signed certs)
          if [[ "${VERIFY_SSL}" == "false" ]]; then
            SSL_FLAG="-k"
            echo "SSL verification disabled"
          else
            SSL_FLAG=""
          fi
          
          for ((i=1; i<=MAX_RETRIES; i++)); do
            echo "Attempt $i/$MAX_RETRIES..."
            
            # Capture both status and body
            RESPONSE=$(curl -s $SSL_FLAG -w "\n%{http_code}" --max-time $TIMEOUT "$URL" 2>&1) || RESPONSE="Error: curl failed\n000"
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            
            if [[ "$HTTP_STATUS" == "200" ]]; then
              echo "Health check passed (HTTP $HTTP_STATUS)"
              echo "status=healthy" >> $GITHUB_OUTPUT
              
              # Pretty-print JSON if jq is available
              if echo "$BODY" | jq . > /dev/null 2>&1; then
                PRETTY_BODY=$(echo "$BODY" | jq .)
                echo "Response Body:"
                echo "$PRETTY_BODY"
                echo "details<<EOF" >> $GITHUB_OUTPUT
                echo "HTTP 200 OK from $URL. Body: $BODY" >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT
              else
                echo "Response Body: $BODY"
                echo "details<<EOF" >> $GITHUB_OUTPUT
                echo "HTTP 200 OK from $URL. Body: $BODY" >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT
              fi
              exit 0
            fi
            
            echo "HTTP status: $HTTP_STATUS - Retrying in ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done
          
          echo "::error::HTTP health check failed after $MAX_RETRIES attempts"
          echo "status=unhealthy" >> $GITHUB_OUTPUT
          echo "details=HTTP $HTTP_STATUS from $URL" >> $GITHUB_OUTPUT
          exit 1

      # -------------------------------------------------------------------------
      # TCP HEALTH CHECK
      # -------------------------------------------------------------------------
      - name: TCP Health Check
        id: tcp_check
        if: inputs.check_type == 'tcp'
        run: |
          echo "Running TCP health check..."
          echo "::warning::TCP health check not yet implemented"
          echo "status=healthy" >> $GITHUB_OUTPUT
          echo "details=TCP check skipped" >> $GITHUB_OUTPUT

      # -------------------------------------------------------------------------
      # RESULT AGGREGATION
      # -------------------------------------------------------------------------
      - name: Set Result
        id: result
        if: always()
        env:
          STEP_K8S_CHECK_STATUS: ${{ steps.k8s_check.outputs.status }}
          STEP_K8S_CHECK_DETAILS: ${{ steps.k8s_check.outputs.details }}
          STEP_HTTP_CHECK_STATUS: ${{ steps.http_check.outputs.status }}
          STEP_HTTP_CHECK_DETAILS: ${{ steps.http_check.outputs.details }}
          STEP_TCP_CHECK_STATUS: ${{ steps.tcp_check.outputs.status }}
          STEP_TCP_CHECK_DETAILS: ${{ steps.tcp_check.outputs.details }}
        run: |
          # Aggregate results from all check types
          if [[ "${STEP_K8S_CHECK_STATUS}" == "healthy" ]]; then
            echo "status=healthy" >> $GITHUB_OUTPUT
            echo "details<<EOF" >> $GITHUB_OUTPUT
            echo "${STEP_K8S_CHECK_DETAILS}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          elif [[ "${STEP_HTTP_CHECK_STATUS}" == "healthy" ]]; then
            echo "status=healthy" >> $GITHUB_OUTPUT
            echo "details<<EOF" >> $GITHUB_OUTPUT
            echo "${STEP_HTTP_CHECK_DETAILS}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          elif [[ "${STEP_TCP_CHECK_STATUS}" == "healthy" ]]; then
            echo "status=healthy" >> $GITHUB_OUTPUT
            echo "details<<EOF" >> $GITHUB_OUTPUT
            echo "${STEP_TCP_CHECK_DETAILS}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "status=unhealthy" >> $GITHUB_OUTPUT
            echo "details=Health check failed" >> $GITHUB_OUTPUT
          fi

      - name: Generate Summary
        if: always()
        env:
          DETAILS: ${{ steps.result.outputs.details }}
          STATUS: ${{ steps.result.outputs.status }}
          ENVIRONMENT: ${{ inputs.environment }}
          CHECK_TYPE: ${{ inputs.check_type }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          echo "## Health Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${ENVIRONMENT} |" >> $GITHUB_STEP_SUMMARY
          echo "| Check Type | ${CHECK_TYPE} |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | ${NAMESPACE} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | **$STATUS** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "$STATUS" == "healthy" ]]; then
            echo "### Health Check: **PASSED**" >> $GITHUB_STEP_SUMMARY
            echo "#### Details:" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            # Use env var to safely handle multiline details and extract JSON body
            echo "$DETAILS" | sed 's/.*Body: //' | jq . 2>/dev/null || echo "$DETAILS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### Health Check: **FAILED**" >> $GITHUB_STEP_SUMMARY
          fi
