name: "Module: Deploy to ECS"

# ------------------------------------------------------------------------------
# Amazon ECS deployment with rolling updates.
# Supports: Fargate, EC2 launch types.
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        type: string
        required: true
      image_uri:
        description: "Docker image URI"
        type: string
        required: true
      
      # ECS settings
      cluster_name:
        description: "ECS cluster name"
        type: string
        required: true
      service_name:
        description: "ECS service name"
        type: string
        required: true
      task_definition_family:
        description: "Task definition family name"
        type: string
        required: true
      container_name:
        description: "Container name in task definition"
        type: string
        required: true
      
      # Deployment settings
      desired_count:
        description: "Desired task count (0 = keep current)"
        type: string
        default: "0"
      force_new_deployment:
        description: "Force new deployment"
        type: boolean
        default: true
      wait_for_stability:
        description: "Wait for service stability"
        type: boolean
        default: true
      
      # AWS
      aws_region:
        description: "AWS region"
        type: string
        default: "us-east-1"
      role_to_assume:
        description: "AWS IAM role for OIDC"
        type: string
        required: true

      # Routing
      ingress_domain:
        description: "Base domain used to construct the app URL when no load balancer is attached"
        type: string
        default: ""

    outputs:
      status:
        description: "Deployment status"
        value: ${{ jobs.deploy.outputs.status }}
      task_definition_arn:
        description: "New task definition ARN"
        value: ${{ jobs.deploy.outputs.task_arn }}
      service_arn:
        description: "Updated service ARN"
        value: ${{ jobs.deploy.outputs.service_arn }}
      url:
        description: "Deployed application URL (empty if it could not be determined)"
        value: ${{ jobs.deploy.outputs.url }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    environment:
      name: ${{ inputs.environment }}
    
    outputs:
      status: ${{ steps.result.outputs.status }}
      task_arn: ${{ steps.register.outputs.task_arn }}
      service_arn: ${{ steps.update.outputs.service_arn }}
      url: ${{ steps.deploy_url.outputs.url }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Get Current Task Definition
        id: current_task
        env:
          TASK_DEFINITION_FAMILY: ${{ inputs.task_definition_family }}
          CONTAINER_NAME: ${{ inputs.container_name }}
        run: |
          echo "📋 Fetching current task definition..."
          
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "${TASK_DEFINITION_FAMILY}" \
            --query 'taskDefinition' \
            --output json)
          
          # Save to file for manipulation
          echo "$TASK_DEF" > current-task-def.json
          
          # Extract current image
          CURRENT_IMAGE=$(echo "$TASK_DEF" | jq -r ".containerDefinitions[] | select(.name==\"${CONTAINER_NAME}\") | .image")
          echo "Current image: $CURRENT_IMAGE"
          echo "current_image=$CURRENT_IMAGE" >> $GITHUB_OUTPUT

      - name: Update Task Definition
        id: update_task
        env:
          IMAGE_URI: ${{ inputs.image_uri }}
          CONTAINER_NAME: ${{ inputs.container_name }}
        run: |
          echo "🔄 Updating task definition with new image..."
          
          NEW_IMAGE="${IMAGE_URI}"
          
          # Update image in task definition
          jq --arg image "$NEW_IMAGE" --arg container "${CONTAINER_NAME}" \
            '.containerDefinitions = [.containerDefinitions[] | if .name == $container then .image = $image else . end]' \
            current-task-def.json > updated-task-def.json
          
          # Remove fields that can't be in register-task-definition
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            updated-task-def.json > new-task-def.json
          
          echo "Task definition updated"

      - name: Register New Task Definition
        id: register
        run: |
          echo "📝 Registering new task definition..."
          
          TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "New task definition: $TASK_ARN"
          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT

      - name: Update ECS Service
        id: update
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          SERVICE_NAME: ${{ inputs.service_name }}
          STEP_REGISTER_TASK_ARN: ${{ steps.register.outputs.task_arn }}
          FORCE_NEW_DEPLOYMENT: ${{ inputs.force_new_deployment }}
          DESIRED_COUNT: ${{ inputs.desired_count }}
        run: |
          set -euo pipefail
          echo "Updating ECS service..."

          # argv array rather than a command string + eval: every value stays a
          # single argument and can never be re-parsed as shell syntax.
          ARGS=(ecs update-service
                --cluster "$CLUSTER_NAME"
                --service "$SERVICE_NAME"
                --task-definition "$STEP_REGISTER_TASK_ARN")

          [[ "$FORCE_NEW_DEPLOYMENT" == "true" ]] && ARGS+=(--force-new-deployment)

          if [[ "$DESIRED_COUNT" =~ ^[0-9]+$ && "$DESIRED_COUNT" -gt 0 ]]; then
            ARGS+=(--desired-count "$DESIRED_COUNT")
          fi

          SERVICE_ARN=$(aws "${ARGS[@]}" --query 'service.serviceArn' --output text)

          echo "Service updated: $SERVICE_ARN"
          echo "service_arn=$SERVICE_ARN" >> "$GITHUB_OUTPUT"

      - name: Wait for Service Stability
        if: inputs.wait_for_stability == true
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          SERVICE_NAME: ${{ inputs.service_name }}
        run: |
          echo "⏳ Waiting for service stability..."
          
          aws ecs wait services-stable \
            --cluster "${CLUSTER_NAME}" \
            --services "${SERVICE_NAME}" || {
            echo "::error::Service did not stabilize"
            exit 1
          }
          
          echo "✅ Service is stable"

      - name: Verify Deployment
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          SERVICE_NAME: ${{ inputs.service_name }}
        run: |
          echo "🔍 Verifying deployment..."
          
          CLUSTER="${CLUSTER_NAME}"
          SERVICE="${SERVICE_NAME}"
          
          # Get running tasks
          TASKS=$(aws ecs list-tasks \
            --cluster "$CLUSTER" \
            --service-name "$SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns[]' \
            --output text)
          
          if [[ -z "$TASKS" ]]; then
            echo "::warning::No running tasks found"
          else
            echo "Running tasks:"
            aws ecs describe-tasks \
              --cluster "$CLUSTER" \
              --tasks $TASKS \
              --query 'tasks[].{TaskArn:taskArn,Status:lastStatus,Image:containers[0].image}' \
              --output table
          fi

      - name: Generate Deployment URL
        id: deploy_url
        if: always()
        env:
          CLUSTER: ${{ inputs.cluster_name }}
          SERVICE: ${{ inputs.service_name }}
          INGRESS_DOMAIN: ${{ inputs.ingress_domain }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -uo pipefail

          # Resolve the ALB/NLB in front of the service, if any.
          TG_ARN=$(aws ecs describe-services             --cluster "$CLUSTER" --services "$SERVICE"             --query 'services[0].loadBalancers[0].targetGroupArn'             --output text 2>/dev/null || echo "None")

          LB_DNS=""
          if [[ -n "$TG_ARN" && "$TG_ARN" != "None" ]]; then
            LB_ARN=$(aws elbv2 describe-target-groups               --target-group-arns "$TG_ARN"               --query 'TargetGroups[0].LoadBalancerArns[0]'               --output text 2>/dev/null || echo "None")
            if [[ -n "$LB_ARN" && "$LB_ARN" != "None" ]]; then
              LB_DNS=$(aws elbv2 describe-load-balancers                 --load-balancer-arns "$LB_ARN"                 --query 'LoadBalancers[0].DNSName'                 --output text 2>/dev/null || echo "")
            fi
          fi

          if [[ -n "$INGRESS_DOMAIN" ]]; then
            URL="https://${ENVIRONMENT}.${INGRESS_DOMAIN}"
          elif [[ -n "$LB_DNS" && "$LB_DNS" != "None" ]]; then
            URL="http://${LB_DNS}"
          else
            URL=""
            echo "::notice::No load balancer or ingress_domain found; application URL is unavailable."
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Application URL: ${URL:-<none>}"

      - name: Set Result
        id: result
        if: always()
        env:
          STEP_UPDATE_SERVICE_ARN: ${{ steps.update.outputs.service_arn }}
        run: |
          if [[ -n "${STEP_UPDATE_SERVICE_ARN}" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Generate Summary
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          SERVICE_NAME: ${{ inputs.service_name }}
          CONTAINER_NAME: ${{ inputs.container_name }}
          IMAGE_URI: ${{ inputs.image_uri }}
          STEP_REGISTER_TASK_ARN: ${{ steps.register.outputs.task_arn }}
          STEP_RESULT_STATUS: ${{ steps.result.outputs.status }}
        run: |
          echo "## 🐳 ECS Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${ENVIRONMENT} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster | ${CLUSTER_NAME} |" >> $GITHUB_STEP_SUMMARY
          echo "| Service | ${SERVICE_NAME} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container | ${CONTAINER_NAME} |" >> $GITHUB_STEP_SUMMARY
          echo "| New Image | \`${IMAGE_URI}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Task Definition | ${STEP_REGISTER_TASK_ARN} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${STEP_RESULT_STATUS}" == "success" ]]; then
            echo "### ✅ Deployment: **SUCCESS**" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Deployment: **FAILED**" >> $GITHUB_STEP_SUMMARY
          fi
