name: "Module: Docker Build & Push (Universal)"
# ------------------------------------------------------------------------------
# UNIVERSAL Docker build module with SMART VERSIONING
#
# VERSIONING STRATEGY:
# - feature/* branches    → feature-<name>-<short-sha>
# - development branch    → dev-<short-sha>
# - release/X.Y.Z branches → X.Y.Z-rc<run-number>  (Release Candidates)
# - Other branches        → <short-sha>
#
# REGISTRY MODES:
# 1. 'ecr': Uses AWS OIDC (No keys). Requires 'role_to_assume'.
# 2. 'generic': Uses Username/Password. Works with Docker Hub, GHCR.
# 3. 'nexus': Uses Nexus Docker registry.
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      # --- GENERAL INPUTS ---
      working_directory:
        description: "Directory containing the Dockerfile"
        type: string
        default: "."
      dockerfile:
        description: "Name of the Dockerfile"
        type: string
        default: "Dockerfile"
      image_name:
        description: "Image name (e.g., 'my-app' or 'org/my-app')"
        required: true
        type: string
      image_tag:
        description: "Tag to apply (defaults to smart versioning based on branch)"
        type: string
        default: "" 

      # --- REGISTRY STRATEGY ---
      registry_type:
        description: "Type of registry: 'ecr', 'generic', or 'nexus'"
        type: string
        default: "ecr"
      
      # --- MODE: GENERIC (Docker Hub, GHCR) ---
      registry_url:
        description: "URL of the registry (e.g., 'docker.io', 'ghcr.io'). Required for 'generic'."
        type: string
        default: ""
      registry_username:
        description: |
          Username for the generic registry. Prefer this over the secret of the
          same name: a value passed as a secret is masked, and GitHub drops any
          job output containing a masked value -- which silently empties
          image_uri downstream when the username also appears in the image name.
        type: string
        default: ""
      
      # --- MODE: AWS ECR ---
      aws_region:
        description: "AWS Region (Required for 'ecr')"
        type: string
        default: "us-east-1"
      role_to_assume:
        description: "IAM Role ARN (Required for 'ecr')"
        type: string
        default: ""

      # --- MODE: NEXUS DOCKER REGISTRY ---
      nexus_url:
        description: "Nexus base URL (Required for 'nexus')"
        type: string
        default: ""
      nexus_docker_repo:
        description: "Nexus Docker repository name (e.g., docker-hosted)"
        type: string
        default: "docker-hosted"
      
      # --- NEXUS ARTIFACT DOWNLOAD (Optimization) ---
      nexus_artifact_base_url:
        description: "Base URL for Nexus artifact download (e.g. https://nexus.example.com)"
        type: string
        default: ""
      nexus_artifact_repo:
        description: "Nexus Maven repository name (e.g., maven-releases) for artifact download"
        type: string
        default: "maven-releases"
      nexus_artifact_path:
        description: "Path to the artifact in Nexus (e.g., com/org/app/1.0.0/app.jar)"
        type: string
        default: ""
      artifact_name:
        description: "Unique identifier for the artifact (Used for GitHub Actions fallback download)"
        type: string
        default: ""

      # --- BUILD OPTIONS ---
      build_args:
        description: "Build args in KEY=VALUE format, one per line (optional)"
        type: string
        default: ""
      platforms:
        description: "Target platforms (e.g., 'linux/amd64,linux/arm64'). Defaults to linux/amd64."
        type: string
        default: "linux/amd64"
      push:
        description: "Push the image to the registry?"
        type: boolean
        default: true
      export_image_artifact:
        description: |
          When not pushing, save the built image as a tarball artifact so a
          later job can scan it. Without this a build-only run has nothing for
          the container scanners to fetch, because the image exists only in this
          job's build cache.
        type: boolean
        default: false
      backup_existing_tag:
        description: |
          Before pushing, copy any image already at this tag to <tag>-backup.
          Only meaningful for mutable tags such as a release candidate that can
          be rebuilt: it keeps one level of undo, because overwriting the tag
          otherwise makes the previous image unreachable. Pointless for
          immutable tags like a commit SHA, so it is off by default.
        type: boolean
        default: false

    secrets:
      # Secrets for 'generic' mode
      registry_username:
        description: "Username for Generic Registry"
        required: false
      registry_password:
        description: "Password/Token for Generic Registry"
        required: false
      # Secrets for 'nexus' mode
      NEXUS_USERNAME:
        description: "Nexus Username"
        required: false
      NEXUS_PASSWORD:
        description: "Nexus Password/Token"
        required: false

    outputs:
      image_uri:
        description: "Full URI of the pushed image"
        value: ${{ jobs.build-push.outputs.image_uri }}
      image_digest:
        description: "SHA256 digest of the pushed image (immutable reference)"
        value: ${{ jobs.build-push.outputs.image_digest }}
      image_artifact:
        description: "Name of the uploaded image tarball artifact, empty if none"
        value: ${{ jobs.build-push.outputs.image_artifact }}

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      working_directory:
        description: "Directory with Dockerfile"
        type: string
        default: "."
      dockerfile:
        description: "Dockerfile name"
        type: string
        default: "Dockerfile"
      image_name:
        description: "Image name"
        type: string
        required: true
      image_tag:
        description: "Image tag (leave empty for smart versioning)"
        type: string
        default: ""
      registry_type:
        description: "Registry type"
        type: choice
        options:
          - ecr
          - generic
          - nexus
        default: "ecr"
      registry_url:
        description: "Registry URL (generic mode)"
        type: string
        default: ""
      aws_region:
        description: "AWS Region (ECR mode)"
        type: string
        default: "us-east-1"
      role_to_assume:
        description: "IAM Role ARN (ECR mode)"
        type: string
        default: ""
      nexus_url:
        description: "Nexus URL (nexus mode)"
        type: string
        default: ""
      nexus_docker_repo:
        description: "Nexus Docker repository"
        type: string
        default: "docker-hosted"
      build_args:
        description: "Build arguments (KEY=VALUE, one per line)"
        type: string
        default: ""
      platforms:
        description: "Target platforms"
        type: string
        default: "linux/amd64"

permissions:
  contents: read
  id-token: write  # AWS OIDC
  packages: write  # GHCR push
  actions: read           # artifact + SARIF metadata

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}
      image_digest: ${{ steps.build.outputs.digest }}
      image_artifact: ${{ steps.export.outputs.name }}

    # The `secrets` context is not available in a step-level `if:`, but it is
    # available in job-level `env:`. Resolve the presence check once here so
    # the login steps can branch on it.
    env:
      HAS_REGISTRY_CREDS: ${{ (inputs.registry_username || secrets.registry_username) != '' }}

    steps:
      # ----------------------------------------------------------------------
      # 1. SETUP
      # ----------------------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # ----------------------------------------------------------------------
      # 2. REGISTRY AUTHENTICATION (Strategy Pattern)
      # ----------------------------------------------------------------------
      
      # MODE A: AWS ECR (OIDC - No Keys)
      - name: Configure AWS Credentials (OIDC)
        if: inputs.registry_type == 'ecr'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        if: inputs.registry_type == 'ecr'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      # MODE B: Generic Registry (Docker Hub, GHCR, etc.)
      # Skipped on a PR that does not push: forks and PR builds have no
      # registry credentials, and a login attempt would fail the job.
      - name: Login to Generic Registry
        if: inputs.registry_type == 'generic' && (inputs.push == true || env.HAS_REGISTRY_CREDS == 'true')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry_url }}
          username: ${{ inputs.registry_username || secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      # MODE C: Nexus Docker Registry
      - name: Login to Nexus Docker Registry
        if: inputs.registry_type == 'nexus'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.nexus_url }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      # ----------------------------------------------------------------------
      # 3. NEXUS ARTIFACT DOWNLOAD (Optional Performance Optimization)
      # If artifacts are pre-built and uploaded to Nexus, download them
      # directly into the Docker build context instead of rebuilding.
      # ----------------------------------------------------------------------
      - name: Download Artifact from Nexus
        if: inputs.nexus_artifact_path != ''
        id: download
        env:
          NEXUS_BASE_URL: ${{ inputs.nexus_artifact_base_url }}
          NEXUS_REPO: ${{ inputs.nexus_artifact_repo }}
          ARTIFACT_PATH: ${{ inputs.nexus_artifact_path }}
          NEXUS_USER: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          echo "📦 Downloading artifact from Nexus..."
          
          # Construct full URL: BASE_URL/repository/REPO/PATH
          ARTIFACT_URL="${NEXUS_BASE_URL}/repository/${NEXUS_REPO}/${ARTIFACT_PATH}"
          
          # Extract filename from path
          FILENAME=$(basename "$ARTIFACT_PATH")
          
          # Download with authentication
          curl -u "${NEXUS_USER}:${NEXUS_PASS}" \
               -f \
               -o "${FILENAME}" \
               "${ARTIFACT_URL}"
          
          if [[ $? -eq 0 ]]; then
            echo "✅ Downloaded: ${FILENAME}"
            ls -lh "${FILENAME}"
            echo "artifact_name=${FILENAME}" >> $GITHUB_OUTPUT
          else
            echo "❌ Failed to download artifact from ${ARTIFACT_URL}"
            exit 1
          fi

      - name: Download Artifact from GitHub (Fallback)
        if: inputs.nexus_artifact_path == '' && inputs.artifact_name != ''
        id: download_gh
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: .
      
      - name: Setup Artifact Name Output
        id: artifact_info
        env:
          STEP_DOWNLOAD_ARTIFACT_NAME: ${{ steps.download.outputs.artifact_name }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          if [[ -n "${STEP_DOWNLOAD_ARTIFACT_NAME}" ]]; then
            echo "name=${STEP_DOWNLOAD_ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          elif [[ -n "${ARTIFACT_NAME}" ]]; then
            # When downloading from GitHub, we need to find what was inside the artifact
            # Since the build scripts upload a single file, we can look for it
            FILENAME=$(ls *.whl *.tgz *.jar 2>/dev/null | head -n 1)
            echo "name=$FILENAME" >> $GITHUB_OUTPUT
          else
            echo "name=" >> $GITHUB_OUTPUT
          fi

      # ----------------------------------------------------------------------
      # 4. SMART VERSIONING METADATA
      # Detects branch type and generates appropriate image tags
      # ----------------------------------------------------------------------
      - name: Calculate Metadata
        id: meta
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          REGISTRY_TYPE: ${{ inputs.registry_type }}
          NEXUS_URL: ${{ inputs.nexus_url }}
          NEXUS_DOCKER_REPO: ${{ inputs.nexus_docker_repo }}
          IMAGE_NAME: ${{ inputs.image_name }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          GENERIC_REGISTRY: ${{ inputs.registry_url }}
        run: |
          echo "🏷️  SMART VERSIONING - Branch Detection"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # 1. DETERMINE TAG WITH BRANCH-AWARE LOGIC
          if [[ -n "$IMAGE_TAG" ]]; then
            # Explicit tag from input (manual override or config)
            TAG="$IMAGE_TAG"
            echo "🎯 Explicit tag provided: $TAG"
          
          elif [[ "$GITHUB_REF" =~ ^refs/heads/release/(.+)$ ]]; then
            # RELEASE BRANCH: Extract version and append RC number
            VERSION="${BASH_REMATCH[1]}"
            # Strip leading 'v' if present (release/v2.1.0 → 2.1.0)
            VERSION="${VERSION#v}"
            TAG="${VERSION}-rc${GITHUB_RUN_NUMBER}"
            echo "📦 Release branch detected: $GITHUB_REF"
            echo "🎯 Building release candidate: $TAG"
            echo "   (Run #${GITHUB_RUN_NUMBER} on this release branch)"
          
          elif [[ "$GITHUB_REF" == "refs/heads/development" || "$GITHUB_REF" == "refs/heads/develop" ]]; then
            # DEVELOPMENT BRANCH: Prefix with 'dev-'
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="dev-${SHORT_SHA}"
            echo "🔧 Development branch build: $TAG"
          
          elif [[ "$GITHUB_REF" =~ ^refs/heads/feature/(.+)$ ]]; then
            # FEATURE BRANCH: Sanitized name + short SHA
            FEATURE_NAME="${BASH_REMATCH[1]}"
            # Replace slashes and other special chars with hyphens
            FEATURE_NAME=$(echo "$FEATURE_NAME" | sed 's|[^a-zA-Z0-9]|-|g')
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="feature-${FEATURE_NAME}-${SHORT_SHA}"
            echo "🚀 Feature branch build: $TAG"
          
          else
            # FALLBACK: Short SHA (for main, hotfix, or any other branch)
            TAG=$(git rev-parse --short HEAD)
            echo "⚙️  Standard build (SHA): $TAG"
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # 2. DETERMINE REGISTRY BASE URL AND CONSTRUCT FULL URI
          if [[ "$REGISTRY_TYPE" == "nexus" ]]; then
            REGISTRY="$NEXUS_URL"
            
            # Nexus has two modes:
            # A. Dedicated port mode: nexus.example.com:8082 (no repository path)
            # B. Subdirectory mode:   nexus.example.com/repository/docker-hosted
            
            # Detection: If nexus_docker_repo is empty or 'docker-hosted' AND URL has port, assume dedicated
            if [[ "$NEXUS_DOCKER_REPO" == "docker-hosted" || -z "$NEXUS_DOCKER_REPO" ]] && [[ "$NEXUS_URL" =~ :[0-9]+$ ]]; then
              # Dedicated port mode
              FULL_URI="${REGISTRY}/${IMAGE_NAME}:${TAG}"
            else
              # Subdirectory mode
              FULL_URI="${REGISTRY}/${NEXUS_DOCKER_REPO}/${IMAGE_NAME}:${TAG}"
            fi
          
          elif [[ "$REGISTRY_TYPE" == "ecr" ]]; then
            # AWS ECR
            REGISTRY="$ECR_REGISTRY"
            FULL_URI="${REGISTRY}/${IMAGE_NAME}:${TAG}"
          
          else
            # Generic (Docker Hub, GHCR, etc.)
            REGISTRY="$GENERIC_REGISTRY"
            # Docker Hub special case: no registry prefix if it's docker.io
            if [[ "$REGISTRY" == "docker.io" ]]; then
              FULL_URI="${IMAGE_NAME}:${TAG}"
            else
              FULL_URI="${REGISTRY}/${IMAGE_NAME}:${TAG}"
            fi
          fi
          
          echo "image_uri=$FULL_URI" >> $GITHUB_OUTPUT
          echo ""
          echo "📦 Final Image URI: $FULL_URI"

      # ----------------------------------------------------------------------
      # 5. BUILD & PUSH (with Provenance OFF for reproducibility)
      # ----------------------------------------------------------------------
      - name: Parse Build Args
        id: parse-build-args
        env:
          BUILD_ARGS: ${{ inputs.build_args }}
          DOWNLOADED_ARTIFACT: ${{ steps.artifact_info.outputs.name }}
        run: |
          # Start with the input build args
          COMBINED_ARGS="$BUILD_ARGS"
          
          # If an artifact was downloaded, inject ARTIFACT_NAME automatically
          if [[ -n "$DOWNLOADED_ARTIFACT" ]]; then
            echo "📦 Injecting ARTIFACT_NAME=$DOWNLOADED_ARTIFACT into build-args"
            if [[ -n "$COMBINED_ARGS" ]]; then
              COMBINED_ARGS="${COMBINED_ARGS}"$'\n'"ARTIFACT_NAME=$DOWNLOADED_ARTIFACT"
            else
              COMBINED_ARGS="ARTIFACT_NAME=$DOWNLOADED_ARTIFACT"
            fi
          fi
          
          if [[ -n "$COMBINED_ARGS" ]]; then
            # Convert multiline string to comma-separated for build-push-action
            ARGS=$(echo "$COMBINED_ARGS" | tr '\n' ',' | sed 's/,$//')
            echo "args=$ARGS" >> $GITHUB_OUTPUT
            echo "📋 Combined Build Args: $ARGS"
          else
            echo "args=" >> $GITHUB_OUTPUT
          fi

      # Runs after login and after the tag is known, but before the push that
      # would overwrite it.
      - name: Backup Existing Tag
        if: inputs.push == true && inputs.backup_existing_tag == true
        env:
          IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
        run: |
          set -uo pipefail
          BACKUP="${IMAGE_URI}-backup"

          if ! docker buildx imagetools inspect "$IMAGE_URI" >/dev/null 2>&1; then
            echo "Nothing at ${IMAGE_URI} yet; no backup needed."
            exit 0
          fi

          echo "Backing up ${IMAGE_URI} -> ${BACKUP}"
          # Manifest-only copy: the registry re-points a tag, no layers move.
          if docker buildx imagetools create --tag "$BACKUP" "$IMAGE_URI"; then
            echo "Previous image preserved at ${BACKUP}"
          else
            echo "::error::Could not back up ${IMAGE_URI}. Refusing to overwrite it."
            exit 1
          fi

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.working_directory }}
          file: ${{ inputs.working_directory }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.image_uri }}
          build-args: ${{ steps.parse-build-args.outputs.args }}
          provenance: false  # Disable provenance for reproducible builds
          # Note: Set provenance: true, mode: max for SLSA Level 2+ compliance
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # On a build-only run, also write the image to a tarball so a later
          # job can scan it. A `docker` output cannot be combined with a
          # multi-arch build, which is why this is opt-in rather than always on.
          outputs: ${{ (inputs.push != true && inputs.export_image_artifact == true) && format('type=docker,dest={0}/image.tar', runner.temp) || '' }}

      # ----------------------------------------------------------------------
      # 5b. EXPORT FOR SCANNING (build-only runs)
      # Without this, a build-only image exists only in this job's build cache
      # and the container scanners have nothing to fetch.
      # ----------------------------------------------------------------------
      - name: Verify Image Tarball
        id: export
        if: inputs.push != true && inputs.export_image_artifact == true
        env:
          ARTIFACT: image-${{ github.run_id }}-${{ github.job }}
        run: |
          set -euo pipefail
          if [[ ! -s "${RUNNER_TEMP}/image.tar" ]]; then
            echo "::error::Expected an image tarball at ${RUNNER_TEMP}/image.tar but found none."
            exit 1
          fi
          ls -lh "${RUNNER_TEMP}/image.tar"
          echo "name=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Store Image Tarball
        if: inputs.push != true && inputs.export_image_artifact == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ github.run_id }}-${{ github.job }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

      # ----------------------------------------------------------------------
      # 6. OUTPUT SUMMARY
      # ----------------------------------------------------------------------
      - name: Summary
        env:
          STEP_META_IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
          STEP_BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          STEP_META_TAG: ${{ steps.meta.outputs.tag }}
          REGISTRY_TYPE: ${{ inputs.registry_type }}
          PLATFORMS: ${{ inputs.platforms }}
          PUSHED: ${{ inputs.push }}
        run: |
          echo "# 🐳 Docker Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Attribute | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image URI** | \`${STEP_META_IMAGE_URI}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | \`${STEP_BUILD_DIGEST}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${STEP_META_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Registry** | ${REGISTRY_TYPE} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platforms** | ${PLATFORMS} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Report what actually happened. When push is false the image is only
          # ever in the build cache, so claiming a push here is simply untrue.
          if [[ "$PUSHED" == "true" ]]; then
            echo "✅ Image pushed to registry" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ Build-only run (\`push: false\`) — the image was validated and discarded, not pushed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No registry credentials were used and no image left this runner." >> $GITHUB_STEP_SUMMARY
          fi
