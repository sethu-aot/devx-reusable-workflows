name: "Repo CI: Cut Release"

# ------------------------------------------------------------------------------
# Creates an immutable vX.Y.Z tag and moves the vX alias to the same commit.
#
# Consumers pin to vX.Y.Z; the vX alias exists for convenience and moves. This
# workflow refuses to run unless repo-ci is green on the target commit and the
# version appears in CHANGELOG.md, so the alias can never be advanced past a
# broken or undocumented state.
# ------------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.2.3"
        type: string
        required: true
      move_major_alias:
        description: "Also move the vX alias (e.g. v1) to this commit"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create tags and the GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version and changelog
        id: check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v1.2.3, got '$VERSION'"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists. Releases are immutable."
            exit 1
          fi

          # The changelog is the release notes; refuse to ship an unrecorded version.
          if ! grep -qF "## [${VERSION#v}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION#v}]' section."
            exit 1
          fi

          MAJOR="${VERSION%%.*}"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (major alias $MAJOR)"

      - name: Require repo-ci to be green on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CONCLUSIONS=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" \
            --jq '.check_runs[] | select(.name | startswith("Lint workflows") or startswith("Validate")) | .conclusion')

          if [[ -z "$CONCLUSIONS" ]]; then
            echo "::error::No repo-ci check runs found for $SHA. Let CI finish first."
            exit 1
          fi
          if grep -vq '^success$' <<< "$CONCLUSIONS"; then
            echo "::error::repo-ci is not green on $SHA:"
            printf '  %s\n' $CONCLUSIONS
            exit 1
          fi
          echo "repo-ci is green on $SHA."

      - name: Create tags
        env:
          VERSION: ${{ inputs.version }}
          MAJOR: ${{ steps.check.outputs.major }}
          MOVE_ALIAS: ${{ inputs.move_major_alias }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          echo "Created immutable tag $VERSION"

          if [[ "$MOVE_ALIAS" == "true" ]]; then
            git tag -fa "$MAJOR" -m "$MAJOR -> $VERSION"
            git push origin "$MAJOR" --force
            echo "Moved alias $MAJOR to $VERSION"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${VERSION}/CHANGELOG.md) for the full entry." \
            --verify-tag
