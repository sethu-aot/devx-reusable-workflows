name: "Utility: Auto-Merge PR"

# ------------------------------------------------------------------------------
# Enables GitHub's native auto-merge on a Pull Request. The PR is merged by
# GitHub itself once every required status check passes -- this workflow only
# arms that behaviour, it never merges directly.
#
# Requirements:
#   1. "Allow auto-merge" enabled in Repository Settings.
#   2. Required status checks configured in the branch protection ruleset.
#   3. The caller must grant `pull-requests: write` and `contents: write`;
#      a reusable workflow can never hold more permission than its caller.
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      merge_method:
        description: "Merge method to use: merge, squash, or rebase"
        type: string
        default: "squash"
    secrets:
      GH_TOKEN:
        description: "GitHub token with pull-requests:write and contents:write"
        required: true

permissions:
  contents: write        # required by the auto-merge mutation
  pull-requests: write   # enable auto-merge on the PR

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGE_METHOD: ${{ inputs.merge_method }}
        run: |
          set -euo pipefail

          case "$MERGE_METHOD" in
            merge|squash|rebase) ;;
            *)
              echo "::error::Invalid merge_method '$MERGE_METHOD'. Use merge, squash or rebase."
              exit 1
              ;;
          esac

          echo "Enabling auto-merge (${MERGE_METHOD}) for PR: $PR_URL"
          gh pr merge "$PR_URL" --auto "--${MERGE_METHOD}"
