name: "Orchestrator: CD Pipeline"

# ------------------------------------------------------------------------------
# THE CD BRAIN - PRODUCTION IMPLEMENTATION
# 
# ARCHITECTURE:
# - Uses reusable deployment modules (no inline logic)
# - Proper job dependencies and error handling
# - Input validation before deployment
# - Integration with CI pipeline outputs
# 
# FLOW:
# 1. Load & validate configuration
# 2. Send "starting" notification
# 3. Route to target-specific deployment module (deploy-eks/ec2/ecs)
# 4. Health check (if enabled)
# 5. Auto-rollback (if health check fails)
# 6. Send final notification
# 7. Generate summary
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      # --- REQUIRED INPUTS ---
      environment:
        description: |
          Environment to deploy. Any name the config defines under
          deployment.environments is valid -- teams use demo, uat, sit, preprod
          and others, so this workflow does not keep a list of its own.
        type: string
        required: false
        default: "dev"
      image_uri:
        description: "Docker image URI to deploy"
        type: string
        required: false
        default: ""
      
      # --- OPTIONAL INPUTS ---
      config_path:
        description: "Path to DevX config file"
        type: string
        default: "devx-config.yaml"
      dry_run:
        description: "Perform dry-run without actual deployment"
        type: boolean
        default: false
      skip_health_check:
        description: "Skip post-deployment health checks"
        type: boolean
        default: false
      
    secrets:
      GOOGLE_CHAT_WEBHOOK:
        required: false
      NEXUS_USERNAME:
        required: false
      NEXUS_PASSWORD:
        required: false
      SSH_PRIVATE_KEY:
        description: "SSH private key for EC2 SSH deployments"
        required: false
      KUBECONFIG_DATA:
        description: "Base64 encoded kubeconfig (required when deployment.target is 'k8s')"
        required: false

    outputs:
      deployment_status:
        description: "Final deployment status"
        value: ${{ jobs.summary.outputs.status }}
      deployed_image:
        description: "Image that was deployed"
        value: ${{ inputs.image_uri }}
      deployment_url:
        description: "Deployed application URL"
        value: ${{ jobs.deploy-eks.outputs.url || jobs.deploy-eks-patch.outputs.url || jobs.deploy-ec2.outputs.url || jobs.deploy-ecs.outputs.url || jobs.deploy-k8s.outputs.url || '' }}

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (must exist in the config)"
        type: string
        required: true
        default: "dev"
      image_uri:
        description: "Docker image URI to deploy"
        type: string
        required: true
      config_path:
        description: "Config file path"
        type: string
        default: "devx-config.yaml"
      dry_run:
        description: "Dry run mode"
        type: boolean
        default: false

# Prevent concurrent deployments to the same environment
concurrency:
  group: cd-${{ github.workflow }}-${{ inputs.environment }}
  cancel-in-progress: false  # NEVER cancel in-progress deployments

permissions:
  contents: read
  id-token: write         # AWS OIDC
  actions: read           # artifact + SARIF metadata
  deployments: write      # GitHub Deployments API

jobs:
  # ---------------------------------------------------------------------------
  # 1. VALIDATE INPUTS & LOAD CONFIGURATION
  # ---------------------------------------------------------------------------
  validate-and-load:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      config: ${{ steps.parse.outputs.config }}
      deployment_target: ${{ steps.extract.outputs.target }}
      ingress_domain: ${{ steps.extract.outputs.ingress_domain }}
      image_pull_secret: ${{ steps.extract.outputs.image_pull_secret }}
      cluster_name: ${{ steps.extract.outputs.cluster_name }}
      namespace: ${{ steps.extract.outputs.namespace }}
      aws_region: ${{ steps.extract.outputs.aws_region }}
      role_to_assume: ${{ steps.extract.outputs.role_to_assume }}
      deployment_method: ${{ steps.extract.outputs.deployment_method }}
      deployment_name: ${{ steps.extract.outputs.deployment_name }}
      container_name: ${{ steps.extract.outputs.container_name }}
      workload_kind: ${{ steps.extract.outputs.workload_kind }}
      additional_workloads: ${{ steps.extract.outputs.additional_workloads }}
      # EKS-specific
      helm_chart_path: ${{ steps.extract.outputs.helm_chart_path }}
      helm_release_name: ${{ steps.extract.outputs.helm_release_name }}
      helm_values_file: ${{ steps.extract.outputs.helm_values_file }}
      helm_set_values: ${{ steps.extract.outputs.helm_set_values }}
      # EC2-specific
      ec2_deploy_method: ${{ steps.extract.outputs.ec2_deploy_method }}
      target_type: ${{ steps.extract.outputs.target_type }}
      target_tag_key: ${{ steps.extract.outputs.target_tag_key }}
      target_tag_value: ${{ steps.extract.outputs.target_tag_value }}
      instance_ids: ${{ steps.extract.outputs.instance_ids }}
      ssh_user: ${{ steps.extract.outputs.ssh_user }}
      docker_compose_path: ${{ steps.extract.outputs.docker_compose_path }}
      service_name: ${{ steps.extract.outputs.service_name }}
      # ECS-specific
      ecs_cluster_name: ${{ steps.extract.outputs.ecs_cluster_name }}
      ecs_service_name: ${{ steps.extract.outputs.ecs_service_name }}
      task_definition_family: ${{ steps.extract.outputs.task_definition_family }}
      # Common
      health_check_enabled: ${{ steps.extract.outputs.health_check_enabled }}
      health_check_endpoint: ${{ steps.extract.outputs.health_check_endpoint }}
      health_check_type: ${{ steps.extract.outputs.health_check_type }}
      health_check_url: ${{ steps.extract.outputs.health_check_url }}
      health_check_retries: ${{ steps.extract.outputs.health_check_retries }}
      health_check_retry_interval: ${{ steps.extract.outputs.health_check_retry_interval }}
      health_check_port: ${{ steps.extract.outputs.health_check_port }}
      notifications_enabled: ${{ steps.extract.outputs.notifications_enabled }}
      auto_rollback: ${{ steps.extract.outputs.auto_rollback }}
      atomic: ${{ steps.extract.outputs.atomic }}
      deployment_timeout: ${{ steps.extract.outputs.deployment_timeout }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ========================================================================
      # INPUT VALIDATION (Critical for security)
      # ========================================================================
      - name: Validate Inputs
        env:
          IMAGE_URI: ${{ inputs.image_uri }}
          ENVIRONMENT: ${{ inputs.environment }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          echo "Validating inputs..."
          
          # Trim whitespace from inputs (prevents YAML multiline newline issues)
          IMAGE_URI=$(echo "${IMAGE_URI}" | xargs)
          
          # Check the shape only. Which environments exist is the config's to
          # decide -- it is validated below against deployment.environments --
          # and a fixed list here would reject perfectly ordinary names like
          # demo, uat or preprod. The pattern still keeps the value safe to use
          # as a yq path segment and a Kubernetes name.
          if [[ ! "${ENVIRONMENT}" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "::error::Invalid environment name: '${ENVIRONMENT}'"
            echo "::error::Use lowercase letters, digits and hyphens (e.g. dev, demo, pre-prod)."
            exit 1
          fi

          if [[ -z "$IMAGE_URI" ]]; then
            echo "::error::image_uri is required; pass the image built by CI."
            exit 1
          fi
          
          # Validate image_uri format (security: block command injection)
          if [[ ! "$IMAGE_URI" =~ ^[a-zA-Z0-9._/:@-]+$ ]]; then
            echo "::error::Invalid image_uri format: $IMAGE_URI"
            echo "::error::Must match pattern: registry.com/image:tag"
            exit 1
          fi
          
          # Validate image_uri contains tag
          if [[ ! "$IMAGE_URI" =~ .+:.+ && ! "$IMAGE_URI" =~ .+@.+ ]]; then
            echo "::error::image_uri must include tag or digest (e.g., registry.com/image:tag or registry.com/image@sha256:...)"
            exit 1
          fi
          
          # Validate credentials for external registry
          REGISTRY=$(echo "$IMAGE_URI" | cut -d/ -f1)
          if [[ ! "$REGISTRY" == *".amazonaws.com"* ]] && [[ ! "$REGISTRY" == *".ecr."* ]]; then
            if [[ -z "${NEXUS_USERNAME}" ]] || [[ -z "${NEXUS_PASSWORD}" ]]; then
              echo "::warning::Nexus credentials (NEXUS_USERNAME/PASSWORD) are empty or not passed. Deployment might fail if host isn't pre-authenticated."
            else
              echo "✓ Nexus credentials detected in orchestrator"
            fi
          fi
          
          echo "Input validation passed"

      - name: Validate Config File
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "Validating configuration..."
          
          # Validate YAML syntax
          yq '.' "${CONFIG_PATH}" > /dev/null || {
            echo "::error::Invalid YAML syntax in ${CONFIG_PATH}"
            exit 1
          }
          
          # Validate deployment section exists
          DEPLOY_ENABLED=$(yq '.deployment.enabled // false' "${CONFIG_PATH}")
          if [[ "$DEPLOY_ENABLED" != "true" ]]; then
            echo "::error::Deployment is not enabled in config"
            echo "::error::Set deployment.enabled: true in ${CONFIG_PATH}"
            exit 1
          fi
          
          # Validate target environment is configured
          ENV_ENABLED=$(yq ".deployment.environments.${ENVIRONMENT}.enabled // false" "${CONFIG_PATH}")
          if [[ "$ENV_ENABLED" != "true" ]]; then
            echo "::error::Environment '${ENVIRONMENT}' is not enabled in config"
            exit 1
          fi
          
          # Validate deployment target
          TARGET=$(yq '.deployment.target // ""' "${CONFIG_PATH}")
          if [[ ! "$TARGET" =~ ^(eks|ec2|ecs|k8s)$ ]]; then
            echo "::error::Invalid deployment target: $TARGET"
            echo "::error::Must be one of: eks, ec2, ecs, k8s"
            exit 1
          fi
          
          echo "Config validation passed"

      - name: Parse Config
        id: parse
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          echo "config<<EOF" >> $GITHUB_OUTPUT
          yq -o=json "${CONFIG_PATH}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Extract Deployment Settings
        id: extract
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          CONFIG_FILE="${CONFIG_PATH}"
          ENV="${ENVIRONMENT}"
          
          echo "Extracting configuration for environment: $ENV"
          
          # Deployment target
          TARGET=$(yq ".deployment.environments.$ENV.target // .deployment.target" $CONFIG_FILE)
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          
          # Ingress domain (global vs environment)
          DOMAIN=$(yq ".deployment.environments.$ENV.ingress_domain // .deployment.ingress_domain // \"\"" $CONFIG_FILE)
          echo "ingress_domain=$DOMAIN" >> $GITHUB_OUTPUT
          
          # Registry settings (global vs environment)
          SECRET_NAME=$(yq ".deployment.environments.$ENV.image_pull_secret // .deployment.image_pull_secret // \"nexus-credentials\"" $CONFIG_FILE)
          echo "image_pull_secret=$SECRET_NAME" >> $GITHUB_OUTPUT
          
          # AWS settings
          REGION=$(yq ".deployment.environments.$ENV.region // .aws.default_region // \"us-east-1\"" $CONFIG_FILE)
          # Environment-scoped roles are the norm for env isolation: each is
          # usually trusted for one namespace only, so falling back to a global
          # role would authenticate and then be denied by RBAC in that namespace.
          ROLE=$(yq ".deployment.environments.$ENV.aws.role_to_assume // .deployment.environments.$ENV.role_to_assume // .aws.role_to_assume // \"\"" $CONFIG_FILE)
          echo "aws_region=$REGION" >> $GITHUB_OUTPUT
          echo "role_to_assume=$ROLE" >> $GITHUB_OUTPUT
          
          # Target-specific extraction
          case "$TARGET" in
            eks)
              CLUSTER=$(yq ".deployment.environments.$ENV.cluster_name // \"\"" $CONFIG_FILE)
              NAMESPACE=$(yq ".deployment.environments.$ENV.namespace // \"default\"" $CONFIG_FILE)
              CHART=$(yq ".deployment.environments.$ENV.helm.chart_path // .deployment.helm.chart_path // \"\"" $CONFIG_FILE)
              RELEASE=$(yq ".deployment.environments.$ENV.helm.release_name // .deployment.helm.release_name // \"\"" $CONFIG_FILE)
              VALUES=$(yq ".deployment.environments.$ENV.values_file // .deployment.environments.$ENV.helm.values_file // \"\"" $CONFIG_FILE)
              SET_VALUES=$(yq ".deployment.environments.$ENV.helm.set_values // \"\"" $CONFIG_FILE)
              
              # Extract boolean field carefully (avoiding // fallback for 'false')
              ATOMIC=$(yq ".deployment.environments.$ENV.atomic" $CONFIG_FILE)
              if [[ "$ATOMIC" == "null" ]]; then
                ATOMIC=$(yq ".deployment.helm.atomic // \"true\"" $CONFIG_FILE)
              fi
              
              DEPLOY_METHOD=$(yq ".deployment.environments.$ENV.method // .deployment.method // \"helm\"" $CONFIG_FILE)
              DEPLOY_NAME=$(yq ".deployment.environments.$ENV.deployment_name // \"\"" $CONFIG_FILE)
              CONT_NAME=$(yq ".deployment.environments.$ENV.container_name // \"\"" $CONFIG_FILE)
              SVC_NAME=$(yq ".deployment.environments.$ENV.service_name // \"\"" $CONFIG_FILE)
              WORKLOAD_KIND=$(yq ".deployment.environments.$ENV.workload_kind // .deployment.workload_kind // \"deployment\"" $CONFIG_FILE)
              # -I=0 keeps this on one line, which a job output has to be.
              EXTRA_WORKLOADS=$(yq -o=json -I=0 ".deployment.environments.$ENV.additional_workloads // .deployment.additional_workloads // []" $CONFIG_FILE)
              
              echo "cluster_name=$CLUSTER" >> $GITHUB_OUTPUT
              echo "namespace=$NAMESPACE" >> $GITHUB_OUTPUT
              echo "helm_chart_path=$CHART" >> $GITHUB_OUTPUT
              echo "helm_release_name=$RELEASE" >> $GITHUB_OUTPUT
              echo "helm_values_file=$VALUES" >> $GITHUB_OUTPUT
              echo "helm_set_values=$SET_VALUES" >> $GITHUB_OUTPUT
              echo "atomic=$ATOMIC" >> $GITHUB_OUTPUT
              echo "deployment_method=$DEPLOY_METHOD" >> $GITHUB_OUTPUT
              echo "deployment_name=$DEPLOY_NAME" >> $GITHUB_OUTPUT
              echo "container_name=$CONT_NAME" >> $GITHUB_OUTPUT
              echo "workload_kind=$WORKLOAD_KIND" >> $GITHUB_OUTPUT
              echo "additional_workloads=$EXTRA_WORKLOADS" >> $GITHUB_OUTPUT
              echo "service_name=$SVC_NAME" >> $GITHUB_OUTPUT
              ;;
            
            k8s)
              NAMESPACE=$(yq ".deployment.environments.$ENV.namespace // \"default\"" $CONFIG_FILE)
              CHART=$(yq ".deployment.environments.$ENV.helm.chart_path // .deployment.helm.chart_path // \"\"" $CONFIG_FILE)
              RELEASE=$(yq ".deployment.environments.$ENV.helm.release_name // .deployment.helm.release_name // \"\"" $CONFIG_FILE)
              VALUES=$(yq ".deployment.environments.$ENV.values_file // .deployment.environments.$ENV.helm.values_file // \"\"" $CONFIG_FILE)
              SET_VALUES=$(yq ".deployment.environments.$ENV.helm.set_values // \"\"" $CONFIG_FILE)

              # Extract boolean field carefully (avoiding // fallback for 'false')
              ATOMIC=$(yq ".deployment.environments.$ENV.atomic" $CONFIG_FILE)
              if [[ "$ATOMIC" == "null" ]]; then
                ATOMIC=$(yq ".deployment.helm.atomic // \"true\"" $CONFIG_FILE)
              fi

              echo "namespace=$NAMESPACE" >> $GITHUB_OUTPUT
              echo "helm_chart_path=$CHART" >> $GITHUB_OUTPUT
              echo "helm_release_name=$RELEASE" >> $GITHUB_OUTPUT
              echo "helm_values_file=$VALUES" >> $GITHUB_OUTPUT
              echo "helm_set_values=$SET_VALUES" >> $GITHUB_OUTPUT
              echo "atomic=$ATOMIC" >> $GITHUB_OUTPUT
              ;;
            
            ec2)
               # EC2 extraction (Generic)
               DEPLOY_METHOD=$(yq ".deployment.environments.$ENV.deploy_method // \"ssm\"" $CONFIG_FILE)
               TARGET_TYPE=$(yq ".deployment.environments.$ENV.target_type // \"tag\"" $CONFIG_FILE)
               TAG_KEY=$(yq ".deployment.environments.$ENV.target_tag_key // \"Environment\"" $CONFIG_FILE)
               TAG_VALUE=$(yq ".deployment.environments.$ENV.target_tag_value // \"$ENV\"" $CONFIG_FILE)
               INSTANCE_IDS=$(yq ".deployment.environments.$ENV.instance_ids // \"\"" $CONFIG_FILE)
               SSH_USER=$(yq ".deployment.environments.$ENV.ssh_user // .deployment.ec2.ssh_user // \"ec2-user\"" $CONFIG_FILE)
               COMPOSE_PATH=$(yq ".deployment.environments.$ENV.docker_compose_path // .deployment.ec2.docker_compose_path // \"/app/docker-compose.yaml\"" $CONFIG_FILE)
               SERVICE_NAME=$(yq ".deployment.environments.$ENV.service_name // .deployment.ec2.service_name // \"app\"" $CONFIG_FILE)
               
               echo "ec2_deploy_method=$DEPLOY_METHOD" >> $GITHUB_OUTPUT
               echo "target_type=$TARGET_TYPE" >> $GITHUB_OUTPUT
               echo "target_tag_key=$TAG_KEY" >> $GITHUB_OUTPUT
               echo "target_tag_value=$TAG_VALUE" >> $GITHUB_OUTPUT
               echo "instance_ids=$INSTANCE_IDS" >> $GITHUB_OUTPUT
               echo "ssh_user=$SSH_USER" >> $GITHUB_OUTPUT
               echo "docker_compose_path=$COMPOSE_PATH" >> $GITHUB_OUTPUT
               echo "service_name=$SERVICE_NAME" >> $GITHUB_OUTPUT
              ;;
            
            ecs)
              ECS_CLUSTER=$(yq ".deployment.environments.$ENV.cluster_name // \"\"" $CONFIG_FILE)
              SERVICE=$(yq ".deployment.environments.$ENV.service_name // \"\"" $CONFIG_FILE)
              TASK_FAMILY=$(yq ".deployment.environments.$ENV.task_definition_family // \"\"" $CONFIG_FILE)
              CONTAINER=$(yq ".deployment.environments.$ENV.container_name // \"app\"" $CONFIG_FILE)
              
              echo "ecs_cluster_name=$ECS_CLUSTER" >> $GITHUB_OUTPUT
              echo "ecs_service_name=$SERVICE" >> $GITHUB_OUTPUT
              echo "task_definition_family=$TASK_FAMILY" >> $GITHUB_OUTPUT
              echo "container_name=$CONTAINER" >> $GITHUB_OUTPUT
              ;;
          esac
          
          # Health check settings
          HC_ENDPOINT=$(yq ".deployment.environments.$ENV.health_check.endpoint // \"/health\"" $CONFIG_FILE)
          HC_TYPE=$(yq ".deployment.environments.$ENV.health_check.type // \"k8s\"" $CONFIG_FILE)
          HC_URL=$(yq ".deployment.environments.$ENV.health_check.url // \"\"" $CONFIG_FILE)
          HC_RETRIES=$(yq ".deployment.environments.$ENV.health_check.retries // 5" $CONFIG_FILE)
          HC_INTERVAL=$(yq ".deployment.environments.$ENV.health_check.retry_interval // 15" $CONFIG_FILE)
          HC_PORT=$(yq ".deployment.environments.$ENV.health_check.port // .deployment.health_check.port // 8080" $CONFIG_FILE)
          
          # Boolean fields need careful extraction to avoid // fallback for 'false'
          HC_ENABLED=$(yq ".deployment.environments.$ENV.health_check.enabled" $CONFIG_FILE)
          if [[ "$HC_ENABLED" == "null" ]]; then
            HC_ENABLED=$(yq ".deployment.health_check.enabled // \"true\"" $CONFIG_FILE)
          fi
          
          echo "health_check_enabled=$HC_ENABLED" >> $GITHUB_OUTPUT
          echo "health_check_endpoint=$HC_ENDPOINT" >> $GITHUB_OUTPUT
          echo "health_check_type=$HC_TYPE" >> $GITHUB_OUTPUT
          echo "health_check_url=$HC_URL" >> $GITHUB_OUTPUT
          echo "health_check_retries=$HC_RETRIES" >> $GITHUB_OUTPUT
          echo "health_check_retry_interval=$HC_INTERVAL" >> $GITHUB_OUTPUT
          echo "health_check_port=$HC_PORT" >> $GITHUB_OUTPUT
          
          # Timing settings
          TIMEOUT=$(yq ".deployment.environments.$ENV.timeout // .deployment.helm.timeout // \"10m\"" $CONFIG_FILE)
          echo "deployment_timeout=$TIMEOUT" >> $GITHUB_OUTPUT

          # Rollback settings
          # Same `//` pitfall as notifications: an explicit false would be
          # read as absent, making auto_rollback impossible to turn off.
          AUTO_ROLLBACK=$(yq ".deployment.environments.$ENV.auto_rollback" $CONFIG_FILE)
          if [[ "$AUTO_ROLLBACK" == "null" ]]; then
            AUTO_ROLLBACK=$(yq ".deployment.auto_rollback" $CONFIG_FILE)
          fi
          if [[ "$AUTO_ROLLBACK" == "null" ]]; then
            AUTO_ROLLBACK=true
          fi
          echo "auto_rollback=$AUTO_ROLLBACK" >> $GITHUB_OUTPUT
          
          # Notification settings
          # yq's // operator treats an explicit `false` as absent, so chaining
          # it silently turns `notifications.enabled: false` back into true.
          # Resolve the precedence with explicit null checks instead, the same
          # way `atomic` above does.
          NOTIFY_ENABLED=$(yq ".deployment.environments.$ENV.notifications.enabled" $CONFIG_FILE)
          if [[ "$NOTIFY_ENABLED" == "null" ]]; then
            NOTIFY_ENABLED=$(yq ".deployment.notifications.enabled" $CONFIG_FILE)
          fi
          if [[ "$NOTIFY_ENABLED" == "null" ]]; then
            NOTIFY_ENABLED=true
          fi
          echo "notifications_enabled=$NOTIFY_ENABLED" >> $GITHUB_OUTPUT
          
          echo "Configuration extracted successfully"

  # ---------------------------------------------------------------------------
  # 2. NOTIFY: DEPLOYMENT STARTING
  # ---------------------------------------------------------------------------
  notify-start:
    needs: validate-and-load
    if: needs.validate-and-load.outputs.notifications_enabled == 'true'
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/notify-google-chat.yaml@v1
    secrets:
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
    with:
      status: starting
      environment: ${{ inputs.environment }}
      image_uri: ${{ inputs.image_uri }}

  # ---------------------------------------------------------------------------
  # 3. DEPLOYMENT (Routed to Target-Specific Module)
  # ---------------------------------------------------------------------------
  
  # EKS DEPLOYMENT (via reusable module)
  deploy-eks:
    needs: [validate-and-load, notify-start]
    if: |
      always() &&
      needs.validate-and-load.result == 'success' &&
      needs.validate-and-load.outputs.deployment_target == 'eks' &&
      needs.validate-and-load.outputs.deployment_method == 'helm'
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/deploy-eks.yaml@v1
    with:
      environment: ${{ inputs.environment }}
      image_uri: ${{ inputs.image_uri }}
      cluster_name: ${{ needs.validate-and-load.outputs.cluster_name }}
      namespace: ${{ needs.validate-and-load.outputs.namespace }}
      helm_chart_path: ${{ needs.validate-and-load.outputs.helm_chart_path }}
      helm_release_name: ${{ needs.validate-and-load.outputs.helm_release_name }}
      helm_values_file: ${{ needs.validate-and-load.outputs.helm_values_file }}
      helm_set_values: ${{ needs.validate-and-load.outputs.helm_set_values }}
      aws_region: ${{ needs.validate-and-load.outputs.aws_region }}
      role_to_assume: ${{ needs.validate-and-load.outputs.role_to_assume }}
      timeout: ${{ needs.validate-and-load.outputs.deployment_timeout }}
      dry_run: ${{ inputs.dry_run }}
      atomic: ${{ needs.validate-and-load.outputs.atomic == 'true' }}
      image_pull_secret: ${{ needs.validate-and-load.outputs.image_pull_secret }}
      ingress_domain: ${{ needs.validate-and-load.outputs.ingress_domain }}

  # EKS PATCH DEPLOYMENT (via reusable module)
  deploy-eks-patch:
    needs: [validate-and-load, notify-start]
    if: |
      always() &&
      needs.validate-and-load.result == 'success' &&
      needs.validate-and-load.outputs.deployment_target == 'eks' &&
      needs.validate-and-load.outputs.deployment_method == 'patch'
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/deploy-eks-patch.yaml@v1
    with:
      environment: ${{ inputs.environment }}
      image_uri: ${{ inputs.image_uri }}
      cluster_name: ${{ needs.validate-and-load.outputs.cluster_name }}
      namespace: ${{ needs.validate-and-load.outputs.namespace }}
      deployment_name: ${{ needs.validate-and-load.outputs.deployment_name }}
      container_name: ${{ needs.validate-and-load.outputs.container_name }}
      workload_kind: ${{ needs.validate-and-load.outputs.workload_kind }}
      additional_workloads: ${{ needs.validate-and-load.outputs.additional_workloads }}
      aws_region: ${{ needs.validate-and-load.outputs.aws_region }}
      role_to_assume: ${{ needs.validate-and-load.outputs.role_to_assume }}
      dry_run: ${{ inputs.dry_run }}
      service_name: ${{ needs.validate-and-load.outputs.service_name }}

  # EC2 DEPLOYMENT (via reusable module - SSM or SSH)
  deploy-ec2:
    needs: [validate-and-load, notify-start]
    if: |
      always() &&
      needs.validate-and-load.result == 'success' &&
      needs.validate-and-load.outputs.deployment_target == 'ec2'
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/deploy-ec2.yaml@v1
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      REGISTRY_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    with:
      environment: ${{ inputs.environment }}
      image_uri: ${{ inputs.image_uri }}
      deploy_method: ${{ needs.validate-and-load.outputs.ec2_deploy_method }}
      target_type: ${{ needs.validate-and-load.outputs.target_type }}
      target_tag_key: ${{ needs.validate-and-load.outputs.target_tag_key }}
      target_tag_value: ${{ needs.validate-and-load.outputs.target_tag_value }}
      instance_ids: ${{ needs.validate-and-load.outputs.instance_ids }}
      ssh_user: ${{ needs.validate-and-load.outputs.ssh_user }}
      docker_compose_path: ${{ needs.validate-and-load.outputs.docker_compose_path }}
      service_name: ${{ needs.validate-and-load.outputs.service_name }}
      app_port: ${{ needs.validate-and-load.outputs.health_check_port }}
      aws_region: ${{ needs.validate-and-load.outputs.aws_region }}
      role_to_assume: ${{ needs.validate-and-load.outputs.role_to_assume }}
      ingress_domain: ${{ needs.validate-and-load.outputs.ingress_domain }}

  # ECS DEPLOYMENT (via reusable module)
  deploy-ecs:
    needs: [validate-and-load, notify-start]
    if: |
      always() &&
      needs.validate-and-load.result == 'success' &&
      needs.validate-and-load.outputs.deployment_target == 'ecs'
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/deploy-ecs.yaml@v1
    with:
      environment: ${{ inputs.environment }}
      image_uri: ${{ inputs.image_uri }}
      cluster_name: ${{ needs.validate-and-load.outputs.ecs_cluster_name }}
      service_name: ${{ needs.validate-and-load.outputs.ecs_service_name }}
      task_definition_family: ${{ needs.validate-and-load.outputs.task_definition_family }}
      container_name: ${{ needs.validate-and-load.outputs.container_name }}
      aws_region: ${{ needs.validate-and-load.outputs.aws_region }}
      role_to_assume: ${{ needs.validate-and-load.outputs.role_to_assume }}
      force_new_deployment: true
      wait_for_stability: true

  # GENERIC K8S DEPLOYMENT (via reusable module)
  deploy-k8s:
    needs: [validate-and-load, notify-start]
    if: |
      always() &&
      needs.validate-and-load.result == 'success' &&
      needs.validate-and-load.outputs.deployment_target == 'k8s'
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/deploy-k8s.yaml@v1
    secrets:
      KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
    with:
      environment: ${{ inputs.environment }}
      image_uri: ${{ inputs.image_uri }}
      helm_chart_path: ${{ needs.validate-and-load.outputs.helm_chart_path }}
      helm_release_name: ${{ needs.validate-and-load.outputs.helm_release_name }}
      helm_values_file: ${{ needs.validate-and-load.outputs.helm_values_file }}
      namespace: ${{ needs.validate-and-load.outputs.namespace }}
      helm_set_values: ${{ needs.validate-and-load.outputs.helm_set_values }}
      timeout: ${{ needs.validate-and-load.outputs.deployment_timeout }}
      atomic: ${{ needs.validate-and-load.outputs.atomic == 'true' }}
      ingress_domain: ${{ needs.validate-and-load.outputs.ingress_domain }}
      dry_run: ${{ inputs.dry_run }}

  # ---------------------------------------------------------------------------
  # 4. HEALTH CHECK
  # ---------------------------------------------------------------------------
  health-check:
    needs: [validate-and-load, deploy-eks, deploy-eks-patch, deploy-ec2, deploy-ecs, deploy-k8s]
    if: |
      always() &&
      (needs.deploy-eks.result == 'success' || needs.deploy-eks-patch.result == 'success' || needs.deploy-ec2.result == 'success' || needs.deploy-ecs.result == 'success' || needs.deploy-k8s.result == 'success') &&
      needs.validate-and-load.outputs.health_check_enabled == 'true' &&
      inputs.skip_health_check != true &&
      inputs.dry_run != true
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/health-check.yaml@v1
    with:
      workload_kind: ${{ needs.validate-and-load.outputs.workload_kind }}
      additional_workloads: ${{ needs.validate-and-load.outputs.additional_workloads }}
      environment: ${{ inputs.environment }}
      health_endpoint: ${{ needs.validate-and-load.outputs.health_check_endpoint }}
      health_url: >-
        ${{ needs.validate-and-load.outputs.health_check_url != '' 
          && needs.validate-and-load.outputs.health_check_url 
          || (needs.deploy-eks.outputs.url || needs.deploy-eks-patch.outputs.url || needs.deploy-ec2.outputs.url || needs.deploy-ecs.outputs.url || needs.deploy-k8s.outputs.url || '') 
        }}
      check_type: ${{ needs.validate-and-load.outputs.health_check_type }}
      namespace: ${{ needs.validate-and-load.outputs.namespace }}
      cluster_name: ${{ needs.validate-and-load.outputs.cluster_name }}
      aws_region: ${{ needs.validate-and-load.outputs.aws_region }}
      role_to_assume: ${{ needs.validate-and-load.outputs.role_to_assume }}
      # A patch deploy has a workload name and often no Helm release at all,
      # so the release name is the wrong target for it -- and an empty one
      # used to make the check silently pick a workload from the namespace.
      deployment_name: >-
        ${{ needs.validate-and-load.outputs.deployment_name
          || needs.validate-and-load.outputs.helm_release_name }}
      retries: ${{ needs.validate-and-load.outputs.health_check_retries }}
      retry_interval: ${{ needs.validate-and-load.outputs.health_check_retry_interval }}
      ingress_domain: ${{ needs.validate-and-load.outputs.ingress_domain }}
    secrets:
      KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}

  # ---------------------------------------------------------------------------
  # 5. ROLLBACK (On Health Check Failure)
  # ---------------------------------------------------------------------------
  rollback:
    needs: [validate-and-load, deploy-eks, deploy-eks-patch, deploy-ec2, deploy-ecs, deploy-k8s, health-check]
    # A failed deploy needs reverting just as much as a failed health check --
    # keying only on the health check meant a failed image patch or a timed-out
    # rollout was left in place. Note a skipped health check is not a failure,
    # so this does not fire when health checks are simply turned off.
    if: |
      always() &&
      inputs.dry_run != true &&
      needs.validate-and-load.outputs.auto_rollback == 'true' &&
      (needs.health-check.result == 'failure' ||
       needs.deploy-eks.result == 'failure' ||
       needs.deploy-eks-patch.result == 'failure' ||
       needs.deploy-ec2.result == 'failure' ||
       needs.deploy-ecs.result == 'failure' ||
       needs.deploy-k8s.result == 'failure')
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/rollback.yaml@v1
    with:
      environment: ${{ inputs.environment }}
      deployment_target: ${{ needs.validate-and-load.outputs.deployment_target }}
      cluster_name: ${{ needs.validate-and-load.outputs.cluster_name || needs.validate-and-load.outputs.ecs_cluster_name }}
      namespace: ${{ needs.validate-and-load.outputs.namespace }}
      helm_release_name: ${{ needs.validate-and-load.outputs.helm_release_name }}
      deployment_method: ${{ needs.validate-and-load.outputs.deployment_method }}
      workload_kind: ${{ needs.validate-and-load.outputs.workload_kind }}
      deployment_name: ${{ needs.validate-and-load.outputs.deployment_name }}
      additional_workloads: ${{ needs.validate-and-load.outputs.additional_workloads }}
      service_name: ${{ needs.validate-and-load.outputs.ecs_service_name }}
      task_definition_family: ${{ needs.validate-and-load.outputs.task_definition_family }}
      aws_region: ${{ needs.validate-and-load.outputs.aws_region }}
      role_to_assume: ${{ needs.validate-and-load.outputs.role_to_assume }}

  # ---------------------------------------------------------------------------
  # 5.5 EXECUTE EC2 ROLLBACK (Re-deploy old image)
  # ---------------------------------------------------------------------------
  rollback-ec2-execution:
    needs: [validate-and-load, rollback]
    if: |
      always() &&
      needs.rollback.result == 'success' &&
      needs.rollback.outputs.status == 'success' &&
      needs.validate-and-load.outputs.deployment_target == 'ec2' &&
      needs.rollback.outputs.rollback_image_uri != ''
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/deploy-ec2.yaml@v1
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    with:
      environment: ${{ inputs.environment }}
      image_uri: ${{ needs.rollback.outputs.rollback_image_uri }}
      deploy_method: ${{ needs.validate-and-load.outputs.ec2_deploy_method }}
      target_type: ${{ needs.validate-and-load.outputs.target_type }}
      target_tag_key: ${{ needs.validate-and-load.outputs.target_tag_key }}
      target_tag_value: ${{ needs.validate-and-load.outputs.target_tag_value }}
      instance_ids: ${{ needs.validate-and-load.outputs.instance_ids }}
      ssh_user: ${{ needs.validate-and-load.outputs.ssh_user }}
      docker_compose_path: ${{ needs.validate-and-load.outputs.docker_compose_path }}
      service_name: ${{ needs.validate-and-load.outputs.service_name }}
      app_port: ${{ needs.validate-and-load.outputs.health_check_port }}
      aws_region: ${{ needs.validate-and-load.outputs.aws_region }}
      role_to_assume: ${{ needs.validate-and-load.outputs.role_to_assume }}

  # ---------------------------------------------------------------------------
  # 6. NOTIFY: FINAL RESULT
  # ---------------------------------------------------------------------------
  notify-result:
    needs: [validate-and-load, deploy-eks, deploy-eks-patch, deploy-ec2, deploy-ecs, deploy-k8s, health-check, rollback, rollback-ec2-execution]
    if: always() && needs.validate-and-load.outputs.notifications_enabled == 'true'
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/notify-google-chat.yaml@v1
    secrets:
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
    with:
      status: ${{ (needs.health-check.result == 'success' || (needs.health-check.result == 'skipped' && (needs.deploy-eks.result == 'success' || needs.deploy-eks-patch.result == 'success' || needs.deploy-ec2.result == 'success' || needs.deploy-ecs.result == 'success' || needs.deploy-k8s.result == 'success'))) && 'success' || (needs.rollback.result == 'success' && 'rollback' || 'failure') }}
      environment: ${{ inputs.environment }}
      image_uri: ${{ inputs.image_uri }}

  # ---------------------------------------------------------------------------
  # 7. PIPELINE SUMMARY
  # ---------------------------------------------------------------------------
  summary:
    if: always()
    needs: [validate-and-load, deploy-eks, deploy-eks-patch, deploy-ec2, deploy-ecs, deploy-k8s, health-check, rollback, rollback-ec2-execution, notify-result]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    
    outputs:
      status: ${{ steps.status.outputs.final_status }}

    steps:
      - name: Generate Pipeline Summary
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          NEED_VALIDATE_AND_LOAD_DEPLOYMENT_TARGET: ${{ needs.validate-and-load.outputs.deployment_target }}
          IMAGE_URI: ${{ inputs.image_uri }}
          DRY_RUN: ${{ inputs.dry_run }}
          EXPR: ${{ needs.deploy-eks.outputs.url || needs.deploy-eks-patch.outputs.url || 'N/A' }}
          EXPR_2: ${{ needs.deploy-eks.outputs.url || needs.deploy-eks-patch.outputs.url || '' }}
          NEED_VALIDATE_AND_LOAD_RESULT: ${{ needs.validate-and-load.result }}
          NEED_DEPLOY_EKS_RESULT: ${{ needs.deploy-eks.result }}
          NEED_DEPLOY_EC2_RESULT: ${{ needs.deploy-ec2.result }}
          NEED_DEPLOY_ECS_RESULT: ${{ needs.deploy-ecs.result }}
          NEED_DEPLOY_K8S_RESULT: ${{ needs.deploy-k8s.result }}
          NEED_HEALTH_CHECK_RESULT: ${{ needs.health-check.result }}
          NEED_ROLLBACK_RESULT: ${{ needs.rollback.result }}
          NEED_NOTIFY_RESULT_RESULT: ${{ needs.notify-result.result }}
        run: |
          echo "## CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | ${ENVIRONMENT} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target** | ${NEED_VALIDATE_AND_LOAD_DEPLOYMENT_TARGET} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${IMAGE_URI}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dry Run** | ${DRY_RUN} |" >> $GITHUB_STEP_SUMMARY
          echo "| **App URL** | [${EXPR}](${EXPR_2}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Stage Results" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Config Validation | ${NEED_VALIDATE_AND_LOAD_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| EKS Deployment | ${NEED_DEPLOY_EKS_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| EC2 Deployment | ${NEED_DEPLOY_EC2_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| ECS Deployment | ${NEED_DEPLOY_ECS_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| K8s Deployment | ${NEED_DEPLOY_K8S_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check | ${NEED_HEALTH_CHECK_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rollback | ${NEED_ROLLBACK_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| Notification | ${NEED_NOTIFY_RESULT_RESULT} |" >> $GITHUB_STEP_SUMMARY

      - name: Determine Final Status
        id: status
        env:
          NEED_HEALTH_CHECK_RESULT: ${{ needs.health-check.result }}
          NEED_DEPLOY_EKS_RESULT: ${{ needs.deploy-eks.result }}
          NEED_DEPLOY_EKS_PATCH_RESULT: ${{ needs.deploy-eks-patch.result }}
          NEED_DEPLOY_EC2_RESULT: ${{ needs.deploy-ec2.result }}
          NEED_DEPLOY_ECS_RESULT: ${{ needs.deploy-ecs.result }}
          NEED_ROLLBACK_RESULT: ${{ needs.rollback.result }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "${NEED_HEALTH_CHECK_RESULT}" == "success" ]] || [[ "${NEED_HEALTH_CHECK_RESULT}" == "skipped" && ("${NEED_DEPLOY_EKS_RESULT}" == "success" || "${NEED_DEPLOY_EKS_PATCH_RESULT}" == "success" || "${NEED_DEPLOY_EC2_RESULT}" == "success" || "${NEED_DEPLOY_ECS_RESULT}" == "success") ]]; then
            echo "final_status=success" >> $GITHUB_OUTPUT
            echo "### Deployment Status: **SUCCESS**" >> $GITHUB_STEP_SUMMARY
          elif [[ "${NEED_ROLLBACK_RESULT}" == "success" ]]; then
            echo "final_status=rolled_back" >> $GITHUB_OUTPUT
            echo "### Deployment Status: **ROLLED BACK**" >> $GITHUB_STEP_SUMMARY
          elif [[ "${NEED_DEPLOY_EKS_RESULT}" == "failure" ]] || 
               [[ "${NEED_DEPLOY_EC2_RESULT}" == "failure" ]] || 
               [[ "${NEED_DEPLOY_ECS_RESULT}" == "failure" ]]; then
            echo "final_status=failed" >> $GITHUB_OUTPUT
            echo "### Deployment Status: **FAILED**" >> $GITHUB_STEP_SUMMARY
            exit 1
          elif [[ "${DRY_RUN}" == "true" ]]; then
            echo "final_status=dry_run" >> $GITHUB_OUTPUT
            echo "### Deployment Status: **DRY RUN COMPLETE**" >> $GITHUB_STEP_SUMMARY
          else
            echo "final_status=unknown" >> $GITHUB_OUTPUT
            echo "### Deployment Status: **UNKNOWN**" >> $GITHUB_STEP_SUMMARY
          fi
