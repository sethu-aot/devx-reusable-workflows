name: "Module: Deploy to EKS (Raw Patch)"

# ------------------------------------------------------------------------------
# Kubernetes deployment via raw image patching (kubectl set image).
# PURPOSE:
# - Support legacy components not yet on Helm.
# - Fast, direct updates of existing deployments.
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      # --- REQUIRED ---
      environment:
        description: "Target environment"
        type: string
        required: true
      image_uri:
        description: "Docker image URI to deploy"
        type: string
        required: true
      cluster_name:
        description: "EKS cluster name"
        type: string
        required: true
      
      # --- TARGET RESOURCES ---
      deployment_name:
        description: "Name of the Kubernetes deployment"
        type: string
        required: true
      container_name:
        description: "Name of the container within the deployment"
        type: string
        required: true
      workload_kind:
        description: "Workload kind to patch: 'deployment', 'statefulset' or 'daemonset'"
        type: string
        default: "deployment"
      additional_workloads:
        description: |
          Extra workloads that run this same image, as a compact JSON array of
          {"name": ..., "container": ..., "kind": ...} objects, where "kind" is
          optional and defaults to workload_kind. One image commonly drives
          several workloads -- a web deployment plus its queue workers and
          scheduler -- and they must all move together, or the environment is
          left running two different versions of the same code.
        type: string
        default: "[]"
      
      # --- NAMESPACE ---
      namespace:
        description: "Kubernetes namespace"
        type: string
        default: "default"
      
      # --- AWS ---
      aws_region:
        description: "AWS region"
        type: string
        default: "ca-central-1"
      role_to_assume:
        description: "AWS IAM role for OIDC"
        type: string
        required: true
      
      # --- OPTIONS ---
      dry_run:
        description: "Dry run mode"
        type: boolean
        default: false
      timeout:
        description: "Rollout timeout (e.g., 5m)"
        type: string
        default: "5m"
      service_name:
        description: "Name of the Kubernetes service (for URL discovery)"
        type: string
        default: ""

    outputs:
      status:
        description: "Deployment status"
        value: ${{ jobs.deploy.outputs.status }}
      url:
        description: "Deployment URL"
        value: ${{ jobs.deploy.outputs.url }}
      previous_images:
        description: |
          The image each workload ran immediately before this deploy, as a JSON
          object keyed by "kind/name". Rollback restores exactly these rather
          than stepping back a revision, which is not the same thing: a deploy
          that changed nothing still has a previous revision to undo into.
        value: ${{ jobs.deploy.outputs.previous_images }}

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    outputs:
      status: ${{ steps.result.outputs.status }}
      url: ${{ steps.deploy_url.outputs.url }}
      previous_images: ${{ steps.patch.outputs.previous_images }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup kubectl
        env:
          NAMESPACE: ${{ inputs.namespace }}
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          aws eks update-kubeconfig \
            --name "${CLUSTER_NAME}" \
            --region "${AWS_REGION}"
          
          # 'kubectl cluster-info' lists services in kube-system, which a deploy
          # role scoped to a single namespace -- the recommended setup -- cannot
          # read, so it fails with Forbidden on a perfectly good connection.
          # Discovery and SelfSubjectAccessReview are available to any
          # authenticated principal, so check reachability and access that way.
          kubectl version --request-timeout=20s >/dev/null || {
            echo "::error::Cannot reach the Kubernetes API"
            exit 1
          }
          if [[ -n "${NAMESPACE:-}" ]]; then
            kubectl auth can-i get deployments -n "${NAMESPACE}" >/dev/null || {
              echo "::error::Reached the cluster but have no access in namespace '${NAMESPACE}'"
              echo "::error::Check the EKS access entry / RBAC binding for this role."
              exit 1
            }
          fi

      - name: Patch Workload Images
        id: patch
        env:
          NAMESPACE: ${{ inputs.namespace }}
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
          CONTAINER_NAME: ${{ inputs.container_name }}
          WORKLOAD_KIND: ${{ inputs.workload_kind }}
          ADDITIONAL_WORKLOADS: ${{ inputs.additional_workloads }}
          IMAGE_URI: ${{ inputs.image_uri }}
          DRY_RUN: ${{ inputs.dry_run }}
          TIMEOUT: ${{ inputs.timeout }}
        run: |
          set -euo pipefail

          # Only kinds that kubectl can both 'set image' and 'rollout status'.
          case "${WORKLOAD_KIND}" in
            deployment|statefulset|daemonset) ;;
            *)
              echo "::error::workload_kind must be deployment, statefulset or daemonset (got '${WORKLOAD_KIND}')."
              exit 1
              ;;
          esac

          EXTRA="${ADDITIONAL_WORKLOADS:-[]}"
          if ! printf '%s' "$EXTRA" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "::error::additional_workloads must be a JSON array; got: ${EXTRA}"
            exit 1
          fi

          # kind|name|container, primary workload first.
          SPECS=("${WORKLOAD_KIND}|${DEPLOYMENT_NAME}|${CONTAINER_NAME}")
          while IFS= read -r spec; do
            [[ -n "$spec" ]] && SPECS+=("$spec")
          done < <(printf '%s' "$EXTRA" | jq -r --arg k "${WORKLOAD_KIND}" '
            .[] | "\(.kind // $k)|\(.name // "")|\(.container // "")"')

          # Record what is running BEFORE anything changes, so a rollback can
          # restore this exact state. Written to the step output up front so it
          # survives a later failure in this same step -- which is precisely
          # when rollback needs it.
          PREV='{}'
          for spec in "${SPECS[@]}"; do
            IFS='|' read -r K N C <<< "$spec"
            if [[ -z "$N" || -z "$C" ]]; then
              continue
            fi
            CUR=$(kubectl get "${K}" "${N}" -n "${NAMESPACE}" -o jsonpath="{.spec.template.spec.containers[?(@.name==\"${C}\")].image}" 2>/dev/null || true)
            if [[ -n "$CUR" ]]; then
              PREV=$(printf '%s' "$PREV" | jq -c --arg k "${K}/${N}" --arg c "${C}" --arg i "$CUR" '.[$k] = {container: $c, image: $i}')
            fi
          done
          echo "previous_images=${PREV}" >> "$GITHUB_OUTPUT"
          echo "Captured pre-deploy images: ${PREV}"

          DRY_RUN_FLAG=()
          if [[ "${DRY_RUN}" == "true" ]]; then
            DRY_RUN_FLAG=(--dry-run=server)
          fi

          for spec in "${SPECS[@]}"; do
            IFS='|' read -r KIND NAME CONTAINER <<< "$spec"

            case "$KIND" in
              deployment|statefulset|daemonset) ;;
              *)
                echo "::error::Unsupported kind '${KIND}' for workload '${NAME}'."
                exit 1
                ;;
            esac
            if [[ -z "$NAME" || -z "$CONTAINER" ]]; then
              echo "::error::Each workload needs both a name and a container (got '${spec}')."
              exit 1
            fi

            echo "::group::${KIND}/${NAME} -> ${IMAGE_URI}"
            # No pipe here: piping into tee would report tee's exit status and
            # a failed patch would be read as a success.
            kubectl set image "${KIND}/${NAME}" "${CONTAINER}=${IMAGE_URI}" \
              -n "${NAMESPACE}" "${DRY_RUN_FLAG[@]}"
            echo "::endgroup::"
          done

          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "Dry run completed; no rollout was started."
            exit 0
          fi

          # Roll out only after every image is set, so a bad spec in the list
          # fails before any workload starts restarting.
          for spec in "${SPECS[@]}"; do
            IFS='|' read -r KIND NAME _ <<< "$spec"
            echo "Waiting for ${KIND}/${NAME} to roll out..."
            kubectl rollout status "${KIND}/${NAME}" -n "${NAMESPACE}" --timeout="${TIMEOUT}"
          done

      - name: Set Result
        id: result
        if: always()
        env:
          STEP_PATCH_OUTCOME: ${{ steps.patch.outcome }}
        run: |
          if [[ "${STEP_PATCH_OUTCOME}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Generate Deployment URL
        id: deploy_url
        if: always() && steps.patch.outcome == 'success'
        env:
          NAMESPACE: ${{ inputs.namespace }}
          SERVICE_NAME: ${{ inputs.service_name }}
        run: |
          # Try to get host from ingress rules first
          INGRESS_HOST=$(kubectl get ingress -n "${NAMESPACE}" \
            -o jsonpath='{.items[0].spec.rules[0].host}' 2>/dev/null || echo "")
          
          # If no host, try to get ALB DNS name from status
          if [[ -z "$INGRESS_HOST" ]]; then
             INGRESS_ALB=$(kubectl get ingress -n "${NAMESPACE}" \
              -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
             
             if [[ -n "$INGRESS_ALB" ]]; then
               echo "url=http://$INGRESS_ALB" >> $GITHUB_OUTPUT
               exit 0
             fi
          fi

          if [[ -n "$INGRESS_HOST" ]]; then
            echo "url=https://$INGRESS_HOST" >> $GITHUB_OUTPUT
            exit 0
          fi

          # If no ingress host, try to get hostname from Service
          # Priority: 1. Specific service_name (if provided), 2. Any LoadBalancer in namespace
          SVC_FILTER=""
          if [[ -n "${SERVICE_NAME}" ]]; then
            SVC_FILTER="${SERVICE_NAME}"
          fi

          if [[ -n "$SVC_FILTER" ]]; then
            SVC_URL=$(kubectl get svc "$SVC_FILTER" -n "${NAMESPACE}" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
          else
            SVC_URL=$(kubectl get svc -n "${NAMESPACE}" \
              -o jsonpath='{.items[?(@.spec.type=="LoadBalancer")].status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
          fi
          
          if [[ -n "$SVC_URL" ]]; then
            echo "url=http://$SVC_URL" >> $GITHUB_OUTPUT
          else
            echo "url=N/A" >> $GITHUB_OUTPUT
          fi
