name: "Orchestrator: CI Pipeline"

# ------------------------------------------------------------------------------
# THE BRAIN
# 1. Reads 'devx-ci.yaml'
# 2. Parallelizes Pre-Build Security Gates (SAST: Semgrep or SonarQube, IaC)
# 3. Routes to Language-Specific Builds (Node/Python/Maven) → Uploads to Nexus
# 4. Downloads artifacts from Nexus (if needed)
# 5. Builds Docker images
# 6. Sequential Post-Build Security: Trivy → SBOM → SBOM-Scan
#    Trivy runs on both paths: a pushed image is pulled from the registry, and
#    a build-only image is loaded from the tarball docker-build exports.
#    SBOM/SBOM-scan remain push-only -- they describe a published artifact.
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      config_path:
        description: "Path to DevX CI config file"
        type: string
        default: "devx-ci.yaml"
      auto_merge:
        description: "Automatically merge PR if all checks pass"
        type: boolean
        default: false
      push:
        description: "Push images and artifacts to registries?"
        type: boolean
        default: true
      image_tag:
        description: |
          Explicit image tag, overriding both docker.image_tag in the config and
          the branch-based smart versioning. Use this when the tag is decided at
          run time -- e.g. a caller triggered by a release tag passing
          github.ref_name so the image carries the release version.
        type: string
        default: ""
      registry_username:
        description: |
          Registry username, passed as an input rather than a secret. A secret is
          masked, and GitHub drops job outputs containing a masked value, which
          empties image_uri for the scanners, the summary and the CD hand-off
          whenever the username also appears in the image name.
        type: string
        default: ""
    secrets:
      # Pass through for Docker Hub / Generic Registries
      registry_username:
        required: false
      registry_password:
        required: false
      sonar_token:
        required: false
      # Sonatype Nexus
      NEXUS_USERNAME:
        required: false
      NEXUS_PASSWORD:
        required: false
    
    outputs:
      image_uri:
        description: "Full URI of the built Docker image (with tag)"
        value: ${{ jobs.docker.outputs.image_uri }}
      image_digest:
        description: "SHA256 digest of the built Docker image (immutable reference)"
        value: ${{ jobs.docker.outputs.image_digest }}

# Prevent multiple runs on same ref (with smart cancellation)
concurrency:
  # config_path keeps each component in its own group. github.workflow is the
  # CALLER's workflow name, so a monorepo release that invokes this orchestrator
  # once per component would otherwise put every call in one group and have them
  # cancel each other -- leaving a single component built.
  group: ci-${{ github.workflow }}-${{ inputs.config_path }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
  # ^ Only cancel in-progress runs on PR/feature branches, not on main/master

permissions:
  contents: read
  security-events: write  # SARIF uploads
  actions: read           # artifact + SARIF metadata
  id-token: write         # AWS OIDC
  packages: write         # GHCR push
  pull-requests: write    # SonarQube PR decoration

jobs:
  # ---------------------------------------------------------------------------
  # 1. LOAD CONFIGURATION
  # ---------------------------------------------------------------------------
  load-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      config: ${{ steps.parse.outputs.config }}
      language: ${{ steps.extract.outputs.language }}
      sast_tool: ${{ steps.extract.outputs.sast_tool }}
      artifact_name: ${{ steps.extract.outputs.artifact_name }}

    
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Validate config file exists and is valid YAML
      - name: Validate Config File
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          if [[ ! -f "${CONFIG_PATH}" ]]; then
            echo "::error::Config file not found: ${CONFIG_PATH}"
            echo "::error::Please create a devx-ci.yaml configuration file"
            exit 1
          fi
          
          # Validate YAML syntax
          yq '.' "${CONFIG_PATH}" > /dev/null || {
            echo "::error::Invalid YAML syntax in ${CONFIG_PATH}"
            exit 1
          }
          
          # Validate required fields
          LANGUAGE=$(yq '.project.language' "${CONFIG_PATH}")
          if [[ "$LANGUAGE" == "null" || -z "$LANGUAGE" ]]; then
            echo "::error::Missing required field: project.language"
            echo "::error::Please specify project.language in your config (node, python, or maven)"
            exit 1
          fi
          
          # Validate language value
          if [[ ! "$LANGUAGE" =~ ^(node|python|maven)$ ]]; then
            echo "::error::Invalid language: $LANGUAGE"
            echo "::error::Supported languages: node, python, maven"
            exit 1
          fi
          
          echo "✅ Config validation passed"

      # Parse config and set as output
      - name: Parse CI Config
        id: parse
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          echo "config<<EOF" >> $GITHUB_OUTPUT
          yq -o=json "${CONFIG_PATH}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Extract language for routing
      - name: Extract Routing Info
        id: extract
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          LANGUAGE=$(yq '.project.language' "${CONFIG_PATH}")
          echo "language=$LANGUAGE" >> $GITHUB_OUTPUT
          echo "📋 Detected language: $LANGUAGE"
          
          # Detect SAST tool (default: semgrep)
          SAST_TOOL=$(yq '.security.sast.tool // "semgrep"' "${CONFIG_PATH}")
          echo "sast_tool=$SAST_TOOL" >> $GITHUB_OUTPUT
          echo "🔍 SAST tool: $SAST_TOOL"

          # Determine the expected artifact name.
          #
          # The build modules only upload a GitHub artifact when
          # build.artifact_path is set -- there is nothing to hand off otherwise.
          # Naming one unconditionally makes docker-build try to download an
          # artifact that was never produced, which fails the job. Only name it
          # when the config actually asks for one.
          ARTIFACT_PATH=$(yq '.build.artifact_path // ""' "${CONFIG_PATH}")
          if [[ -z "$ARTIFACT_PATH" || "$ARTIFACT_PATH" == "null" ]]; then
            ARTIFACT_NAME=""
            echo "📦 No build.artifact_path configured; Docker will build from source."
          else
            case "$LANGUAGE" in
              maven)  ARTIFACT_NAME="maven-build-artifacts-${GH_RUN_ID}" ;;
              node)   ARTIFACT_NAME="node-build-artifacts-${GH_RUN_ID}" ;;
              python) ARTIFACT_NAME="python-build-artifacts-${GH_RUN_ID}" ;;
              *)      ARTIFACT_NAME="" ;;
            esac
            echo "📦 Artifact name: $ARTIFACT_NAME"
          fi
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # 2. PRE-BUILD SECURITY GATES (Parallel) - MULTI-SAST SUPPORT
  # ---------------------------------------------------------------------------
  
  # Option A: Semgrep (Default, Free, Fast)
  sast-semgrep:
    needs: load-config
    if: |
      fromJson(needs.load-config.outputs.config).security.sast.enabled == true &&
      needs.load-config.outputs.sast_tool == 'semgrep'
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/sast-semgrep.yaml@v1
    with:
      scan_path: ${{ fromJson(needs.load-config.outputs.config).security.sast.scan_path || '.' }}
      exclude_paths: ${{ fromJson(needs.load-config.outputs.config).security.sast.exclude_paths || '' }}
      severity_threshold: ${{ fromJson(needs.load-config.outputs.config).security.sast.severity || 'ERROR' }}
      fail_on_findings: ${{ fromJson(needs.load-config.outputs.config).security.sast.fail_on_findings != false }}

  # Option B: SonarQube
  sast-sonarqube:
    needs: load-config
    if: |
      fromJson(needs.load-config.outputs.config).security.sast.enabled == true &&
      needs.load-config.outputs.sast_tool == 'sonarqube'
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/sast-sonarqube.yaml@v1
    secrets:
      sonar_token: ${{ secrets.sonar_token }}
    with:
      scan_path: ${{ fromJson(needs.load-config.outputs.config).security.sast.scan_path || '.' }}
      sonar_host_url: ${{ fromJson(needs.load-config.outputs.config).security.sast.sonar_host_url || 'https://sonarcloud.io' }}
      sonar_organization: ${{ fromJson(needs.load-config.outputs.config).security.sast.sonar_organization || '' }}
      sonar_project_key: ${{ fromJson(needs.load-config.outputs.config).security.sast.sonar_project_key }}
      fail_on_quality_gate: ${{ fromJson(needs.load-config.outputs.config).security.sast.fail_on_quality_gate != false }}
      coverage_report_path: ${{ fromJson(needs.load-config.outputs.config).security.sast.coverage_report_path || '' }}

  iac:
    needs: load-config
    if: fromJson(needs.load-config.outputs.config).security.iac.enabled == true
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/iac-scan.yaml@v1
    with:
      working_directory: ${{ fromJson(needs.load-config.outputs.config).security.iac.working_directory || '.' }}
      frameworks: ${{ fromJson(needs.load-config.outputs.config).security.iac.frameworks || '' }}
      soft_fail: ${{ fromJson(needs.load-config.outputs.config).security.iac.soft_fail == true }}

  # ---------------------------------------------------------------------------
  # 3. LANGUAGE BUILDS (Routed) - NOW WITH NEXUS UPLOAD
  # Build jobs now upload directly to Nexus (no separate upload job needed)
  # ---------------------------------------------------------------------------
  build-node:
    needs: [load-config, sast-semgrep, sast-sonarqube, iac]
    if: |
      always() &&
      needs.load-config.result == 'success' &&
      needs.load-config.outputs.language == 'node' &&
      fromJson(needs.load-config.outputs.config).build.enabled != false &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/node-build.yaml@v1
    secrets:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    with:
      working_directory: ${{ fromJson(needs.load-config.outputs.config).project.working_directory || '.' }}
      node_version: ${{ fromJson(needs.load-config.outputs.config).project.version || '20' }}
      install_command: ${{ fromJson(needs.load-config.outputs.config).build.install_command || 'npm ci --prefer-offline --no-audit' }}
      run_tests: ${{ fromJson(needs.load-config.outputs.config).build.run_tests != false }}
      test_script: ${{ fromJson(needs.load-config.outputs.config).build.test_script || 'test' }}
      run_build: ${{ fromJson(needs.load-config.outputs.config).build.build_script != null }}
      build_script: ${{ fromJson(needs.load-config.outputs.config).build.build_script || 'build' }}
      artifact_path: ${{ fromJson(needs.load-config.outputs.config).build.artifact_path || '' }}
      artifact_name: ${{ needs.load-config.outputs.artifact_name }}
      # Nexus configuration
      nexus_url: ${{ fromJson(needs.load-config.outputs.config).nexus.url || '' }}
      nexus_repository: ${{ fromJson(needs.load-config.outputs.config).nexus.repository || 'raw-releases' }}
      nexus_repo_type: ${{ fromJson(needs.load-config.outputs.config).nexus.repo_type || 'raw' }}
      nexus_path: ${{ fromJson(needs.load-config.outputs.config).nexus.upload_path || '' }}
      skip_upload: ${{ inputs.push != true }}

  build-python:
    needs: [load-config, sast-semgrep, sast-sonarqube, iac]
    if: |
      always() &&
      needs.load-config.result == 'success' &&
      needs.load-config.outputs.language == 'python' &&
      fromJson(needs.load-config.outputs.config).build.enabled != false &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/python-build.yaml@v1
    secrets:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    with:
      working_directory: ${{ fromJson(needs.load-config.outputs.config).project.working_directory || '.' }}
      python_version: ${{ fromJson(needs.load-config.outputs.config).project.version || '3.11' }}
      install_command: ${{ fromJson(needs.load-config.outputs.config).build.install_command || '' }}
      run_tests: ${{ fromJson(needs.load-config.outputs.config).build.run_tests != false }}
      test_script: ${{ fromJson(needs.load-config.outputs.config).build.test_script || 'python -m pytest' }}
      build_command: ${{ fromJson(needs.load-config.outputs.config).build.build_script || '' }}
      artifact_path: ${{ fromJson(needs.load-config.outputs.config).build.artifact_path || '' }}
      artifact_name: ${{ needs.load-config.outputs.artifact_name }}
      # Nexus configuration
      nexus_url: ${{ fromJson(needs.load-config.outputs.config).nexus.url || '' }}
      nexus_repository: ${{ fromJson(needs.load-config.outputs.config).nexus.repository || 'raw-releases' }}
      nexus_repo_type: ${{ fromJson(needs.load-config.outputs.config).nexus.repo_type || 'raw' }}
      nexus_path: ${{ fromJson(needs.load-config.outputs.config).nexus.upload_path || '' }}
      skip_upload: ${{ inputs.push != true }}

  build-maven:
    needs: [load-config, sast-semgrep, sast-sonarqube, iac]
    if: |
      always() &&
      needs.load-config.result == 'success' &&
      needs.load-config.outputs.language == 'maven' &&
      fromJson(needs.load-config.outputs.config).build.enabled != false &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/maven-build.yaml@v1
    secrets:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    with:
      working_directory: ${{ fromJson(needs.load-config.outputs.config).project.working_directory || '.' }}
      java_version: ${{ fromJson(needs.load-config.outputs.config).project.version || '17' }}
      run_tests: ${{ fromJson(needs.load-config.outputs.config).build.run_tests != false }}
      test_script: ${{ fromJson(needs.load-config.outputs.config).build.test_script || 'mvn test -B' }}
      maven_args: ${{ fromJson(needs.load-config.outputs.config).build.build_script || '-B clean package -DskipTests' }}
      artifact_path: ${{ fromJson(needs.load-config.outputs.config).build.artifact_path || '' }}
      artifact_name: ${{ needs.load-config.outputs.artifact_name }}
      # Nexus configuration
      nexus_url: ${{ fromJson(needs.load-config.outputs.config).nexus.url || '' }}
      nexus_repository: ${{ fromJson(needs.load-config.outputs.config).nexus.repository || 'maven-releases' }}
      skip_upload: ${{ inputs.push != true }}

  # ---------------------------------------------------------------------------
  # 5. DOCKER BUILD (Conditional)
  # ---------------------------------------------------------------------------
  docker:
    needs: [load-config, build-node, build-python, build-maven]
    if: |
      always() && 
      fromJson(needs.load-config.outputs.config).docker.enabled == true &&
      needs.load-config.result == 'success' &&
      (needs.build-node.result == 'success' || needs.build-node.result == 'skipped') &&
      (needs.build-python.result == 'success' || needs.build-python.result == 'skipped') &&
      (needs.build-maven.result == 'success' || needs.build-maven.result == 'skipped') &&
      !contains(needs.*.result, 'failure') && 
      !contains(needs.*.result, 'cancelled')
    
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/docker-build.yaml@v1
    secrets:
      registry_username: ${{ secrets.registry_username }}
      registry_password: ${{ secrets.registry_password }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    with:
      working_directory: ${{ fromJson(needs.load-config.outputs.config).docker.working_directory || '.' }}
      dockerfile: ${{ fromJson(needs.load-config.outputs.config).docker.dockerfile || 'Dockerfile' }}
      registry_type: ${{ fromJson(needs.load-config.outputs.config).docker.registry_type || 'ecr' }}
      registry_username: ${{ inputs.registry_username }}
      image_name: ${{ fromJson(needs.load-config.outputs.config).docker.image_name }}
      image_tag: ${{ inputs.image_tag || fromJson(needs.load-config.outputs.config).docker.image_tag || '' }}
      # Opt-in per project: only worth it for mutable tags (a release
      # candidate that may be rebuilt), never for commit-SHA tags.
      backup_existing_tag: ${{ fromJson(needs.load-config.outputs.config).docker.backup_existing_tag == true }}
      # On a build-only run the image never reaches a registry, so export it as
      # a tarball for the container scanners to load.
      export_image_artifact: ${{ inputs.push != true && fromJson(needs.load-config.outputs.config).security.trivy.enabled == true }}
      artifact_name: ${{ needs.load-config.outputs.artifact_name }}
      # AWS Context for ECR
      aws_region: ${{ fromJson(needs.load-config.outputs.config).aws.region || 'us-east-1' }}
      role_to_assume: ${{ fromJson(needs.load-config.outputs.config).aws.role_to_assume || '' }}
      # Generic registry context
      registry_url: ${{ fromJson(needs.load-config.outputs.config).docker.registry_url || '' }}
      # Nexus Docker registry
      nexus_url: ${{ fromJson(needs.load-config.outputs.config).nexus.docker_registry_url || '' }}
      nexus_docker_repo: ${{ fromJson(needs.load-config.outputs.config).nexus.docker_repository || 'docker-hosted' }}
      # Nexus Artifact Download (Optimization)
      nexus_artifact_base_url: ${{ fromJson(needs.load-config.outputs.config).nexus.url || '' }}
      nexus_artifact_repo: ${{ fromJson(needs.load-config.outputs.config).nexus.repository || (needs.load-config.outputs.language == 'maven' && 'maven-releases' || 'raw-releases') }}
      nexus_artifact_path: ${{ needs.build-maven.outputs.nexus_path || needs.build-node.outputs.nexus_path || needs.build-python.outputs.nexus_path || '' }}
      # Build configuration
      build_args: ${{ fromJson(needs.load-config.outputs.config).docker.build_args || '' }}
      platforms: ${{ fromJson(needs.load-config.outputs.config).docker.platforms || 'linux/amd64' }}
      push: ${{ inputs.push }}

  # ---------------------------------------------------------------------------
  # 6. POST-BUILD SECURITY (SEQUENTIAL CHAIN)
  # Docker → Trivy → SBOM → SBOM-Scan
  # ---------------------------------------------------------------------------
  
  # STEP 1: Container Vulnerability Scan (Fails fast on CRITICAL CVEs)
      # Runs on both paths: a pushed image is pulled from the registry, and a
      # build-only image is loaded from the tarball docker-build exported.
  trivy:
    needs: [load-config, docker]
    if: |
      always() &&
      fromJson(needs.load-config.outputs.config).security.trivy.enabled == true &&
      needs.docker.result == 'success'
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/trivy-scan.yaml@v1
    secrets:
      # Generic-registry credentials first, Nexus as the fallback: these modules
      # expose a single credential pair, so it must match whichever registry the
      # image lives in.
      registry_username: ${{ secrets.registry_username || secrets.NEXUS_USERNAME }}
      registry_password: ${{ secrets.registry_password || secrets.NEXUS_PASSWORD }}
    with:
      scan_type: image
      image_uri: ${{ needs.docker.outputs.image_uri }}
      image_artifact: ${{ needs.docker.outputs.image_artifact }}
      # Registry Authentication
      registry_type: ${{ fromJson(needs.load-config.outputs.config).docker.registry_type || 'ecr' }}
      registry_username: ${{ inputs.registry_username }}
      # Prefer the docker registry the image was actually pushed to; fall back
      # to the Nexus docker registry for consumers using registry_type: nexus.
      registry_url: ${{ fromJson(needs.load-config.outputs.config).docker.registry_url || fromJson(needs.load-config.outputs.config).nexus.docker_registry_url || '' }}
      # AWS credentials for ECR access
      aws_region: ${{ fromJson(needs.load-config.outputs.config).aws.region || 'us-east-1' }}
      role_to_assume: ${{ fromJson(needs.load-config.outputs.config).aws.role_to_assume || '' }}
      # Scan configuration
      severity_threshold: ${{ fromJson(needs.load-config.outputs.config).security.trivy.severity || 'CRITICAL,HIGH' }}
      fail_on_vuln: ${{ fromJson(needs.load-config.outputs.config).security.trivy.fail_on_vuln != false }}
      ignore_unfixed: ${{ fromJson(needs.load-config.outputs.config).security.trivy.ignore_unfixed != false }}
      scanners: ${{ fromJson(needs.load-config.outputs.config).security.trivy.scanners || 'vuln,secret,misconfig' }}
      output_format: sarif

  # STEP 2: SBOM Generation (Only if Trivy passes or is skipped)
  sbom:
    needs: [load-config, docker, trivy]
    if: |
      always() &&
      fromJson(needs.load-config.outputs.config).security.sbom.enabled == true &&
      needs.docker.result == 'success' &&
      inputs.push == true &&
      (needs.trivy.result == 'success' || needs.trivy.result == 'skipped')
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/sbom-generate.yaml@v1
    secrets:
      # Generic-registry credentials first, Nexus as the fallback: these modules
      # expose a single credential pair, so it must match whichever registry the
      # image lives in.
      registry_username: ${{ secrets.registry_username || secrets.NEXUS_USERNAME }}
      registry_password: ${{ secrets.registry_password || secrets.NEXUS_PASSWORD }}
    with:
      sbom_type: image
      image_uri: ${{ needs.docker.outputs.image_uri }}
      # Registry Authentication
      registry_type: ${{ fromJson(needs.load-config.outputs.config).docker.registry_type || 'ecr' }}
      registry_username: ${{ inputs.registry_username }}
      # Prefer the docker registry the image was actually pushed to; fall back
      # to the Nexus docker registry for consumers using registry_type: nexus.
      registry_url: ${{ fromJson(needs.load-config.outputs.config).docker.registry_url || fromJson(needs.load-config.outputs.config).nexus.docker_registry_url || '' }}
      # AWS credentials for ECR access
      aws_region: ${{ fromJson(needs.load-config.outputs.config).aws.region || 'us-east-1' }}
      role_to_assume: ${{ fromJson(needs.load-config.outputs.config).aws.role_to_assume || '' }}
      # SBOM configuration
      format: ${{ fromJson(needs.load-config.outputs.config).security.sbom.format || 'cyclonedx-json' }}
      upload_artifact: true

  # STEP 3: SBOM CVE Scan (Dependency-level vulnerabilities)
  sbom-scan:
    needs: [load-config, sbom]
    if: |
      always() &&
      fromJson(needs.load-config.outputs.config).security.sbom_scan.enabled == true &&
      needs.sbom.result == 'success'
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/sbom-scan.yaml@v1
    with:
      sbom_artifact_name: ${{ needs.sbom.outputs.sbom_artifact_name }}
      severity_threshold: ${{ fromJson(needs.load-config.outputs.config).security.sbom_scan.severity || 'medium' }}
      output_format: ${{ fromJson(needs.load-config.outputs.config).security.sbom_scan.format || 'sarif' }}

  # ---------------------------------------------------------------------------
  # 6.5 AUTO-MERGE (Optional for PRs)
  # ---------------------------------------------------------------------------
  auto-merge:
    needs: load-config
    if: |
      github.event_name == 'pull_request' &&
      inputs.auto_merge == true
    # Scoped to this job only, so the rest of the pipeline keeps contents: read.
    # Still capped by whatever the calling repository's workflow granted --
    # a caller with contents: read will see this job fail, by design.
    permissions:
      contents: write
      pull-requests: write
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/auto-merge.yaml@v1
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 7. PIPELINE SUMMARY (Always runs for observability)
  # ---------------------------------------------------------------------------
  summary:
    if: always()
    needs: [load-config, sast-semgrep, sast-sonarqube, iac, build-node, build-python, build-maven, docker, trivy, sbom, sbom-scan, auto-merge]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    
    steps:
      - name: Generate Pipeline Summary
        env:
          NEED_LOAD_CONFIG_LANGUAGE: ${{ needs.load-config.outputs.language }}
          NEED_LOAD_CONFIG_SAST_TOOL: ${{ needs.load-config.outputs.sast_tool }}
          GH_SHA: ${{ github.sha }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_EVENT_NAME: ${{ github.event_name }}
          NEED_LOAD_CONFIG_RESULT: ${{ needs.load-config.result }}
          NEED_SAST_SEMGREP_RESULT: ${{ needs.sast-semgrep.result }}
          NEED_SAST_SONARQUBE_RESULT: ${{ needs.sast-sonarqube.result }}
          NEED_IAC_RESULT: ${{ needs.iac.result }}
          NEED_BUILD_NODE_RESULT: ${{ needs.build-node.result }}
          NEED_BUILD_PYTHON_RESULT: ${{ needs.build-python.result }}
          NEED_BUILD_MAVEN_RESULT: ${{ needs.build-maven.result }}
          NEED_DOCKER_RESULT: ${{ needs.docker.result }}
          NEED_TRIVY_RESULT: ${{ needs.trivy.result }}
          NEED_SBOM_RESULT: ${{ needs.sbom.result }}
          NEED_SBOM_SCAN_RESULT: ${{ needs.sbom-scan.result }}
          EXPR: ${{ contains(needs.*.result, 'failure') }}
          EXPR_2: ${{ contains(needs.*.result, 'cancelled') }}
          NEED_BUILD_MAVEN_NEXUS_PATH: ${{ needs.build-maven.outputs.nexus_path }}
          NEED_BUILD_MAVEN_ARTIFACT_FILE: ${{ needs.build-maven.outputs.artifact_file }}
          NEED_DOCKER_IMAGE_URI: ${{ needs.docker.outputs.image_uri }}
        run: |
          echo "## 🔐 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Configuration Info
          echo "### 📋 Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Language:** ${NEED_LOAD_CONFIG_LANGUAGE}" >> $GITHUB_STEP_SUMMARY
          echo "- **SAST Tool:** ${NEED_LOAD_CONFIG_SAST_TOOL}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${GH_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${GH_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${GH_EVENT_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Pipeline Stages
          echo "### 📊 Pipeline Stages" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Pre-Build** | |" >> $GITHUB_STEP_SUMMARY
          echo "| ├─ Config Validation | ${NEED_LOAD_CONFIG_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| ├─ SAST (Semgrep) | ${NEED_SAST_SEMGREP_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| ├─ SAST (SonarQube) | ${NEED_SAST_SONARQUBE_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| └─ IaC Scan | ${NEED_IAC_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build** | |" >> $GITHUB_STEP_SUMMARY
          echo "| ├─ Node.js Build | ${NEED_BUILD_NODE_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| ├─ Python Build | ${NEED_BUILD_PYTHON_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| └─ Maven Build | ${NEED_BUILD_MAVEN_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifact Management** | |" >> $GITHUB_STEP_SUMMARY
          
          echo "| **Container** | |" >> $GITHUB_STEP_SUMMARY
          echo "| └─ Docker Build | ${NEED_DOCKER_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Post-Build Security (Sequential)** | |" >> $GITHUB_STEP_SUMMARY
          echo "| ├─ 1️⃣ Trivy Scan | ${NEED_TRIVY_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| ├─ 2️⃣ SBOM Generation | ${NEED_SBOM_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| └─ 3️⃣ SBOM CVE Scan | ${NEED_SBOM_SCAN_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Overall Status
          if [[ "${EXPR}" == "true" ]]; then
            echo "### ❌ Pipeline Status: **FAILED**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "One or more stages failed. Please review the logs above." >> $GITHUB_STEP_SUMMARY
          elif [[ "${EXPR_2}" == "true" ]]; then
            echo "### ⚠️ Pipeline Status: **CANCELLED**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Pipeline was cancelled. This may be due to a newer commit being pushed." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Pipeline Status: **SUCCESS**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All enabled stages completed successfully!" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Nexus Info (if used)
          if [[ "${NEED_BUILD_MAVEN_RESULT}" == "success" ]]; then
            echo "### 📦 Nexus Upload (Maven)" >> $GITHUB_STEP_SUMMARY
            echo "- **Path:** ${NEED_BUILD_MAVEN_NEXUS_PATH}" >> $GITHUB_STEP_SUMMARY
            echo "- **Artifact:** ${NEED_BUILD_MAVEN_ARTIFACT_FILE}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Docker Image Info (if built)
          if [[ "${NEED_DOCKER_RESULT}" == "success" ]]; then
            echo "### 🐳 Container Image" >> $GITHUB_STEP_SUMMARY
            echo "Image URI: \`${NEED_DOCKER_IMAGE_URI}\`" >> $GITHUB_STEP_SUMMARY
          fi

      # Set final job status
      - name: Evaluate Final Status
        env:
          EXPR: ${{ contains(needs.*.result, 'failure') }}
        run: |
          if [[ "${EXPR}" == "true" ]]; then
            echo "::error::Pipeline failed - one or more stages reported failure"
            exit 1
          fi
