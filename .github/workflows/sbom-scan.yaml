name: "Module: SBOM Vulnerability Scan (Grype)"
# ------------------------------------------------------------------------------
# Vulnerability analysis based on existing SBOMs.
#
# PURPOSE:
# - Post-build / post-release analysis
# - Incident response (retroactive scanning)
# - Compliance & audit support
#
# GUARANTEES:
# - NEVER fails the pipeline (Report Only)
# - Supports scanning Artifacts from previous jobs
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      # --- TARGET ---
      sbom_path:
        description: "Path to SBOM file (if local in repo)"
        type: string
        default: ""
      
      sbom_artifact_name:
        description: "Artifact name to download (if SBOM is from previous job)"
        type: string
        default: ""

      # --- POLICY (Reporting Only) ---
      severity_threshold:
        description: "Severities to report (negligible,low,medium,high,critical)"
        type: string
        default: "medium"

      # --- OUTPUT ---
      output_format:
        description: "Output format (table, json, sarif)"
        type: string
        default: "sarif"

      upload_sarif:
        description: "Upload SARIF to GitHub Security tab"
        type: boolean
        default: true

      upload_artifact:
        description: "Upload scan report as artifact"
        type: boolean
        default: true

    outputs:
      scan_report_artifact:
        description: "Name of the uploaded scan report artifact"
        value: ${{ jobs.sbom-scan.outputs.report_name }}

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      sbom_path:
        description: "Path to SBOM file"
        type: string
        default: ""
      sbom_artifact_name:
        description: "Artifact name to download"
        type: string
        default: ""
      severity_threshold:
        description: "Severity threshold"
        type: choice
        options:
          - negligible
          - low
          - medium
          - high
          - critical
        default: "medium"
      output_format:
        description: "Output format"
        type: choice
        options:
          - sarif
          - json
          - table
        default: "sarif"
      upload_sarif:
        description: "Upload SARIF"
        type: boolean
        default: true
      upload_artifact:
        description: "Upload report artifact"
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sbom-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    outputs:
      report_name: ${{ steps.set_output.outputs.report_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ------------------------------------------------------------------------
      # ARTIFACT RETRIEVAL
      # ------------------------------------------------------------------------
      - name: Download SBOM Artifact
        if: inputs.sbom_artifact_name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.sbom_artifact_name }}
          path: .

      # ------------------------------------------------------------------------
      # VALIDATION & DISCOVERY
      # ------------------------------------------------------------------------
      - name: Locate SBOM File
        env:
          SBOM_PATH: ${{ inputs.sbom_path }}
          SBOM_ARTIFACT_NAME: ${{ inputs.sbom_artifact_name }}
        run: |
          # 1. Start with the explicit path input
          SBOM_FILE="${SBOM_PATH}"
          
          # 2. If no path, but artifact was downloaded, look for SBOM files specifically
          if [[ -z "$SBOM_FILE" && -n "${SBOM_ARTIFACT_NAME}" ]]; then
            echo "🔍 Searching for SBOM file in current directory..."
            ls -R .
            # First try: Look for files matching sbom-*.json pattern
            SBOM_FILE=$(find . -maxdepth 2 -name "sbom-*.json" -type f -print -quit)
            
            # Second try: Look for files containing SBOM markers (CycloneDX or SPDX)
            if [[ -z "$SBOM_FILE" ]]; then
              echo "Looking for SBOM format markers..."
              # NUL-delimited so filenames containing spaces are handled.
              while IFS= read -r -d '' json_file; do
                if grep -q -E '"bomFormat"|"spdxVersion"' "$json_file" 2>/dev/null; then
                  SBOM_FILE="$json_file"
                  echo "Found SBOM format in: $json_file"
                  break
                fi
              done < <(find . -maxdepth 2 -name "*.json" -type f -print0)
            fi
          fi
          
          # 3. Final Validation
          if [[ ! -f "$SBOM_FILE" ]]; then
            echo "::error::SBOM file not found."
            ls -R .
            exit 1
          fi
          
          echo "Using SBOM file: $SBOM_FILE"
          echo "SBOM_FILE=$SBOM_FILE" >> $GITHUB_ENV

      # ------------------------------------------------------------------------
      # EXECUTION (Grype CLI)
      # ------------------------------------------------------------------------
      - name: Install Grype
        run: |
          set -euo pipefail
          # Keep this in step with the Syft that produces the SBOM. Grype can only
          # decode SBOM formats its embedded Syft understands, and a stale pin
          # fails with "sbom format not recognized" rather than anything obvious.
          VERSION="v0.118.0"
          # Fetch the installer from the pinned release tag, not from `main`:
          # a branch ref is mutable and this script runs as root on the runner.
          curl -sSfL "https://raw.githubusercontent.com/anchore/grype/${VERSION}/install.sh" \
            | sh -s -- -b /usr/local/bin "${VERSION}"
          grype version

      - name: Run Grype Analysis
        id: grype
        timeout-minutes: 10
        env:
          GRYPE_DB_VALIDATE_AGE: "false"
          SEVERITY_THRESHOLD: ${{ inputs.severity_threshold }}
          OUTPUT_FORMAT: ${{ inputs.output_format }}
        run: |
          echo "🔍 Updating Grype Database..."
          grype db update || echo "::warning::Grype DB update failed. Using existing DB."

          echo "🔍 Scanning SBOM: ${SBOM_FILE}"
          REPORT="grype-results.${OUTPUT_FORMAT}"

          # Grype exits non-zero both for "vulnerabilities at or above the
          # threshold" and for hard failures such as an SBOM it cannot decode.
          # Collapsing the two into one warning hid a complete scan failure
          # behind a "vulnerabilities found" message, and left an unusable report
          # that only surfaced later as "Invalid SARIF". Tell them apart by
          # checking whether a usable report was actually produced.
          set +e
          grype "sbom:${SBOM_FILE}" \
            --fail-on "${SEVERITY_THRESHOLD}" \
            --output "${OUTPUT_FORMAT}" \
            --file "$REPORT"
          GRYPE_EXIT=$?
          set -e

          if [[ ! -s "$REPORT" ]]; then
            echo "::error::Grype produced no report (exit ${GRYPE_EXIT}); the SBOM was not scanned."
            echo "report_valid=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [[ "$OUTPUT_FORMAT" == "sarif" || "$OUTPUT_FORMAT" == "json" ]]; then
            if ! jq empty "$REPORT" 2>/dev/null; then
              echo "::error::Grype wrote a malformed ${OUTPUT_FORMAT} report (exit ${GRYPE_EXIT}); refusing to upload it."
              echo "report_valid=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

          echo "report_valid=true" >> "$GITHUB_OUTPUT"
          if [[ $GRYPE_EXIT -ne 0 ]]; then
            echo "::warning::Vulnerabilities at or above '${SEVERITY_THRESHOLD}' were found. See the Security tab."
          else
            echo "✅ No vulnerabilities at or above '${SEVERITY_THRESHOLD}'."
          fi

      # ------------------------------------------------------------------------
      # REPORTING
      # ------------------------------------------------------------------------
      # Only upload a report Grype actually produced and that parses. Uploading
      # an empty file fails with "Invalid SARIF", which obscures the real cause.
      - name: Upload SARIF to Security Tab
        if: always() && inputs.upload_sarif == true && inputs.output_format == 'sarif' && steps.grype.outputs.report_valid == 'true'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: grype-results.sarif
          category: sbom-grype

      - name: Upload Scan Report Artifact
        if: inputs.upload_artifact == true && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-scan-report-${{ github.sha }}
          path: grype-results.*
          retention-days: 180

      - name: Set Output
        id: set_output
        env:
          UPLOAD_ARTIFACT: ${{ inputs.upload_artifact }}
          GH_SHA: ${{ github.sha }}
        run: |
          if [[ "${UPLOAD_ARTIFACT}" == "true" ]]; then
            echo "report_name=sbom-scan-report-${GH_SHA}" >> $GITHUB_OUTPUT
          else
            echo "report_name=" >> $GITHUB_OUTPUT
          fi
