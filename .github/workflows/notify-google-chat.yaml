name: "Module: Google Chat Notification"

# ------------------------------------------------------------------------------
# Sends a notification card to Google Chat via webhook: CI results, published
# images, releases, deployments, rollbacks.
#
# A missing webhook or a rejected send FAILS the job. Notifications are how the
# team learns what happened; a silent skip would hide every build and deploy.
# Callers that don't want notifications turn them off in their config
# (notifications.enabled: false) instead of leaving the secret unset.
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      status:
        description: "starting, success, failure, rollback, warning or info"
        type: string
        required: true
      title:
        description: "Card title. Defaults to one derived from status (deployment wording)."
        type: string
        default: ""
      environment:
        description: "Target environment, if any"
        type: string
        default: ""
      component:
        description: "Component the event is about, if any"
        type: string
        default: ""
      image_uri:
        description: "Image URI, if any"
        type: string
        default: ""
      details:
        description: 'Extra rows, one "Label: value" per line'
        type: string
        default: ""
      message:
        description: "Free text shown under the details (findings, failing stages, ...)"
        type: string
        default: ""

    secrets:
      GOOGLE_CHAT_WEBHOOK:
        description: "Google Chat webhook URL"
        required: false

  workflow_dispatch:
    inputs:
      status:
        description: "Status"
        type: choice
        options:
          - starting
          - success
          - failure
          - rollback
          - warning
          - info
        required: true
      title:
        description: "Title"
        type: string
        default: ""
      environment:
        description: "Environment"
        type: string
        default: ""
      message:
        description: "Message"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # A pull request from a fork never gets secrets, whatever the repository
      # holds, so a missing webhook there is expected: warn and carry on (the
      # merge's push run notifies). Anywhere else a missing webhook is a
      # misconfiguration and fails the job.
      - name: Require Webhook
        id: webhook
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [[ -n "$WEBHOOK_URL" ]]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only `pull_request`: `pull_request_target` runs do get secrets.
          if [[ "$EVENT" == "pull_request" && -n "$HEAD_REPO" && "$HEAD_REPO" != "$REPO" ]]; then
            echo "::warning::No GOOGLE_CHAT_WEBHOOK on a pull request from a fork (${HEAD_REPO}): GitHub withholds secrets there, so no notification is sent. The push run after the merge notifies."
            echo "### 🔕 Notification not sent: pull request from a fork (no secrets)" >> "$GITHUB_STEP_SUMMARY"
            echo "send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::GOOGLE_CHAT_WEBHOOK is not set, so this notification cannot be sent. Add the secret to the repository (or organization), or turn notifications off in the DevX config (notifications.enabled: false)."
          exit 1

      - name: Send Google Chat Notification
        if: steps.webhook.outputs.send == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          STATUS: ${{ inputs.status }}
          TITLE: ${{ inputs.title }}
          ENVIRONMENT: ${{ inputs.environment }}
          COMPONENT: ${{ inputs.component }}
          IMAGE_URI: ${{ inputs.image_uri }}
          DETAILS: ${{ inputs.details }}
          MESSAGE: ${{ inputs.message }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$STATUS" in
            starting) EMOJI="🚀"; DEFAULT="Deployment starting" ;;
            success)  EMOJI="✅"; DEFAULT="Deployment succeeded" ;;
            failure)  EMOJI="❌"; DEFAULT="Deployment failed" ;;
            rollback) EMOJI="↩️"; DEFAULT="Deployment rolled back" ;;
            warning)  EMOJI="⚠️"; DEFAULT="Warning" ;;
            *)        EMOJI="ℹ️"; DEFAULT="Update" ;;
          esac
          TITLE="${TITLE:-$DEFAULT}"
          SUBTITLE="${REPO}${COMPONENT:+ · ${COMPONENT}}${ENVIRONMENT:+ · ${ENVIRONMENT}}"

          # Rows: fixed facts first, then the caller's "Label: value" lines.
          ROWS=$(jq -n '[]')
          add_row() {
            [[ -z "$2" ]] && return 0
            ROWS=$(jq --arg l "$1" --arg t "$2" '. + [{decoratedText: {topLabel: $l, text: $t, wrapText: true}}]' <<<"$ROWS")
          }
          add_row "Environment" "$ENVIRONMENT"
          add_row "Component" "$COMPONENT"
          add_row "Image" "$IMAGE_URI"
          while IFS= read -r line; do
            [[ -z "${line// }" || "$line" != *:* ]] && continue
            add_row "$(echo "${line%%:*}" | xargs)" "$(echo "${line#*:}" | sed 's/^ *//')"
          done <<<"$DETAILS"
          add_row "Branch / ref" "$REF_NAME"
          add_row "Commit" "${GH_SHA:0:7}"
          add_row "Triggered by" "${ACTOR} (${EVENT})"

          CARD=$(jq -n \
            --arg title "${EMOJI} ${TITLE}" \
            --arg subtitle "$SUBTITLE" \
            --arg message "$MESSAGE" \
            --arg url "$RUN_URL" \
            --argjson rows "$ROWS" \
            '{cardsV2: [{cardId: "devx-notification", card: {
                header: {title: $title, subtitle: $subtitle},
                sections: ([{widgets: $rows}]
                  + (if $message != "" then [{widgets: [{textParagraph: {text: $message}}]}] else [] end)
                  + [{widgets: [{buttonList: {buttons: [{text: "View run", onClick: {openLink: {url: $url}}}]}}]}])
              }}]}')

          HTTP_STATUS=$(curl -sS -o response.txt -w "%{http_code}" -X POST \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d "$CARD" "$WEBHOOK_URL") || HTTP_STATUS="000"
          if [[ "$HTTP_STATUS" != 2* ]]; then
            echo "::error::Google Chat rejected the notification (HTTP ${HTTP_STATUS}):"
            cat response.txt || true
            exit 1
          fi
          echo "Sent: ${TITLE}"
          {
            echo "### 🔔 Notification sent"
            echo ""
            echo "${EMOJI} **${TITLE}** — ${SUBTITLE}"
          } >> "$GITHUB_STEP_SUMMARY"
