name: "Module: Deploy to EKS (Helm)"

# ------------------------------------------------------------------------------
# Kubernetes deployment via Helm charts.
# Supports: Blue/Green, Canary (future), Standard Rolling Update.
# ------------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      # --- REQUIRED ---
      environment:
        description: "Target environment"
        type: string
        required: true
      image_uri:
        description: "Docker image URI to deploy"
        type: string
        required: true
      cluster_name:
        description: "EKS cluster name"
        type: string
        required: true
      
      # --- HELM SETTINGS ---
      helm_chart_path:
        description: "Path to Helm chart"
        type: string
        required: true
      helm_release_name:
        description: "Helm release name"
        type: string
        required: true
      helm_values_file:
        description: "Path to values file"
        type: string
        default: ""
      helm_set_values:
        description: "Additional --set values (comma-separated key=value)"
        type: string
        default: ""
      image_pull_secret:
        description: "Name of the Kubernetes secret for Docker registry auth"
        type: string
        default: "nexus-credentials"
      ingress_domain:
        description: "Root domain for ingress fallbacks (e.g., example.com)"
        type: string
        default: ""
      
      # --- NAMESPACE ---
      namespace:
        description: "Kubernetes namespace"
        type: string
        default: "default"
      create_namespace:
        description: "Create namespace if not exists"
        type: boolean
        default: true
      
      # --- DEPLOYMENT STRATEGY ---
      strategy:
        description: "Deployment strategy: rolling, blue-green, canary"
        type: string
        default: "rolling"
      
      # --- TIMING ---
      timeout:
        description: "Helm timeout (e.g., 10m)"
        type: string
        default: "10m"
      
      # --- AWS ---
      aws_region:
        description: "AWS region"
        type: string
        default: "us-east-1"
      role_to_assume:
        description: "AWS IAM role for OIDC"
        type: string
        required: true
      
      # --- OPTIONS ---
      dry_run:
        description: "Dry run mode"
        type: boolean
        default: false
      atomic:
        description: "Rollback on failure"
        type: boolean
        default: true

    outputs:
      status:
        description: "Deployment status"
        value: ${{ jobs.deploy.outputs.status }}
      revision:
        description: "Helm revision number"
        value: ${{ jobs.deploy.outputs.revision }}
      manifest:
        description: "Applied manifest summary"
        value: ${{ jobs.deploy.outputs.manifest }}
      url:
        description: "Deployment URL"
        value: ${{ jobs.deploy.outputs.url }}

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        type: choice
        options:
          - dev
          - qa
          - staging
          - production
        required: true
      image_uri:
        description: "Image URI"
        type: string
        required: true
      cluster_name:
        description: "EKS cluster name"
        type: string
        required: true
      helm_chart_path:
        description: "Helm chart path"
        type: string
        required: true
      helm_release_name:
        description: "Release name"
        type: string
        required: true
      namespace:
        description: "Namespace"
        type: string
        default: "default"
      dry_run:
        description: "Dry run"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy_url.outputs.url }}
    
    outputs:
      status: ${{ steps.result.outputs.status }}
      revision: ${{ steps.helm_deploy.outputs.revision }}
      manifest: ${{ steps.helm_deploy.outputs.manifest }}
      url: ${{ steps.deploy_url.outputs.url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup kubectl
        env:
          NAMESPACE: ${{ inputs.namespace }}
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          echo "🔧 Configuring kubectl for EKS cluster: ${CLUSTER_NAME}"
          aws eks update-kubeconfig \
            --name "${CLUSTER_NAME}" \
            --region "${AWS_REGION}"
          
          # Verify connectivity
          # 'kubectl cluster-info' lists services in kube-system, which a deploy
          # role scoped to a single namespace -- the recommended setup -- cannot
          # read, so it fails with Forbidden on a perfectly good connection.
          # Discovery and SelfSubjectAccessReview are available to any
          # authenticated principal, so check reachability and access that way.
          kubectl version --request-timeout=20s >/dev/null || {
            echo "::error::Cannot reach the Kubernetes API"
            exit 1
          }
          if [[ -n "${NAMESPACE:-}" ]]; then
            kubectl auth can-i get deployments -n "${NAMESPACE}" >/dev/null || {
              echo "::error::Reached the cluster but have no access in namespace '${NAMESPACE}'"
              echo "::error::Check the EKS access entry / RBAC binding for this role."
              exit 1
            }
          fi
          
          echo "✅ Connected to cluster"
          
      - name: Verify Image Pull Secret
        env:
          IMAGE_PULL_SECRET: ${{ inputs.image_pull_secret }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          SECRET_NAME="${IMAGE_PULL_SECRET}"
          echo "🔍 Verifying image pull secret: $SECRET_NAME"
          if ! kubectl get secret "$SECRET_NAME" -n "${NAMESPACE}" > /dev/null 2>&1; then
            echo "::warning::Image pull secret '$SECRET_NAME' not found in namespace '${NAMESPACE}'"
            echo "::warning::Deployment might fail with ImagePullBackOff/401 Unauthorized"
          else
            echo "✅ Image pull secret found"
          fi

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: '3.14.0'

      - name: Validate Helm Chart
        env:
          HELM_CHART_PATH: ${{ inputs.helm_chart_path }}
        run: |
          echo "🔍 Validating Helm chart: ${HELM_CHART_PATH}"
          
          if [[ ! -d "${HELM_CHART_PATH}" ]]; then
            echo "::error::Helm chart not found: ${HELM_CHART_PATH}"
            exit 1
          fi
          
          helm lint "${HELM_CHART_PATH}" || {
            echo "::error::Helm lint failed"
            exit 1
          }
          
          echo "✅ Helm chart validation passed"

      # Building the invocation as an argv array (rather than assembling a
      # command string and re-parsing it) keeps every value a single argument,
      # so a chart path or --set value can never be read as shell syntax.
      - name: Deploy with Helm
        id: helm_deploy
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          CHART: ${{ inputs.helm_chart_path }}
          RELEASE: ${{ inputs.helm_release_name }}
          NAMESPACE: ${{ inputs.namespace }}
          IMAGE_URI: ${{ inputs.image_uri }}
          CREATE_NAMESPACE: ${{ inputs.create_namespace }}
          VALUES_FILE: ${{ inputs.helm_values_file }}
          SET_VALUES: ${{ inputs.helm_set_values }}
          TIMEOUT: ${{ inputs.timeout }}
          ATOMIC: ${{ inputs.atomic }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail

          echo "Deploying to EKS"
          echo "  Environment: $ENVIRONMENT"
          echo "  Cluster:     $CLUSTER_NAME"
          echo "  Namespace:   $NAMESPACE"

          # Split on the LAST separator so a registry with an explicit port
          # (host:5000/img:tag) and digest references both parse correctly.
          if [[ "$IMAGE_URI" == *"@"* ]]; then
            IMAGE_REPO="${IMAGE_URI%@*}"
            IMAGE_TAG="${IMAGE_URI##*@}"
          else
            IMAGE_REPO="${IMAGE_URI%:*}"
            IMAGE_TAG="${IMAGE_URI##*:}"
            if [[ "$IMAGE_REPO" == "$IMAGE_URI" ]]; then
              echo "::error::image_uri must include a tag or digest: $IMAGE_URI"
              exit 1
            fi
          fi
          echo "  Repository:  $IMAGE_REPO"
          echo "  Tag:         $IMAGE_TAG"

          ARGS=(upgrade --install "$RELEASE" "$CHART"
                --namespace "$NAMESPACE"
                --set "image.repository=$IMAGE_REPO"
                --set "image.tag=$IMAGE_TAG"
                --timeout "$TIMEOUT" --wait)

          [[ "$CREATE_NAMESPACE" == "true" ]] && ARGS+=(--create-namespace)
          [[ "$ATOMIC"           == "true" ]] && ARGS+=(--atomic)
          [[ "$DRY_RUN"          == "true" ]] && ARGS+=(--dry-run)

          if [[ -n "$VALUES_FILE" ]]; then
            if [[ -f "$VALUES_FILE" ]]; then
              ARGS+=(--values "$VALUES_FILE")
            else
              echo "::warning::helm_values_file '$VALUES_FILE' not found; ignoring."
            fi
          fi

          if [[ -n "$SET_VALUES" ]]; then
            IFS=',' read -ra VALUES <<< "$SET_VALUES"
            for val in "${VALUES[@]}"; do
              [[ -n "$val" ]] && ARGS+=(--set "$val")
            done
          fi

          echo "Executing: helm ${ARGS[*]}"
          helm "${ARGS[@]}" 2>&1 | tee deploy-output.txt
          DEPLOY_EXIT=${PIPESTATUS[0]}

          if [[ $DEPLOY_EXIT -ne 0 ]]; then
            echo "::error::Helm deployment failed"

            echo "--- POD DIAGNOSTICS (Post-Failure) ---"
            kubectl get pods -n "$NAMESPACE" -l "app.kubernetes.io/instance=$RELEASE" || true

            echo "--- RECENT EVENTS ---"
            kubectl get events -n "$NAMESPACE" --sort-by='.lastTimestamp' | tail -20 || true

            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          REVISION=$(helm history "$RELEASE" -n "$NAMESPACE" -o json | jq -r '.[-1].revision')
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

          MANIFEST=$(helm get manifest "$RELEASE" -n "$NAMESPACE" | grep "kind:" | sort | uniq -c || echo "N/A")
          {
            echo "manifest<<MANIFEST_EOF"
            echo "$MANIFEST"
            echo "MANIFEST_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "Deployment completed (revision: $REVISION)"

      - name: Verify Deployment
        if: inputs.dry_run != true
        env:
          NAMESPACE: ${{ inputs.namespace }}
          HELM_RELEASE_NAME: ${{ inputs.helm_release_name }}
        run: |
          echo "🔍 Verifying deployment..."
          
          
          # Get pods
          echo "Pod Status:"
          kubectl get pods -n "$NAMESPACE" -l "app.kubernetes.io/instance=${HELM_RELEASE_NAME}" --no-headers
          
          # Get services
          echo ""
          echo "Services:"
          kubectl get svc -n "$NAMESPACE" -l "app.kubernetes.io/instance=${HELM_RELEASE_NAME}" --no-headers
          
          # Wait for pods to be ready
          kubectl wait --for=condition=Ready pods \
            -l "app.kubernetes.io/instance=${HELM_RELEASE_NAME}" \
            -n "$NAMESPACE" \
            --timeout=5m || {
            echo "::warning::Some pods may not be ready"
          }

      - name: Set Result
        id: result
        if: always()
        env:
          STEP_HELM_DEPLOY_STATUS: ${{ steps.helm_deploy.outputs.status }}
        run: |
          if [[ "${STEP_HELM_DEPLOY_STATUS}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Generate Deployment URL
        id: deploy_url
        env:
          NAMESPACE: ${{ inputs.namespace }}
          HELM_RELEASE_NAME: ${{ inputs.helm_release_name }}
          INGRESS_DOMAIN: ${{ inputs.ingress_domain }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # Try to get host from ingress rules first
          INGRESS_HOST=$(kubectl get ingress -n "${NAMESPACE}" \
            -l "app.kubernetes.io/instance=${HELM_RELEASE_NAME}" \
            -o jsonpath='{.items[0].spec.rules[0].host}' 2>/dev/null || echo "")
          
          # If no host, try to get ALB DNS name from status
          if [[ -z "$INGRESS_HOST" ]]; then
             INGRESS_ALB=$(kubectl get ingress -n "${NAMESPACE}" \
              -l "app.kubernetes.io/instance=${HELM_RELEASE_NAME}" \
              -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
             
             if [[ -n "$INGRESS_ALB" ]]; then
               echo "url=http://$INGRESS_ALB" >> $GITHUB_OUTPUT
               exit 0
             fi
          fi

          if [[ -n "$INGRESS_HOST" ]]; then
            echo "url=https://$INGRESS_HOST" >> $GITHUB_OUTPUT
          elif [[ -n "${INGRESS_DOMAIN}" ]]; then
            echo "url=https://${ENVIRONMENT}.${INGRESS_DOMAIN}" >> $GITHUB_OUTPUT
          else
            echo "url=N/A" >> $GITHUB_OUTPUT
          fi

      - name: Generate Summary
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          NAMESPACE: ${{ inputs.namespace }}
          HELM_RELEASE_NAME: ${{ inputs.helm_release_name }}
          STEP_HELM_DEPLOY_REVISION: ${{ steps.helm_deploy.outputs.revision }}
          IMAGE_URI: ${{ inputs.image_uri }}
          DRY_RUN: ${{ inputs.dry_run }}
          STEP_HELM_DEPLOY_MANIFEST: ${{ steps.helm_deploy.outputs.manifest }}
          STEP_RESULT_STATUS: ${{ steps.result.outputs.status }}
        run: |
          echo "## 🚀 EKS Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${ENVIRONMENT} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cluster | ${CLUSTER_NAME} |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | ${NAMESPACE} |" >> $GITHUB_STEP_SUMMARY
          echo "| Helm Release | ${HELM_RELEASE_NAME} |" >> $GITHUB_STEP_SUMMARY
          echo "| Revision | ${STEP_HELM_DEPLOY_REVISION} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${IMAGE_URI}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry Run | ${DRY_RUN} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Manifest Summary" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${STEP_HELM_DEPLOY_MANIFEST}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${STEP_RESULT_STATUS}" == "success" ]]; then
            echo "### ✅ Deployment: **SUCCESS**" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Deployment: **FAILED**" >> $GITHUB_STEP_SUMMARY
          fi

