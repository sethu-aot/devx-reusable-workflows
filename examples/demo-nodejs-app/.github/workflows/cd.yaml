# CD Trigger Workflow for demo-nodejs-app
# This manually triggers the CD pipeline via the orchestrator

name: CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options:
          - dev
          - qa
          - staging
          - production
        default: "dev"
        required: true
      image_uri:
        description: "Docker image URI to deploy, including tag or digest"
        type: string
        required: true

# Token scopes required by the DevX orchestrators. Reusable workflows can never
# hold MORE permission than their caller, so these must be declared here.
# A CD-only workflow needs fewer scopes than the CI pipeline.
permissions:
  contents: read          # checkout
  id-token: write         # AWS OIDC (EKS/ECS/EC2 deploys)
  actions: read           # artifact metadata
  deployments: write      # GitHub Deployments API

jobs:
  deploy:
    name: Trigger Deployment
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/cd-orchestrator.yaml@v1
    with:
      environment: ${{ inputs.environment }}
      image_uri: ${{ inputs.image_uri }}
      config_path: "devx-config.yaml"
    secrets: inherit
