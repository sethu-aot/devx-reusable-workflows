# Standard CI Workflow for Project Repositories
# Use this in ALL project repos calling DevX reusable workflows
#
# Location: .github/workflows/ci.yaml

name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

# ⚠️ IMPORTANT: Do NOT add concurrency here
# Concurrency is handled in ci-orchestrator.yaml
# Adding it here causes deadlock!

# Token scopes required by the DevX orchestrators. Reusable workflows can never
# hold MORE permission than their caller, so these must be declared here.
permissions:
  contents: read          # checkout
  id-token: write         # AWS OIDC (ECR push, EKS/ECS/EC2 deploys)
  security-events: write  # SARIF upload to the Security tab
  actions: read           # SARIF metadata for private repos
  packages: write         # GHCR push
  pull-requests: write    # SonarQube PR decoration
  deployments: write      # GitHub Deployments API

jobs:
  ci:
    name: DevX CI Pipeline
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/ci-orchestrator.yaml@v1
    with:
      config_path: devx-ci.yaml
    secrets: inherit

  cd:
    name: CD Deployment
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/cd-orchestrator.yaml@v1
    with:
      environment: dev
      image_uri: ${{ needs.ci.outputs.image_uri }}
      config_path: "devx-config.yaml"
    secrets: inherit